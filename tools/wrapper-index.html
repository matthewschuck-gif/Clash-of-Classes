<!DOCTYPE html>
<!-- clashofclasses.org: shows the Clash of Classes Apps Script web app full-screen.
     The site and its data live in Apps Script + the Clash of Classes Points Sheet; nothing
     else is stored here. At cutover this file becomes the repo's index.html. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d2b9f">
<title>Clash of Classes — Ephrata Middle School</title>
<meta name="description" content="Live squad standings, monthly LRG traits, and events for Ephrata Middle School's Clash of Classes program.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #1c1917; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="Clash of Classes" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
<script>
  // The Apps Script web app (Deploy › Manage deployments; New version keeps this address).
  var APP = 'https://script.google.com/macros/s/AKfycbyRCm58vW1HMZ6NefMzdgNBzJHwd3wbZ4mscPPqlr8Z6oRe769B101hWJe12xC2GAmMjQ/exec';
  // Pass ?page=, ?tv=1, ?view=… straight through.
  document.getElementById('app').src = APP + location.search;
  // No service worker is registered here. Browsers that still have the old site's offline
  // cache fetch the new sw.js by themselves, and it clears that cache once.
</script>
</body>
</html>
