<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=DM+Mono:wght@500&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#12081f; --panel:#1d1033; --line:#38255a; --ink:#f6f0ff; --mute:#b9a6d8; --gold:#ffe100; --sq:#b583ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
  body { background: radial-gradient(900px 600px at 50% -10%, color-mix(in srgb, var(--sq) 35%, transparent) 0%, transparent 65%), var(--bg); }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 40px; text-align:center; }
  h1 { font-family:Fraunces,Georgia,serif; font-weight:900; font-size:clamp(30px,8vw,46px); margin:6px 0 2px; letter-spacing:-.02em; }
  .tag { font-family:'DM Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:20px 18px; margin-top:16px; }
  .sub { color:var(--mute); font-size:15px; line-height:1.5; margin:6px 0 0; }
  input { font:inherit; font-size:22px; letter-spacing:.08em; text-align:center; width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:#0d0618; color:var(--ink); }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:999px; padding:12px 20px; }
  .go { background:var(--gold); color:#1a0b2e; width:100%; margin-top:12px; font-size:18px; }
  .roll { width:min(260px,70vw); aspect-ratio:1; border-radius:36px; font-family:Fraunces,serif; font-weight:900; font-size:clamp(40px,11vw,64px); background:var(--sq); color:#12081f;
    box-shadow:0 14px 0 color-mix(in srgb, var(--sq) 55%, #000), 0 24px 40px #000a; margin:18px auto 6px; display:block; transition: transform .12s; }
  .roll:active { transform: translateY(8px); box-shadow:0 6px 0 color-mix(in srgb, var(--sq) 55%, #000), 0 12px 24px #000a; }
  .roll:disabled { opacity:.35; transform:none; }
  .paths { display:grid; gap:12px; margin-top:14px; }
  .path { background:#ffffff14; color:var(--ink); border:2px solid var(--sq); border-radius:18px; padding:16px; font-size:19px; }
  .path small { display:block; color:var(--mute); font-weight:400; font-size:13px; margin-top:4px; }
  .stats { display:flex; justify-content:center; gap:26px; margin-top:6px; }
  .stats div { font-family:Fraunces,serif; font-weight:900; font-size:34px; color:var(--gold); }
  .stats span { display:block; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--mute); font-weight:500; }
  .wait { font-size:18px; margin-top:8px; }
  .who { display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:10px; }
  .slogo { width:96px; height:96px; border-radius:22px; display:grid; place-items:center; padding:8px; box-shadow:0 8px 20px #0007; }
  .slogo img { width:100%; height:100%; object-fit:contain; }
  .spiece { width:96px; height:96px; border-radius:50%; border:4px solid; background:#1d1033 no-repeat; background-size:240%; box-shadow:0 8px 20px #0007; }
  .msg { color:#fca5a5; min-height:1.2em; margin-top:10px; font-size:15px; }
  .small { font-size:13px; color:var(--mute); margin-top:14px; }
  .small a { color:var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Clash of Classes</div>
  <h1>Summit Party</h1>
  <div id="app"><div class="card"><p class="sub">Loading…</p></div></div>
</div>
<script>
(function () {
  var COLORS = { BLACK: '#e9e3f5', GOLD: '#ffd23f', GREY: '#9aa5b8', PURPLE: '#b583ff' };
  var BASE = { BLACK: '#2b2633', GOLD: '#a87b00', GREY: '#5d6673', PURPLE: '#5b1a86' };
  var FOCUS = { BLACK: '47% 11%', GOLD: '72% 2%', GREY: '77% 11%', PURPLE: '69% 0%' };
  var LOGOS = {};
  run('clashSquadLogos').then(function (l) { LOGOS = l || {}; if (S) draw(); }).catch(function () {});
  var me = '', squad = '', S = null, seq = 0, acting = false, code = '';
  try { me = localStorage.getItem('clash-my-800') || ''; code = sessionStorage.getItem('summit-code') || ''; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { s = String(s || ''); return s.charAt(0) + s.slice(1).toLowerCase(); }
  function run(fn) { var a = Array.prototype.slice.call(arguments, 1); return new Promise(function (ok, no) { var r = google.script.run.withSuccessHandler(function (t) { ok(JSON.parse(t)); }).withFailureHandler(no); r[fn].apply(r, a); }); }
  function msgOf(e) { return String(e && e.message || e).replace(/^Exception:\s{0,}/, ''); }

  function ask(err) {
    $('app').innerHTML = '<div class="card"><p class="sub" style="margin:0 0 12px">Type the game code on the big screen, then your 800 number. Your squad plays from this Chromebook.</p>' +
      '<input id="code" autocomplete="off" autocapitalize="characters" maxlength="4" value="' + esc(code) + '" placeholder="GAME CODE" aria-label="Game code" style="text-transform:uppercase;margin-bottom:10px">' +
      '<input id="id" inputmode="numeric" autocomplete="off" maxlength="10" value="' + esc(me) + '" placeholder="800 number" aria-label="Your 800 number">' +
      '<button class="go" id="join">Join my squad</button><div class="msg" id="msg">' + esc(err || '') + '</div></div>';
    (code ? $('id') : $('code')).focus();
    var go = function () { me = $('id').value.replace(/\D/g, ''); code = $('code').value.toUpperCase().replace(/[^A-Z]/g, ''); join(); };
    $('join').onclick = go; $('id').onkeydown = $('code').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  function join() {
    run('clashSummitJoin', me, code).then(function (r) {
      squad = r.squad; code = r.code; try { localStorage.setItem('clash-my-800', me); sessionStorage.setItem('summit-code', code); } catch (e) {}
      document.documentElement.style.setProperty('--sq', COLORS[squad] || '#b583ff');
      take(r.state);
    }).catch(function (e) { ask(msgOf(e)); });
  }
  function take(v) {
    if (!v || v.same) return;
    if (!v.on) { $('app').innerHTML = '<div class="card"><p class="sub">Summit Party is closed right now.</p></div>'; return; }
    S = v; seq = v.game ? v.game.seq : 0; draw();
  }
  function draw() {
    var g = S.game, mine = g && g.squads[squad], el = $('app');
    var art = S.art && S.art.pieces && S.art.pieces[squad];
    var head = '<div class="card"><div class="who">' + (LOGOS[squad] ? '<span class="slogo" style="background:' + BASE[squad] + '"><img src="' + LOGOS[squad] + '" alt="' + esc(title(squad)) + ' Squad logo"></span>' : '') +
      (art ? '<span class="spiece" style="background-image:url(&quot;' + art + '&quot;);background-position:' + FOCUS[squad] + ';border-color:var(--sq)" role="img" aria-label="Your squad piece"></span>' : '') + '</div>' +
      '<div style="font-family:Fraunces,serif;font-weight:900;font-size:26px;color:var(--sq)">' + esc(title(squad)) + ' Squad</div>' +
      (mine ? '<div class="stats"><div>' + mine.flags + '<span>FLAGS</span></div><div>' + mine.coins + '<span>COINS</span></div>' + (mine.boost ? '<div>+' + mine.boost + '<span>NEXT ROLL</span></div>' : '') + '</div>' : '');
    if (!g || g.status !== 'playing') {
      el.innerHTML = head + '<p class="wait">' + (g && g.places ? esc(title(g.places[0])) + ' won the last game.' : 'Waiting for a game to start.') + '</p><p class="sub">Watch the big screen.</p></div>' + foot();
      wireFoot(); return;
    }
    var now = g.order[g.turn], pend = g.pending, myTurn = now === squad && !pend, myPick = pend && pend.squad === squad;
    var body = '<p class="sub">Round ' + Math.min(g.round, g.rounds) + ' of ' + g.rounds + '</p>';
    var L = g.last || {};
    if (L.squad === squad && L.roll) body += '<p class="sub">You rolled <b style="color:var(--gold)">' + L.roll + '</b>' + (L.card ? ' · ' + esc(L.card) : '') + '</p>';
    if (myPick) body += '<p class="wait">You reached a fork. Which way?</p><div class="paths">' + pend.options.map(function (o) {
      var hint = o.name === 'Main Trail' ? 'The long way around, more coins' : 'Shorter and riskier';
      return '<button class="path" data-pick="' + o.id + '">' + esc(o.name) + '<small>' + esc(hint) + '</small></button>'; }).join('') + '</div>';
    else if (myTurn) body += '<button class="roll" id="roll">ROLL</button><p class="sub">Your squad\'s turn!</p>';
    else body += '<p class="wait">' + (pend ? esc(title(pend.squad)) + ' is picking a path.' : 'It\'s ' + esc(title(now)) + '\'s turn.') + '</p><p class="sub">Watch the big screen. Your button lights up on your turn.</p>';
    el.innerHTML = head + body + '<div class="msg" id="msg"></div></div>' + foot();
    if ($('roll')) $('roll').onclick = function () { act(run('clashSummitRoll', me, code)); };
    document.querySelectorAll('[data-pick]').forEach(function (b) { b.onclick = function () { act(run('clashSummitChoose', me, code, Number(b.getAttribute('data-pick')))); }; });
    wireFoot();
  }
  function foot() { return '<p class="small">Game ' + esc(code) + ' · not ' + esc(me) + '? <a href="#" id="change">Change</a></p>'; }
  function wireFoot() { var c = $('change'); if (c) c.onclick = function (e) { e.preventDefault(); me = ''; try { localStorage.removeItem('clash-my-800'); } catch (x) {} ask(); }; }
  function act(p) {
    acting = true; document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    p.then(function (v) { acting = false; take(v); }).catch(function (e) { acting = false; draw(); if ($('msg')) $('msg').textContent = msgOf(e); });
  }
  if (me) join(); else ask();
  setInterval(function () { if (!acting && squad) run('clashSummitState', code, seq).then(take).catch(function () {}); }, 2000);
})();
</script>
</body>
</html>
