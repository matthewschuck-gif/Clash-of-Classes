<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=DM+Mono:wght@500&family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  :root { --bg:#12081f; --panel:#1d1033; --line:#38255a; --ink:#f6f0ff; --mute:#b9a6d8; --gold:#ffe100; --sq:#b583ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
  body { background: radial-gradient(900px 600px at 50% -10%, color-mix(in srgb, var(--sq) 35%, transparent) 0%, transparent 65%), var(--bg); }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; text-align:center; }
  h1 { font-family:Fraunces,Georgia,serif; font-weight:900; font-size:clamp(28px,7vw,42px); margin:4px 0 2px; letter-spacing:-.02em; }
  .tag { font-family:'DM Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px 16px; margin-top:14px; }
  .sub { color:var(--mute); font-size:15px; line-height:1.5; margin:6px 0 0; }
  input { font:inherit; font-size:22px; letter-spacing:.08em; text-align:center; width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:#0d0618; color:var(--ink); }
  label.field { display:grid; gap:6px; text-align:left; font-size:13px; color:var(--mute); margin-bottom:10px; }
  button { font:inherit; font-weight:800; cursor:pointer; border:0; border-radius:999px; padding:12px 20px; }
  button:active { transform: translateY(2px); }
  button:disabled { opacity:.35; cursor:default; transform:none; }
  .go { background:var(--gold); color:#1a0b2e; width:100%; margin-top:6px; font-size:18px; }
  .who { display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:8px; }
  .slogo { width:84px; height:84px; border-radius:20px; display:grid; place-items:center; padding:8px; box-shadow:0 8px 20px #0007; }
  .slogo img { width:100%; height:100%; object-fit:contain; }
  .spiece { width:84px; height:84px; border-radius:50%; border:4px solid var(--sq); background:#1d1033 no-repeat; background-size:240%; box-shadow:0 8px 20px #0007; }
  .stats { display:flex; justify-content:center; gap:26px; margin-top:6px; }
  .stats div { font-family:Fraunces,serif; font-weight:900; font-size:32px; color:var(--gold); }
  .stats span { display:block; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--mute); font-weight:500; }
  .dice { width:min(240px,64vw); aspect-ratio:1; border-radius:28%; font-family:Fraunces,serif; font-weight:900; font-size:clamp(44px,12vw,70px); color:#5e4500;
    background:linear-gradient(#fff6b0,#ffd23f); border:6px solid #fff; box-shadow:0 14px 0 #a87b00, 0 24px 40px #000a; margin:16px auto 8px; display:grid; place-items:center; align-content:center; gap:6px; line-height:1; }
  .dice small { display:block; font:800 15px 'DM Sans',sans-serif; color:#7a5a00; margin-top:4px; }
  .dice:active { transform: translateY(8px); box-shadow:0 6px 0 #a87b00, 0 12px 24px #000a; }
  .items { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .item { background:#ffffff12; color:var(--ink); border:2px solid #ff9a1f; border-radius:16px; padding:12px 10px; font-size:15px; text-align:center; }
  .item i { display:block; font-size:30px; color:#ff9a1f; margin-bottom:4px; }
  .item small { display:block; color:var(--mute); font-weight:400; font-size:12.5px; margin-top:3px; }
  .item.price b { color:var(--gold); }
  .paths { display:grid; gap:12px; margin-top:14px; }
  .path { background:#ffffff14; color:var(--ink); border:2px solid var(--sq); border-radius:18px; padding:16px; font-size:19px; }
  .path small { display:block; color:var(--mute); font-weight:400; font-size:13px; margin-top:4px; }
  .nums { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:10px; }
  .nums button { aspect-ratio:1; border-radius:14px; padding:0; font:900 26px Fraunces,serif; background:#fff; color:#2a173f; }
  .wait { font-size:18px; margin-top:10px; }
  .msg { color:#fca5a5; min-height:1.2em; margin-top:10px; font-size:15px; }
  .small { font-size:13px; color:var(--mute); margin-top:14px; }
  .small a { color:var(--mute); }
  /* Minigames */
  .mg h2 { font-family:Fraunces,serif; font-weight:900; font-size:clamp(28px,8vw,40px); margin:4px 0; }
  .clock { font:900 clamp(40px,12vw,64px)/1 Fraunces,serif; color:var(--gold); margin:10px 0; }
  .tapbtn { width:min(260px,70vw); aspect-ratio:1; border-radius:50%; background:var(--sq); color:#12081f; font:900 clamp(40px,12vw,64px) Fraunces,serif; box-shadow:0 12px 0 color-mix(in srgb, var(--sq) 50%, #000), 0 20px 36px #000a; touch-action:manipulation; }
  .tapbtn:active { transform: translateY(8px); box-shadow:0 4px 0 color-mix(in srgb, var(--sq) 50%, #000), 0 10px 20px #000a; }
  .react { width:100%; aspect-ratio: 4 / 3; border-radius:22px; font:900 clamp(26px,8vw,40px) Fraunces,serif; background:#3a2659; color:#fff; touch-action:manipulation; }
  .react.go-now { background:var(--gold); color:#1a0b2e; }
  .signs { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  .sign { aspect-ratio: 1.4; border-radius:18px; font-size:44px; color:#fff; opacity:.55; touch-action:manipulation; transition: opacity .12s, transform .12s; }
  .sign.lit { opacity:1; transform: scale(1.05); box-shadow:0 0 0 4px #fff, 0 0 30px #fff8; }
  @media (prefers-reduced-motion: reduce) { .sign { transition:none; } }
  .clock.hot { color:#ff6b6b; }
  .clock.tick { animation: tick .32s cubic-bezier(.34,1.56,.64,1); }
  @keyframes tick { from { transform: scale(1.25); } }
  .sent { font:900 clamp(44px,13vw,72px)/1 Fraunces,serif; color:var(--gold); margin:6px 0 4px; animation: land .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes land { from { transform: scale(.4) translateY(20px); opacity:0; } }
  body.mgplay .wrap > h1, body.mgplay .wrap > .tag, body.mgplay .who, body.mgplay .stats, body.mgplay .mg .sub, body.mgplay .mg > .tag { display:none; }
  body.mgplay .wrap { padding-top:8px; }
  body.mgplay .card { margin-top:0; padding-top:10px; }
  body.mgplay .mg h2 { font-size:24px; margin:0; }
  body.mgplay .clock { margin:2px 0 4px; font-size:34px; }
  .dpad { display:grid; grid-template-columns:repeat(3, 86px); grid-template-rows:repeat(3, 86px); gap:8px; justify-content:center; margin-top:12px; }
  .dk { border-radius:20px; background:#ffffff16; color:var(--ink); border:2px solid var(--line); font-size:40px; padding:0; touch-action:none; }
  .dk.on { background:var(--gold); color:#1a0b2e; border-color:transparent; }
  .dk.dU { grid-area:1 / 2; } .dk.dL { grid-area:2 / 1; } .dk.dR { grid-area:2 / 3; } .dk.dD { grid-area:3 / 2; }
  .mute { background:none; border:0; color:var(--mute); font-size:18px; padding:2px 6px; vertical-align:middle; }
  #readyBox .go { margin:0 0 8px; padding:9px 16px; font-size:17px; }
  .relay { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); z-index:20; background:var(--gold); color:#1a0b2e; font:900 clamp(34px,9vw,56px)/1 Fraunces,serif; padding:18px 30px; border-radius:24px; box-shadow:0 20px 50px #000c; text-align:center; animation: land .4s cubic-bezier(.34,1.56,.64,1); }
  .relay small { display:block; font:800 17px 'DM Sans',sans-serif; margin-top:6px; }
  .relay[hidden] { display:none; }
  .word { font:800 20px 'DM Sans',sans-serif; margin:4px 0 6px; }
  .word b { font-family:Fraunces,serif; font-size:30px; color:var(--gold); text-transform:uppercase; letter-spacing:.02em; }
  .stage.sk { width:min(100%, calc(100vh - 260px)); min-width:240px; background:#fff; }
  .ai { font-size:18px; margin:10px 0 0; min-height:1.4em; }
  .ai b { color:var(--gold); }
  .stage { position:relative; width:min(100%, calc((100vh - 200px) * 360 / 440)); min-width:240px; max-width:420px; margin:6px auto 0; border-radius:20px; overflow:hidden; border:2px solid var(--line); box-shadow:0 14px 34px #000a; }
  .stage canvas { display:block; width:100%; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; }
  .hud { position:absolute; top:10px; right:12px; min-width:52px; padding:4px 12px; border-radius:999px; background:#12081fcc; color:var(--gold); font:900 26px/1.1 Fraunces,serif; text-align:center; }
  .hud.bump { animation: bump .18s ease-out; }
  @keyframes bump { from { transform: scale(1.22); } }
  .pads { display:flex; justify-content:center; gap:10px; margin-top:10px; }
  .pad { flex:1; max-width:160px; min-height:64px; font-size:22px; background:#ffffff16; color:var(--ink); border:2px solid var(--line); border-radius:18px; touch-action:none; user-select:none; }
  .pad.big { background:var(--gold); color:#1a0b2e; border-color:transparent; box-shadow:0 6px 0 #a87b00; }
  .pad:active { transform: translateY(3px); }
  .pad.big:active { box-shadow:0 3px 0 #a87b00; }
  @media (prefers-reduced-motion: reduce) { .clock.tick, .sent, .hud.bump, .relay { animation:none; } .pad:active, button:active { transform:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Clash of Classes</div>
  <h1>Summit Party</h1>
  <div id="app"><div class="card"><p class="sub">Loading…</p></div></div>
</div>
<script>
(function () {
  var COLORS = { BLACK: '#e9e3f5', GOLD: '#ffd23f', GREY: '#9aa5b8', PURPLE: '#b583ff' };
  var BASE = { BLACK: '#2b2633', GOLD: '#a87b00', GREY: '#5d6673', PURPLE: '#5b1a86' };
  var FOCUS = { BLACK: '47% 11%', GOLD: '72% 2%', GREY: '77% 11%', PURPLE: '69% 0%' };
  var ITEMICON = { double: 'ph-dice-two', compass: 'ph-compass', paws: 'ph-hand-grabbing', zipline: 'ph-arrows-left-right' };
  var me = '', squad = '', S = null, seq = 0, acting = false, code = '', LOGOS = {}, skew = 0, compassOpen = false, play = null, duelOpp = '';
  try { me = localStorage.getItem('clash-my-800') || ''; code = sessionStorage.getItem('summit-code') || ''; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { s = String(s || ''); return s.charAt(0) + s.slice(1).toLowerCase(); }
  function run(fn) { var a = Array.prototype.slice.call(arguments, 1); return new Promise(function (ok, no) { var r = google.script.run.withSuccessHandler(function (t) { ok(JSON.parse(t)); }).withFailureHandler(no); r[fn].apply(r, a); }); }
  function msgOf(e) { return String(e && e.message || e).replace(/^Exception:\s{0,}/, ''); }
  function now() { return Date.now() + skew; }
  // ── Sound: original effects made in the browser with Web Audio (no sound files). The speaker button mutes this page. ──
  var SFX = (function () {
    var ctx = null, muted = false, on = false, level = 1;
    try { muted = localStorage.getItem('summit-mute') === '1'; } catch (e) {}
    function ac() {
      if (!ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return null; try { ctx = new A(); } catch (e) { return null; } }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(f, t, d, type, vol, f2) {
      var c = ac(); if (!c) return;
      var o = c.createOscillator(), g = c.createGain(), s = c.currentTime + (t || 0);
      o.type = type || 'square'; o.frequency.setValueAtTime(f, s);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime((vol || .1) * level, s + .012); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + .03);
    }
    function noise(t, d, vol) {
      var c = ac(); if (!c) return;
      var n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), data = b.getChannelData(0);
      for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), s = c.currentTime + (t || 0);
      f.type = 'lowpass'; f.frequency.setValueAtTime(900, s); f.frequency.exponentialRampToValueAtTime(120, s + d);
      g.gain.setValueAtTime((vol || .2) * level, s);
      src.buffer = b; src.connect(f); f.connect(g); g.connect(c.destination); src.start(s);
    }
    function seq(notes, gap, d, type, vol) { notes.forEach(function (f, i) { tone(f, i * gap, d, type, vol); }); }
    var LIB = {
      tick: function () { tone(1500, 0, .025, 'square', .03); },
      tap: function () { tone(900 + Math.random() * 120, 0, .045, 'triangle', .07); },
      hop: function () { tone(600, 0, .07, 'triangle', .07, 900); },
      dice: function () { for (var i = 0; i < 9; i++) tone(500 + Math.random() * 700, i * .07, .035, 'square', .05); },
      land: function () { tone(523, 0, .09, 'triangle', .12); tone(784, .08, .18, 'triangle', .12); },
      coin: function () { tone(988, 0, .07, 'square', .08); tone(1319, .06, .25, 'square', .08); },
      lose: function () { tone(420, 0, .3, 'sawtooth', .07, 170); },
      bonk: function () { tone(170, 0, .16, 'square', .1, 70); },
      beep: function () { tone(660, 0, .11, 'square', .07); },
      go: function () { tone(1046, 0, .4, 'square', .09); tone(1318, 0, .4, 'square', .05); },
      ready: function () { tone(880, 0, .09, 'triangle', .1); tone(1175, .09, .16, 'triangle', .1); },
      pass: function () { seq([784, 988, 1175], .09, .12, 'square', .07); },
      pop: function () { tone(420, 0, .09, 'sine', .14, 950); },
      spin: function () { tone(1200, 0, .03, 'triangle', .05); },
      reveal: function () { seq([523, 659, 784, 1046], .08, .14, 'square', .08); },
      guess: function () { tone(700, 0, .07, 'sine', .07, 760); },
      flag: function () { seq([523, 659, 784, 1046], .11, .16, 'square', .09); tone(1046, .44, .55, 'triangle', .1); tone(1318, .44, .55, 'triangle', .06); },
      item: function () { seq([784, 1046, 1318], .07, .12, 'triangle', .1); },
      villain: function () { tone(233, 0, .28, 'sawtooth', .09, 117); tone(220, .26, .5, 'sawtooth', .09, 98); },
      avalanche: function () { noise(0, 1.4, .3); tone(90, 0, 1.2, 'sawtooth', .06, 45); },
      event: function () { seq([659, 880, 659, 988], .07, .1, 'triangle', .08); },
      duel: function () { tone(330, 0, .18, 'sawtooth', .08); tone(330, .22, .18, 'sawtooth', .08); tone(494, .44, .4, 'sawtooth', .09); },
      final: function () { [0, .18, .36, .54].forEach(function (t) { tone(98, t, .14, 'square', .12); }); tone(196, .75, .6, 'sawtooth', .08); },
      win: function () { seq([784, 988, 1175, 1568], .12, .2, 'square', .09); seq([1175, 1568], .2, .5, 'triangle', .08); },
      sad: function () { seq([392, 370, 349, 330], .18, .22, 'triangle', .08); }
    };
    return {
      set: function (v, lv) { on = !!v; if (lv) level = lv; },
      play: function (k) { if (!on || muted || !LIB[k]) return; try { LIB[k](); } catch (e) {} },
      unlock: function () { if (on && !muted) ac(); },
      muted: function () { return muted; },
      toggle: function () { muted = !muted; try { localStorage.setItem('summit-mute', muted ? '1' : '0'); } catch (e) {} if (!muted) ac(); return muted; }
    };
  })();
  document.addEventListener('pointerdown', function () { SFX.unlock(); });
  document.addEventListener('keydown', function () { SFX.unlock(); });
  function muteBtn() { return '<button class="mute" id="mute" title="Sound on or off" aria-label="Sound on or off"><i class="ph-fill ' + (SFX.muted() ? 'ph-speaker-slash' : 'ph-speaker-high') + '"></i></button>'; }
  function wireMute() { var b = $('mute'); if (b) b.onclick = function (e) { e.preventDefault(); SFX.toggle(); b.innerHTML = '<i class="ph-fill ' + (SFX.muted() ? 'ph-speaker-slash' : 'ph-speaker-high') + '"></i>'; }; }
  run('clashSquadLogos').then(function (l) { LOGOS = l || {}; if (S && !play) draw(); }).catch(function () {});

  function ask(err) {
    play = null;
    $('app').innerHTML = '<div class="card"><p class="sub" style="margin:0 0 14px">Type the game code on the big screen, then your 800 number. Your squad plays from this Chromebook.</p>' +
      '<label class="field">Game code<input id="code" autocomplete="off" autocapitalize="characters" maxlength="4" value="' + esc(code) + '" style="text-transform:uppercase"></label>' +
      '<label class="field">Your 800 number<input id="id" inputmode="numeric" autocomplete="off" maxlength="10" value="' + esc(me) + '"></label>' +
      '<button class="go" id="join">Join my squad</button><div class="msg" id="msg">' + esc(err || '') + '</div></div>';
    (code ? $('id') : $('code')).focus();
    var go = function () { me = $('id').value.replace(/\D/g, ''); code = $('code').value.toUpperCase().replace(/[^A-Z]/g, ''); join(); };
    $('join').onclick = go; $('id').onkeydown = $('code').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  function join() {
    run('clashSummitJoin', me, code).then(function (r) {
      squad = r.squad; code = r.code; try { localStorage.setItem('clash-my-800', me); sessionStorage.setItem('summit-code', code); } catch (e) {}
      document.documentElement.style.setProperty('--sq', COLORS[squad] || '#b583ff');
      take(r.state);
    }).catch(function (e) { ask(msgOf(e)); });
  }
  function take(v) {
    if (v && v.now) skew = v.now - Date.now();
    if (!v || v.same) return;
    if (!v.on) { $('app').innerHTML = '<div class="card"><p class="sub">Summit Party is closed right now.</p></div>'; return; }
    S = v; seq = v.game ? v.game.seq : 0;
    SFX.set(v.opts && v.opts.soundPlay, .6);
    if (play && S.game && S.game.phase === 'minigame' && S.game.mg && play.key === mgKey(S.game)) return; // keep playing
    play = null;
    draw();
  }

  function head(g) {
    var mine = g && g.squads[squad], art = S.art && S.art.pieces && S.art.pieces[squad];
    return '<div class="card"><div class="who">' + (LOGOS[squad] ? '<span class="slogo" style="background:' + BASE[squad] + '"><img src="' + LOGOS[squad] + '" alt="' + esc(title(squad)) + ' Squad logo"></span>' : '') +
      (art ? '<span class="spiece" style="background-image:url(&quot;' + art + '&quot;);background-position:' + FOCUS[squad] + '" role="img" aria-label="Your squad piece"></span>' : '') + '</div>' +
      '<div style="font-family:Fraunces,serif;font-weight:900;font-size:26px;color:var(--sq)">' + esc(title(squad)) + ' Squad</div>' +
      (mine ? '<div class="stats"><div>' + mine.flags + '<span>FLAGS</span></div><div>' + mine.coins + '<span>COINS</span></div><div>' + (mine.items || []).length + '<span>ITEMS</span></div></div>' : '');
  }
  function draw() {
    var g = S.game, el = $('app');
    if (!g || g.status !== 'playing') {
      el.innerHTML = head(g) + '<p class="wait">' + (g && g.places ? esc(title(g.places[0])) + ' won Summit Party!' : 'Waiting for a game to start.') + '</p><p class="sub">Watch the big screen.</p></div>' + foot();
      return wireFoot();
    }
    if (g.phase === 'minigame' && g.mg) return minigame(g);
    var mine = g.squads[squad], now0 = g.order[g.turn], pend = g.pending, myTurn = now0 === squad && !pend, myPick = pend && pend.squad === squad, L = g.last || {};
    var body = '<p class="sub">Round ' + Math.min(g.round, g.rounds) + ' of ' + g.rounds + (g.final ? ' · <b style="color:#ff6b6b">Final Climb!</b>' : '') + '</p>';
    if (L.squad === squad && L.roll) body += '<p class="sub">You rolled <b style="color:var(--gold)">' + L.roll + '</b>.</p>';
    if (myPick && pend.kind === 'shop') {
      body += '<p class="wait">The Camp Store! Buy one item?</p><div class="items">' + pend.options.map(function (o) {
        return '<button class="item price" data-buy="' + o.id + '"' + (o.afford ? '' : ' disabled') + '><i class="ph-fill ' + ITEMICON[o.id] + '"></i>' + esc(o.name) + ' · <b>' + o.price + '</b><small>' + esc(o.text) + '</small></button>'; }).join('') +
        '</div><button class="go" data-buy="skip" style="margin-top:12px;background:#ffffff1a;color:var(--ink)">No thanks</button>';
    } else if (myPick && pend.kind === 'duel') {
      body += '<p class="wait">DUEL! Pick a squad to challenge.</p><div class="paths">' + pend.options.map(function (o) {
