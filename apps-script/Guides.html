<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f3fc; --panel:#ffffff; --ink:#22123b; --mute:#5d4d78; --line:#e4d9f3; --accent:#6d28d9; --gold:#b8860b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 'DM Sans',system-ui,sans-serif; }
  .bar { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; background:#2a0f45; color:#fff; }
  .bar b { font-family:'Fraunces',serif; font-size:20px; margin-right:auto; }
  .bar button { border:0; border-radius:999px; padding:8px 14px; font:700 14px 'DM Sans',sans-serif; cursor:pointer; background:#ffffff1f; color:#fff; }
  .bar button.on { background:#ffe100; color:#2a0f45; }
  .bar button.print { background:#fff; color:#2a0f45; }
  main { max-width:860px; margin:0 auto; padding:18px 16px 60px; }
  .guide { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 26px; margin-bottom:22px; }
  .guide h1 { font-family:'Fraunces',serif; font-weight:900; font-size:30px; margin:0; display:flex; gap:10px; align-items:center; }
  .lead { color:var(--mute); margin:4px 0 12px; }
  .guide h2 { font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:16px 0 4px; }
  .guide ul { margin:0; padding-left:20px; }
  .guide li { margin:3px 0; }
  .foot { color:var(--mute); font-size:12px; margin-top:14px; border-top:1px solid var(--line); padding-top:8px; }
  .hide { display:none; }
  .msg { color:var(--mute); padding:30px 0; text-align:center; }
  @media print {
    body { background:#fff; font-size:11.5px; }
    .bar { display:none; }
    main { padding:0; max-width:none; }
    .guide { border:0; border-radius:0; padding:0; margin:0; page-break-after:always; }
    .guide:last-child { page-break-after:auto; }
    .guide h1 { font-size:22px; }
    .guide h2 { margin-top:10px; font-size:11.5px; }
  }
</style>
</head>
<body>
<div class="bar" id="bar"><b>Role guides</b></div>
<main id="main"><p class="msg">Loading the guides…</p></main>
<script>
(function () {
  var data = null, show = 'all';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function draw() {
    var bar = document.getElementById('bar'), main = document.getElementById('main');
    bar.innerHTML = '<b>Role guides</b>' + [{ id: 'all', title: 'All' }].concat(data.roles).map(function (r) {
      return '<button data-r="' + esc(r.id) + '" class="' + (show === r.id ? 'on' : '') + '">' + esc((r.icon ? r.icon + ' ' : '') + r.title) + '</button>';
    }).join('') + '<button class="print" id="printBtn">Print</button>';
    main.innerHTML = data.roles.map(function (r) {
      return '<section class="guide' + (show === 'all' || show === r.id ? '' : ' hide') + '"><h1><span>' + esc(r.icon) + '</span>' + esc(r.title) + '</h1>' +
        '<p class="lead">' + esc(r.lead) + '</p>' + r.sections.filter(function (s) { return s.items && s.items.length; }).map(function (s) {
          return '<h2>' + esc(s.h) + '</h2><ul>' + s.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
        }).join('') + '<div class="foot">Clash of Classes · ' + esc(data.site) + ' · written from the Settings on ' + esc(data.made) + '</div></section>';
    }).join('');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (!b) return;
    if (b.id === 'printBtn') { window.print(); return; }
    if (b.getAttribute('data-r')) { show = b.getAttribute('data-r'); draw(); }
  });
  function start(role) {
    google.script.run.withSuccessHandler(function (t) {
      data = JSON.parse(t);
      if (role && data.roles.some(function (r) { return r.id === role; })) show = role;
      draw();
    }).withFailureHandler(function (err) {
      document.getElementById('main').innerHTML = '<p class="msg">Could not load the guides: ' + esc(err && err.message) + '</p>';
    }).clashGuides();
  }
  try { google.script.url.getLocation(function (loc) { start(loc && loc.parameter && loc.parameter.role); }); } catch (e) { start(''); }
})();
</script>
</body>
</html>
