<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#170b29; --panel:#22123b; --ink:#f6f0ff; --mute:#b9a6d8; --gold:#ffd23f;
    --BLACK:#e9e3f5; --GOLD:#ffd23f; --GREY:#9aa5b8; --PURPLE:#b583ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; overflow:hidden; }
  body { background: radial-gradient(1200px 700px at 15% -10%, #3b1a66 0%, transparent 60%), var(--bg); }
  .wrap { height:100%; display:flex; flex-direction:column; padding:4vh 5vw; }
  .top { display:flex; justify-content:space-between; align-items:center; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:clamp(12px,1.3vw,20px); color:var(--gold); }
  .top .vote { letter-spacing:0; text-transform:none; color:var(--mute); font-weight:600; }
  .top .vote b { color:var(--gold); }
  .slide { flex:1; display:flex; flex-direction:column; justify-content:center; animation:in .6s ease-out; min-height:0; }
  @keyframes in { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  h1 { font-family:Georgia,serif; font-weight:900; font-size:clamp(30px,5vw,88px); line-height:1.05; margin:0 0 2vh; }
  .say { font-size:clamp(18px,2.4vw,40px); line-height:1.4; color:var(--ink); max-width:72ch; }
  .tag { font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-size:clamp(12px,1.3vw,20px); color:var(--mute); margin-bottom:1vh; }
  .bars { display:grid; gap:1.6vh; }
  .bar { display:grid; grid-template-columns:minmax(0,26%) 1fr 6ch; gap:1.4vw; align-items:center; font-size:clamp(16px,2.2vw,36px); font-weight:800; }
  .track { height:clamp(20px,5vh,60px); background:#ffffff14; border-radius:999px; overflow:hidden; }
  .fill { height:100%; border-radius:999px; background:linear-gradient(90deg,#7c3aed,#c084fc); width:0; transition:width .9s; }
  .stand { display:grid; gap:1.8vh; }
  .row { display:grid; grid-template-columns:4ch 1fr auto; gap:2vw; align-items:center; font-size:clamp(22px,3.4vw,56px); font-weight:900; }
  .row .rk { color:var(--mute); }
  .chip { display:inline-block; margin-top:2.4vh; padding:.6em 1em; border-radius:999px; background:#ffffff14; font-size:clamp(14px,1.6vw,26px); font-weight:700; }
  .chip.av { background:#38bdf826; color:#bae6fd; }
  .card { background:var(--panel); border-radius:18px; padding:2.4vh 2vw; margin-bottom:1.6vh; }
  .card b { font-size:clamp(16px,2vw,32px); }
  .card p { margin:.6vh 0 0; font-size:clamp(15px,1.8vw,28px); color:var(--mute); line-height:1.35; }
  .dots { display:flex; gap:.6em; justify-content:center; }
  .dots i { width:.6em; height:.6em; border-radius:50%; background:#ffffff33; }
  .dots i.on { background:var(--gold); }
  @media (prefers-reduced-motion: reduce) { .slide { animation:none; } .fill { transition:none; } }
</style>
</head>
<body>
<div class="wrap"><div class="top"><span>☀️ Morning Clash</span><span class="vote" id="vote"></span></div><div class="slide" id="slide"><h1>Good morning, Mountaineers!</h1></div><div class="dots" id="dots"></div></div>
<script>
(function () {
  var D = null, i = 0, slides = [], timer = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { return s.charAt(0) + s.slice(1).toLowerCase(); }
  function today() { return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
  function build() {
    slides = [];
    slides.push('<div class="tag">' + esc(today()) + '</div><h1>Good morning, Mountaineers!</h1>' + (D.announcement ? '<div class="say">' + esc(D.announcement) + '</div>' : ''));
    (D.live ? D.polls : []).forEach(function (p) {
      var body = p.kind === 'Check-in' ? '<div class="say">Check in today on your Chromebook.</div>' : !p.counts ? '<div class="say">' + p.choices.map(esc).join('  ·  ') + '</div>'
        : '<div class="bars">' + p.choices.map(function (c) { var pct = p.total ? Math.round(100 * (p.counts[c] || 0) / p.total) : 0; return '<div class="bar"><div>' + esc(c) + '</div><div class="track"><div class="fill" data-w="' + pct + '"></div></div><div>' + pct + '%</div></div>'; }).join('') + '</div>';
      slides.push('<div class="tag">Today\'s ' + esc(p.kind === 'Pulse' ? 'Pulse' : p.kindLabel || p.kind) + '</div><h1>' + esc(p.question) + '</h1>' + body +
        '<div class="chip">Vote at <b>' + esc(D.voteText) + '</b> with your 800 number · every vote is a squad point</div>');
    });
    if (!D.live && D.next && D.next[0]) slides.push('<div class="tag">Coming up</div><h1>' + esc(D.next[0].question) + '</h1><div class="chip">Vote at <b>' + esc(D.voteText) + '</b></div>');
    var season = D.season || {}, av = D.avalanche || {};
    var seasonLine = season.over ? (season.revealed && season.winner ? '🏆 ' + title(season.winner) + ' wins the Clash Bash!' : '🏁 The season is over. The Clash Bash winner is revealed ' + esc(season.reveal) + '.')
      : season.end && season.daysLeft <= 45 ? '⏳ ' + season.daysLeft + ' days left to earn points for the Clash Bash' : '';
    var avLine = (av.active || []).map(function (a) { return '🏔️ AVALANCHE! ' + title(a.squad) + '\'s polls and check-ins count double through ' + esc(a.active.end); }).join(' ') ||
      (av.last && av.last.ready ? '🏔️ ' + title(av.last.squad) + ' has a full Avalanche meter: Generals, set it off in HQ!' : av.last && !av.last.used ? '🏔️ ' + title(av.last.squad) + '\'s Avalanche meter: ' + av.last.charge + ' of ' + av.last.need : '');
    slides.push('<div class="tag">The standings</div><div class="stand">' + D.standings.map(function (s, k) {
      return '<div class="row"><span class="rk">' + (k === 0 ? '👑' : '#' + (k + 1)) + '</span><span style="color:var(--' + s.squad + ')">' + title(s.squad) + '</span><span>' + s.total.toLocaleString() + '</span></div>';
    }).join('') + '</div>' + (seasonLine ? '<div class="chip">' + seasonLine + '</div>' : '') + (avLine ? '<div class="chip av">' + avLine + '</div>' : ''));
    if (D.trait) slides.push('<div class="tag">' + esc(D.trait.month) + '\'s trait</div><h1>' + esc(D.trait.trait) + '</h1><div class="say">' + esc(D.trait.desc) + '</div>' +
      (D.trait.skill ? '<div class="chip">Today, try: <b>' + esc(D.trait.skill.label) + '</b>. ' + esc(D.trait.skill.desc) + '</div>' : ''));
    if (D.spotlight && D.spotlight.length) slides.push('<div class="tag">⭐ Squad Spotlight</div>' + D.spotlight.map(function (s) {
      return '<div class="card"><b style="color:var(--' + s.squad + ')">' + esc(s.who) + ' · ' + title(s.squad) + '</b><p>' + esc(s.story) + '</p></div>';
    }).join(''));
    document.getElementById('vote').innerHTML = 'Vote at <b>' + esc(D.voteText) + '</b>';
  }
  function show() {
    if (!slides.length) return;
    i = i % slides.length;
    var el = document.getElementById('slide');
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    el.innerHTML = slides[i];
    document.getElementById('dots').innerHTML = slides.map(function (_, k) { return '<i' + (k === i ? ' class="on"' : '') + '></i>'; }).join('');
    requestAnimationFrame(function () { requestAnimationFrame(function () { Array.prototype.forEach.call(el.querySelectorAll('[data-w]'), function (f) { f.style.width = f.getAttribute('data-w') + '%'; }); }); });
  }
  function go(step) { i = (i + step + slides.length) % slides.length; show(); restart(); }
  function restart() { clearInterval(timer); timer = setInterval(function () { i++; show(); }, ((D && D.seconds) || 12) * 1000); }
  function load(first) {
    google.script.run.withSuccessHandler(function (t) { D = JSON.parse(t); build(); if (first) { show(); restart(); } }).withFailureHandler(function () {}).clashMorning();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === ' ') go(1); if (e.key === 'ArrowLeft') go(-1); });
  document.addEventListener('click', function () { go(1); });
  load(true);
  setInterval(function () { load(false); }, 60000);
})();
</script>
</body>
</html>
