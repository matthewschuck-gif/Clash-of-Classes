<style>
/* ── My Squad + challenges (Student.html) ── */
.ms-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg, 16px); padding: 20px; margin-bottom: 16px; }
.ms-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ms-form input { flex: 1; min-width: 180px; background: var(--surface2); border: 1px solid var(--border2, var(--border)); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 16px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
.ms-err { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; }
.ms-hello { font-family: 'Fraunces', serif; font-size: clamp(24px, 4vw, 36px); font-weight: 900; margin: 0 0 4px; }
.ms-squad { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; color: #111; }
.ms-standing { font-size: 15px; color: var(--text2); margin: 10px 0 0; line-height: 1.6; }
.ms-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ms-tile { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
.ms-tile-val { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 900; color: var(--gold-soft, #fbbf24); }
.ms-tile-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
.ms-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.ms-badge { padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(251, 191, 36, .14); color: var(--gold-soft, #fbbf24); border: 1px solid rgba(251, 191, 36, .35); }
.ms-badge.locked { background: transparent; color: var(--text3); border-style: dashed; border-color: var(--border); opacity: .7; }
.ms-h { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700; margin: 0 0 12px; }
.ms-small { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.ch-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.ch-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; }
.ch-desc { font-size: 13px; color: var(--text2); margin: 4px 0 10px; }
.ch-row { display: grid; grid-template-columns: 70px 1fr 70px; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px; }
.ch-bar { height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.ch-fill { height: 100%; border-radius: 999px; transition: width .6s; }
.ch-done { font-size: 11px; color: #4ade80; font-weight: 700; }
.tv-ch-grid { display: grid; gap: 18px; width: min(1100px, 92vw); margin: 0 auto; }
.tv-ch-grid .ch-card { padding: 22px; }
.tv-ch-grid .ch-title { font-size: clamp(20px, 2.4vw, 32px); }
.tv-ch-grid .ch-row { font-size: clamp(13px, 1.4vw, 18px); grid-template-columns: 110px 1fr 110px; }
.tv-ch-grid .ch-bar { height: 18px; }
.tv-feed { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; width: min(1200px, 94vw); margin: 0 auto; }
.tv-feed-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; font-size: clamp(13px, 1.4vw, 20px); color: var(--text); font-weight: 600; }
@media (max-width: 760px) { .tv-feed { grid-template-columns: 1fr; } }
/* ── Pulse: Menti-style live results (06_Polls.gs clashPulseLive) ── */
.pulse-q { font-family: 'Fraunces', serif; font-weight: 900; font-size: clamp(22px, 3.4vw, 40px); line-height: 1.15; margin: 4px 0 18px; }
.pulse-tag { display: inline-block; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #12081f; background: #38bdf8; padding: 3px 10px; border-radius: 999px; }
.pulse-bars { display: grid; gap: 12px; }
.pulse-row { display: grid; grid-template-columns: minmax(110px, 30%) 1fr 92px; gap: 12px; align-items: center; }
.pulse-lbl { font-weight: 700; font-size: clamp(14px, 1.6vw, 20px); overflow-wrap: anywhere; }
.pulse-track { height: clamp(26px, 3.6vw, 46px); background: var(--surface2); border-radius: 10px; overflow: hidden; position: relative; }
.pulse-fill { height: 100%; width: 0; border-radius: 10px; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.pulse-row.top .pulse-fill { box-shadow: 0 0 22px currentColor; }
.pulse-num { font-family: 'Fraunces', serif; font-weight: 900; font-size: clamp(18px, 2.4vw, 32px); text-align: right; font-variant-numeric: tabular-nums; }
.pulse-num small { display: block; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 400; color: var(--text3); }
.pulse-race { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
.pulse-race div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
.pulse-race i { display: block; height: 8px; border-radius: 999px; margin-top: 6px; transition: width .9s; }
.pulse-total { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); margin-top: 12px; }
.pulse-vote { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
#tvPulse .pulse-q { font-size: clamp(28px, 4vw, 54px); }
@media (max-width: 600px) { .pulse-row { grid-template-columns: 1fr 64px; } .pulse-lbl { grid-column: 1 / -1; } .pulse-race { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { .pulse-fill, .pulse-race i { transition: none; } }
</style>
<script>
/* My Squad page, automatic challenges and two TV slides. Data comes from 04_Students.gs. */
(function () {
  var SQ = ['BLACK', 'GOLD', 'GREY', 'PURPLE'];
  var COLOR = { BLACK: 'var(--sq-black, #c5c9d1)', GOLD: 'var(--sq-gold, #ffe100)', GREY: 'var(--sq-grey, #99a8bb)', PURPLE: 'var(--sq-purple, #bb8ef5)' };
  var KEY = 'clash-my-800';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(sq) { return sq.charAt(0) + sq.slice(1).toLowerCase(); }
  // The squad's story (Squad Themes tab, once Show Lore is ticked). '' until then.
  function loreCard(theme, squad) {
    var l = theme && theme.lore;
    if (!l) return '';
    return '<div class="ms-card" style="border-color:' + (COLOR[squad] || '') + '"><div class="ms-h">📜 ' + esc(l.title || 'The story of ' + title(squad || '')) + '</div>' +
      (l.image ? '<img src="' + esc(l.image) + '" alt="" style="max-width:100%;border-radius:10px;margin:6px 0">' : '') +
      (l.text ? '<p style="white-space:pre-line;line-height:1.6">' + esc(l.text) + '</p>' : '') + '</div>';
  }
  // Lore chapters this squad unlocked (09_Lore.gs), newest last, plus what unlocks the next one.
  function chaptersCard(lore, squad) {
    if (!lore || (!lore.chapters.length && !lore.next)) return '';
    return '<div class="ms-card"><div class="ms-h">📖 Your squad\'s story</div>' +
      lore.chapters.map(function (c) {
        return '<details' + (c === lore.chapters[lore.chapters.length - 1] ? ' open' : '') + ' style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">Chapter ' + c.chapter + ': ' + esc(c.title) + '</summary>' +
          (c.image ? '<img src="' + esc(c.image) + '" alt="" style="max-width:100%;border-radius:10px;margin:8px 0">' : '') +
          '<p style="white-space:pre-line;line-height:1.6">' + esc(c.story) + '</p></details>';
      }).join('') +
      (lore.next ? '<div class="ms-badge locked" style="display:inline-block">🔒 Chapter ' + lore.next.chapter + ' · ' + esc(lore.next.hint) + '</div>' : '') + '</div>';
  }
  // A Squad Duel card (08_Duels.gs). onlySquad = the student's squad, highlighted.
  function duelCard(d, onlySquad) {
    var max = Math.max.apply(null, d.squads.map(function (s) { return d.scores[s] || 0; }).concat([1]));
    return '<div class="ch-card"><div class="ch-title">⚔️ Squad Duel: ' + esc(d.title) + '</div>' +
      '<div class="ch-desc">' + d.squads.map(title).join(' vs ') + ' · most ' + esc(d.measure.toLowerCase()) +
      (d.end ? (d.active ? ' by ' + esc(d.end) : ' · ended ' + esc(d.end)) : '') + ' · winner gets +' + d.bonus + '</div>' +
      d.squads.map(function (s) {
        var v = d.scores[s] || 0, lead = d.leaders.indexOf(s) > -1;
        return '<div class="ch-row"><b style="color:' + COLOR[s] + '">' + title(s) + (s === onlySquad ? ' ★' : '') + '</b>' +
          '<div class="ch-bar"><div class="ch-fill" style="width:' + Math.round(v / max * 100) + '%;background:' + COLOR[s] + '"></div></div>' +
          '<span>' + v + (lead ? (d.done ? ' 🏆' : ' 🔥') : '') + '</span></div>';
      }).join('') + '</div>';
  }
  // Trail Passport (04_Students.gs passportFor_): a stamp for each part of the program tried.
  function passportCard(p) {
    if (!p) return '';
    var n = p.stamps.filter(function (s) { return s.done; }).length;
    return '<div class="ms-card"><div class="ms-h">🧭 Trail Passport (' + n + ' of ' + p.stamps.length + ' stamps)</div><div class="ms-badges">' +
      p.stamps.map(function (s) { return '<span class="ms-badge' + (s.done ? '' : ' locked') + '">' + (s.done ? '' : '○ ') + esc(s.label) + '</span>'; }).join('') + '</div>' +
      '<div class="ms-small" style="margin-top:10px">' + (p.complete ? '🎉 Passport complete! You\'ve explored every part of the trail.' : 'Collect every stamp to complete your passport.') + '</div></div>';
  }
  // Mayhem Week sign-ups on My Squad (11_MayhemWeek.gs mySignups_). Students join or drop
  // events marked Self Sign-up when SELF_SIGNUPS is ON; otherwise it shows what they're in.
  function signupsCard(su) {
    if (!su || !su.events.length) return '';
    var head = '<div class="ms-h">🎟️ Events you can join' + (su.limit ? ' (' + su.count + ' of ' + su.limit + ')' : '') + '</div>';
    var rows = su.events.map(function (e) {
      var meta = [e.type, e.slot, e.date].filter(String).map(esc).join(' · ');
      var btn = e.mine ? (e.self ? '<button class="btn su-btn" data-event="' + esc(e.event) + '" data-drop="1">Drop</button>' : '<span class="ch-done">✓ You\'re in</span>')
        : e.self && e.spotsLeft !== 0 && !(su.limit && su.count >= su.limit) ? '<button class="btn btn-purple su-btn" data-event="' + esc(e.event) + '">Join</button>'
        : '<span class="ms-small">' + (e.spotsLeft === 0 ? 'Full for your squad' : e.self ? 'At your limit' : 'Ask your General') + '</span>';
      return '<div class="ch-row" style="grid-template-columns:1fr auto;margin:10px 0"><div><b>' + esc(e.event) + '</b>' + (e.mine ? ' ✓' : '') +
        '<div class="ms-small">' + meta + (e.spotsLeft != null ? ' · ' + e.spotsLeft + ' spots left' : '') + '</div></div><div>' + btn + '</div></div>';
    }).join('');
    return '<div class="ms-card" id="suCard">' + head + rows + '<div class="ms-err" id="suErr"></div>' +
      '<div class="ms-small">' + (su.on ? 'Join up to ' + (su.limit || 'any number of') + ' events. Never two at the same time.' : 'Your squad Generals sign you up. Tell them what you want to do!') + '</div></div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.su-btn');
    if (!b) return;
    var err = document.getElementById('suErr');
    if (err) err.textContent = 'Saving…';
    var from = b.getBoundingClientRect(), joining = !b.getAttribute('data-drop');
    window.gasRun_('clashStudentSignUp', stored(KEY), b.getAttribute('data-event'), !!b.getAttribute('data-drop')).then(function (su) {
      var card = document.getElementById('suCard');
      if (card) card.outerHTML = signupsCard(su);
      // You're in: a burst from the button you pressed (Craft, in Pop.html).
      if (joining && window.craftCelebrate) window.craftCelebrate({ getBoundingClientRect: function () { return from; } });
    }).catch(function (x) { if (err) err.textContent = (x && x.message || '').replace(/^Exception:\s*/, ''); });
  });

  // Mayhem shirt designs (12_ShirtDesigns.gs): a student votes for their squad's design; the
  // counts refresh every 10 seconds while My Squad is showing.
  var shirtImg = {}, shirtTimer = null;
  function shirtCardHtml(s) {
    if (!s || !s.designs || !s.designs.length) return '';
    var total = s.designs.reduce(function (n, d) { return n + d.votes; }, 0) || 1;
    return '<div class="ms-h">👕 Pick ' + title(s.squad || '') + '\'s Mayhem shirt' + (s.open ? '' : ' <span class="ms-small">(voting is closed)</span>') + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px">' +
      s.designs.map(function (d) {
        var pct = Math.round(100 * d.votes / total), mine = s.voted === d.id;
        return '<div style="border:' + (mine ? '2px solid var(--gold-soft,#fbbf24)' : '1px solid var(--border)') + ';border-radius:12px;padding:10px">' +
          '<img data-shirt="' + esc(d.id) + '" alt="' + esc(d.title) + '" src="' + (shirtImg[d.id] || '') + '" style="width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface2);border-radius:8px">' +
          '<div style="font-weight:700;margin-top:6px">' + (d.winner ? '🏆 ' : '') + esc(d.title) + '</div>' +
          '<div class="ch-bar" style="margin:6px 0"><div class="ch-fill" style="width:' + pct + '%;background:' + (COLOR[s.squad] || '#bb8ef5') + '"></div></div>' +
          '<div class="ms-small">' + d.votes + ' vote' + (d.votes === 1 ? '' : 's') + (mine ? ' · your pick' : '') + '</div>' +
          (s.open && !mine ? '<button class="btn btn-purple shirt-vote" data-shirt="' + esc(d.id) + '" style="margin-top:8px;width:100%">Vote</button>' : '') + '</div>';
      }).join('') + '</div><div class="ms-err" id="shirtErr"></div>';
  }
  function paintShirts(s) {
    var box = document.getElementById('shirtCard');
    if (!box) return;
    var html = shirtCardHtml(s);
    box.style.display = html ? 'block' : 'none';
    box.innerHTML = html;
    box.querySelectorAll('img[data-shirt]').forEach(function (im) {
      var id = im.getAttribute('data-shirt');
      if (shirtImg[id]) return;
      window.gasRun_('clashShirtImage', id, '').then(function (u) { shirtImg[id] = u; im.src = u; }).catch(function () {});
    });
  }
  function loadShirts() {
    if (!document.getElementById('shirtCard')) { clearInterval(shirtTimer); shirtTimer = null; return; }
    window.gasRun_('clashShirtDesigns', stored(KEY)).then(paintShirts).catch(function () {});
  }
  function startShirts() {
    loadShirts();
    if (!shirtTimer) shirtTimer = setInterval(function () { if (!document.hidden) loadShirts(); }, 10000);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.shirt-vote');
    if (!b) return;
    var err = document.getElementById('shirtErr');
    if (err) err.textContent = 'Voting…';
    var from = b.getBoundingClientRect();
    window.gasRun_('clashShirtVote', stored(KEY), b.getAttribute('data-shirt')).then(function (s) {
      paintShirts(s);
      if (window.craftCelebrate) window.craftCelebrate({ getBoundingClientRect: function () { return from; } });
    })
      .catch(function (x) { if (err) err.textContent = (x && x.message || '').replace(/^Exception:\s*/, ''); });
  });

  // Mayhem Week scoreboard (from EVENT_PAGES, loaded by App.html) for the home page and TV.
  function mayhemBoardHtml(big) {
    var sb = window.EVENT_PAGES && window.EVENT_PAGES.mayhem && window.EVENT_PAGES.mayhem.scoreboard;
    if (!sb) return '';
    var tot = function (s) { return sb.columns.reduce(function (n, c) { return n + (sb.scores[c][s] || 0); }, 0); };
    var order = SQ.slice().sort(function (a, b) { return tot(b) - tot(a); });
    var max = Math.max(tot(order[0]), 1);
    return '<div class="ch-card"><div class="ch-title">🏔️ Mayhem Week scoreboard</div><div class="ch-desc">' + sb.columns.length + ' event' + (sb.columns.length === 1 ? '' : 's') + ' scored so far' + (big ? '' : ' · full results on the Mayhem page') + '</div>' +
      order.map(function (s) {
        return '<div class="ch-row"><b style="color:' + COLOR[s] + '">' + title(s) + '</b><div class="ch-bar"><div class="ch-fill" style="width:' + Math.round(tot(s) / max * 100) + '%;background:' + COLOR[s] + '"></div></div><span>' + tot(s) + '</span></div>';
      }).join('') + '</div>';
  }
  window.clashMayhemHome_ = function () {
    var el = document.getElementById('mayhemHomeBoard');
    if (!el) return;
    var html = mayhemBoardHtml(false);
    el.style.display = html ? 'block' : 'none';
    el.innerHTML = html;
  };

  // Squad Night door (staff signed in as admin): type an 800#, see Free or Pay, let them in.
  window.openSquadNightDoor = function () {
    var ov = document.getElementById('doorOverlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'doorOverlay';
      ov.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(9,1,15,.88);display:flex;align-items:center;justify-content:center;padding:16px';
      document.body.appendChild(ov);
    }
    ov.style.display = 'flex';
    ov.innerHTML = '<div class="ms-card" style="width:min(560px,100%);margin:0"><div class="ms-h" style="font-size:22px">🌙 Squad Night door</div>' +
      '<div class="ms-form"><input id="door800" inputmode="numeric" autocomplete="off" placeholder="800 number"><button class="btn btn-purple" id="doorGo">Check</button></div>' +
      '<div id="doorOut" style="margin-top:14px"></div><div id="doorCounts" class="ms-small" style="margin-top:14px"></div>' +
      '<p style="margin-top:14px"><button class="btn" id="doorClose">Close</button></p></div>';
    var input = document.getElementById('door800'), out = document.getElementById('doorOut');
    var counts = function (c) { document.getElementById('doorCounts').innerHTML = 'Checked in: ' + SQ.map(function (s) { return '<b style="color:' + COLOR[s] + '">' + title(s) + ' ' + (c[s] || 0) + '</b>'; }).join(' · '); };
    var show = function (r) {
      var s = r.student;
      counts(r.counts);
      out.innerHTML = '<div style="font-family:Fraunces,serif;font-size:26px;font-weight:900">' + esc(s.name) + ' <span style="color:' + (COLOR[s.squad] || 'inherit') + '">' + title(s.squad || '') + '</span></div>' +
        (s.already ? '<div class="ms-err">Already checked in at ' + esc(s.already) + '.</div>'
          : '<div style="font-size:22px;font-weight:800;margin:8px 0;color:' + (s.free ? '#4ade80' : '#fbbf24') + '">' + esc(s.entry) + '</div>' +
            '<button class="btn btn-purple" id="doorIn">' + (s.free ? 'Let them in' : 'Paid, let them in') + '</button>');
      var b = document.getElementById('doorIn');
      if (b) b.onclick = function () {
        window.gasRun_('clashDoorAdmit', window.ADMIN_SESSION, s.id, !s.free).then(function (r2) { show(r2); input.value = ''; input.focus(); })
          .catch(function (x) { out.insertAdjacentHTML('beforeend', '<div class="ms-err">' + esc((x && x.message || '').replace(/^Exception:\s*/, '')) + '</div>'); });
      };
    };
    var check = function () {
      out.textContent = 'Checking…';
      window.gasRun_('clashDoorCheck', window.ADMIN_SESSION, input.value).then(show)
        .catch(function (x) { out.innerHTML = '<div class="ms-err">' + esc((x && x.message || '').replace(/^Exception:\s*/, '')) + '</div>'; });
    };
    document.getElementById('doorGo').onclick = check;
    input.onkeydown = function (e) { if (e.key === 'Enter') check(); };
    document.getElementById('doorClose').onclick = function () { ov.style.display = 'none'; };
    input.focus();
  };

  var duels = [];
  function renderHomeDuels() {
    var el = document.getElementById('duelSection');
    if (!el) return;
    el.style.display = duels.length ? 'block' : 'none';
    el.innerHTML = duels.map(function (d) { return duelCard(d); }).join('');
  }
  function loadDuels() {
    window.gasRun_('clashDuels').then(function (list) { duels = list || []; renderHomeDuels(); }).catch(function () {});
  }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function stored(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  // ── Challenges ──
  function challengeCard(c, onlySquad) {
    var squads = onlySquad ? [onlySquad] : SQ;
    var max = Math.max(c.goal || 1, 1);
    return '<div class="ch-card"><div class="ch-title">🏁 ' + esc(c.title) + '</div>' +
      (c.description ? '<div class="ch-desc">' + esc(c.description) + '</div>' : '') +
      squads.map(function (s) {
        var v = c.progress[s] || 0, pct = Math.min(100, Math.round(v / max * 100));
        return '<div class="ch-row"><b style="color:' + COLOR[s] + '">' + title(s) + '</b>' +
          '<div class="ch-bar"><div class="ch-fill" style="width:' + pct + '%;background:' + COLOR[s] + '"></div></div>' +
          '<span>' + (v >= c.goal && c.goal ? '<span class="ch-done">✓ ' + v + '/' + c.goal + '</span>' : v + '/' + c.goal) + '</span></div>';
      }).join('') +
      '<div class="ms-small" style="margin-top:8px">' + (c.measure === 'Entries' ? 'Counts entries' : 'Counts points') +
      (c.end ? ' · ends ' + esc(c.end) : '') + (c.bonus ? ' · +' + c.bonus + ' bonus for each squad that makes it' : '') + '</div></div>';
  }

  var challenges = [];
  function renderHomeChallenges() {
    var el = document.getElementById('autoChallengeSection');
    if (!el) return;
    var active = challenges.filter(function (c) { return c.active; });
    el.style.display = active.length ? 'block' : 'none';
    el.innerHTML = active.map(function (c) { return challengeCard(c); }).join('');
  }
  function loadChallenges() {
    window.gasRun_('clashChallenges').then(function (list) { challenges = list || []; renderHomeChallenges(); }).catch(function () {});
  }

  // ── My Squad ──
  function renderForm(msg) {
    var app = document.getElementById('mySquadApp');
    if (!app) return;
    app.innerHTML = '<div class="ms-card"><div class="ms-h">Type your 800 number to see what you\'ve added to your squad</div>' +
      '<div class="ms-form"><input id="ms800" inputmode="numeric" autocomplete="off" placeholder="800 number" value="' + esc(stored(KEY)) + '">' +
      '<button class="btn btn-purple" id="msGo">Show my page</button></div><div class="ms-err" id="msErr">' + esc(msg || '') + '</div></div>';
    var input = document.getElementById('ms800');
    document.getElementById('msGo').onclick = function () { lookup(input.value); };
    input.onkeydown = function (e) { if (e.key === 'Enter') lookup(input.value); };
  }

  function lookup(id) {
    var err = document.getElementById('msErr');
    if (err) err.textContent = 'Looking…';
    window.gasRun_('clashMyPage', String(id || '')).then(function (r) {
      store(KEY, String(id).replace(/\D/g, ''));
      renderMe(r);
    }).catch(function (e) {
      if (err) err.textContent = (e && e.message) ? e.message.replace(/^Exception:\s*/, '') : 'Something went wrong.';
    });
  }

  function renderMe(r) {
    var app = document.getElementById('mySquadApp');
    var me = r.me, st = r.standing;
    if (window.popSkin) window.popSkin(me.squad); // the site takes on this student's squad colors (Pop.html)
    if (app) app.style.setProperty('--squad', COLOR[me.squad] || '#bb8ef5');
    var standing = '';
    if (st) {
      standing = st.place === 1
        ? '<b>' + title(st.squad) + '</b> is in <b>1st place</b>, ' + st.leadBy.toLocaleString() + ' points ahead. Keep it up!'
        : '<b>' + title(st.squad) + '</b> is in <b>' + ['1st', '2nd', '3rd', '4th'][st.place - 1] + ' place</b>, ' +
          st.behindBy.toLocaleString() + ' points behind ' + title(st.ahead) + '. Every bill helps!';
    }
    var tiles = [
      [me.bills, 'Trait Dough bills'], [me.billsWeek, 'Bills this week'], [me.wins, 'Trait Dough wins'],
      [me.mindset, 'Mindset summits'], [me.star, 'STAR growth points'], [me.shoutouts, 'Shout-outs'],
      [me.streak + (me.streak ? ' 🔥' : ''), 'Week streak'],
    ];
    if (me.ambassador) tiles.push([me.ambassador, 'New students welcomed']);
    if (me.journal !== null) tiles.push([me.journal, 'Trail Journal growth']);
    var earned = me.badges;
    var locked = (r.allBadges || []).filter(function (b) { return earned.indexOf(b) === -1; });
    var mine = (r.challenges || []).map(function (c) { return challengeCard(c, me.squad); }).join('');
    app.innerHTML =
      '<div class="ms-card" style="border-color:' + COLOR[me.squad] + '">' +
        '<div class="ms-hello">Hi, ' + esc(me.name) + '!</div>' +
        (me.squad ? '<span class="ms-squad" style="background:' + COLOR[me.squad] + '">' + me.squad + ' SQUAD</span>' : '') +
        (r.roles || []).map(function (x) { return ' <span class="ms-badge" style="padding:4px 10px">⭐ ' + esc(x) + '</span>'; }).join('') +
        (r.theme && r.theme.theme ? '<div class="ms-standing">Squad theme: <b>' + esc(r.theme.theme) + '</b>' + (r.theme.meaning ? ' · ' + esc(r.theme.meaning) : '') +
          (r.theme.project ? '<br>Service project: ' + esc(r.theme.project) + (r.theme.goal ? ' (' + r.theme.progress + ' of ' + r.theme.goal + ')' : '') : '') + '</div>' : '') +
        (r.theme && r.theme.trait ? '<div class="ms-standing">Squad trait: <b>' + esc(r.theme.trait) + '</b></div>' : '') +
        '<div class="ms-standing">' + standing + '</div>' + (st && st.frozen && window.thawHtml ? window.thawHtml(st.frozen) : '') +
        (window.freezeExplainer ? window.freezeExplainer(st && st.freshStart, false) : '') + '</div>' +
      loreCard(r.theme, me.squad) + chaptersCard(r.lore, me.squad) +
      (r.duels || []).map(function (d) { return duelCard(d, me.squad); }).join('') +
      '<div class="ms-card"><div class="ms-h">What you\'ve added</div><div class="ms-tiles">' +
        tiles.map(function (t) { return '<div class="ms-tile"><div class="ms-tile-val"' + (/^\d+$/.test(String(t[0])) ? ' data-count="' + t[0] + '"' : '') + '>' + esc(t[0]) + '</div><div class="ms-tile-lbl">' + esc(t[1]) + '</div></div>'; }).join('') +
      '</div></div>' +
      '<div class="ms-card"><div class="ms-h">Badges (' + earned.length + ' of ' + Math.max(earned.length, (r.allBadges || []).length) + ')</div><div class="ms-badges">' +
        earned.map(function (b) { return '<span class="ms-badge">' + esc(b) + '</span>'; }).join('') +
        locked.map(function (b) { return '<span class="ms-badge locked">🔒 ' + esc(b) + '</span>'; }).join('') +
      '</div></div>' +
      '<div class="ms-card" id="shirtCard" style="display:none"></div>' +
      signupsCard(r.signups) +
      passportCard(r.passport) +
      '<div id="myPollSection" style="display:none"></div>' +
      (mine ? '<div class="ms-h" style="margin-top:6px">Your squad\'s challenges</div>' + mine : '') +
      '<div class="ms-small">Updated every hour' + (me.updated ? ' · last update ' + esc(me.updated) : '') +
      ' · <a href="#" id="msNotMe" style="color:var(--purple-lt)">Not you? Switch</a></div>';
    document.getElementById('msNotMe').onclick = function (e) { e.preventDefault(); store(KEY, null); if (window.popSkin) window.popSkin(''); renderForm(); };
    if (typeof loadPolls === 'function') loadPolls(); // shows what this student voted
    startShirts(); // Mayhem shirt designs, live
    if (window.popCountUp) window.popCountUp(app); // stat tiles count up (Pop.html)
    var card = app.querySelector('.ms-card');
    if (card) card.classList.add('craft-lit', 'craft-motes'); // the player card is lit like a film still (Craft)
  }

  // ── TV slides (called from buildTV in App) ──
  window.clashStudentTV_ = function () {
    var ch = document.getElementById('tvChallenges');
    if (ch) {
      var active = challenges.filter(function (c) { return c.active; });
      var pollTv = polls.today.map(function (p) {
        if (p.kind === 'Pulse') return ''; // the Pulse gets its own live slide
        return '<div class="ch-card"><div class="ch-title">🗳️ Today\'s ' + (p.kind === 'Trivia' ? 'trivia' : 'This or That') + ': ' + esc(p.question) + '</div>' +
          '<div class="ch-desc">' + p.choices.map(esc).join(' or ') + '? Vote on clashofclasses.org with your 800#. Every vote = a squad point!</div></div>';
      }).join('');
      ch.innerHTML = pollTv + (active.length ? active.slice(0, 3).map(function (c) { return challengeCard(c); }).join('')
        : (pollTv ? '' : '<div class="ch-card"><div class="ch-title">🏁 No challenge running right now</div></div>'));
    }
    var feed = document.getElementById('tvFeed');
    if (feed) window.gasRun_('clashTvFeed').then(function (f) {
      // Duels and newly unlocked lore chapters go at the top of the challenges slide.
      var extra = mayhemBoardHtml(true) + (f.duels || []).filter(function (d) { return d.active || d.done; }).slice(0, 2).map(function (d) { return duelCard(d); }).join('') +
        (f.lore || []).map(function (u) {
          return '<div class="ch-card"><div class="ch-title" style="color:' + COLOR[u.squad] + '">📜 ' + title(u.squad) + ' unlocked Chapter ' + u.chapter + ': ' + esc(u.title) + '</div>' +
            '<div class="ch-desc">Read it on My Squad at clashofclasses.org</div></div>';
        }).join('');
      if (ch && extra) ch.innerHTML = extra + ch.innerHTML.replace(/<div class="ch-card"><div class="ch-title">🏁 No challenge running right now<\/div><\/div>/, '');
      var left = '<div><div class="tv-cat-title">⚡ Latest points</div>' + (f.latest || []).map(function (e) {
        var pts = SQ.filter(function (s) { return e.pts[s]; }).map(function (s) {
          return '<b style="color:' + COLOR[s] + '">' + title(s) + ' +' + e.pts[s] + '</b>';
        }).join(' ');
        return '<div class="tv-feed-item"><span>' + esc(e.label ? e.label + ' · ' : '') + esc(e.name) + '</span><span>' + pts + '</span></div>';
      }).join('') + '</div>';
      var right = (f.stars || []).length ? '<div><div class="tv-cat-title">🏅 Badge leaders</div>' + f.stars.map(function (s) {
        return '<div class="tv-feed-item"><span style="color:' + (COLOR[s.squad] || 'inherit') + '">' + esc(s.name) + '</span><span>' + s.badges + ' 🏅</span></div>';
      }).join('') + '</div>' : '';
      feed.innerHTML = left + right;
    }).catch(function () {});
  };

  // ── Daily Polls (06_Polls.gs): vote with your 800#, results after you vote ──
  var polls = { today: [], last: null };
  function pollCard(p) {
    var showCounts = p.counts && (p.voted || p.closed);
    var total = Math.max(1, Object.keys(p.counts || {}).reduce(function (n, k) { return n + p.counts[k]; }, 0));
    var head = '<div class="ch-title">' + (p.kind === 'Pulse' ? '📊 Pulse' : '🗳️ ' + (p.kind === 'Trivia' ? 'Trivia' : 'This or That')) + (p.closed ? ' · results' : '') + '</div><div class="ch-desc">' + esc(p.question) + '</div>';
    if (p.kind === 'Pulse') {
      if (!showCounts && !p.closed) {
        return '<div class="ch-card" style="border-color:#38bdf8">' + head + '<div class="ms-form">' + p.choices.map(function (c) {
          return '<button class="btn btn-purple poll-choice" data-poll="' + esc(p.id) + '" data-choice="' + esc(c) + '">' + esc(c) + '</button>';
        }).join(' ') + '</div><div class="ms-small" style="margin-top:8px">No right answer: EMS wants to know what you think. Every answer earns your squad a point' +
          (p.through && p.through > p.date ? ' (open through ' + esc(p.through.slice(5).replace('-', '/')) + ')' : '') + '.</div><div class="ms-err poll-err"></div></div>';
      }
      return '<div class="ch-card" style="border-color:#38bdf8">' + head + pulseBars(p.choices, p.counts || {}, p.total) +
        '<div class="ms-small" style="margin-top:8px">' + (p.voted ? 'You said <b>' + esc(p.voted) + '</b>. ' : '') + p.total + (p.total === 1 ? ' answer' : ' answers') +
        ' · <a href="#" class="pulse-open" style="color:#38bdf8">Watch it live</a></div></div>';
    }
    if (!showCounts && !p.closed) {
      return '<div class="ch-card">' + head + '<div class="ms-form">' + p.choices.map(function (c) {
        return '<button class="btn btn-purple poll-choice" data-poll="' + esc(p.id) + '" data-choice="' + esc(c) + '">' + esc(c) + '</button>';
      }).join(' ') + '</div><div class="ms-small" style="margin-top:8px">Vote with your 800#: every vote earns your squad a point' +
        (p.kind === 'Trivia' ? ', and a right answer earns one more.' : ', and picking the winning side earns one more.') + '</div><div class="ms-err poll-err"></div></div>';
    }
    return '<div class="ch-card">' + head + p.choices.map(function (c) {
      var v = (p.counts || {})[c] || 0, pct = Math.round(100 * v / total);
      var mark = (p.winners || []).indexOf(c) > -1 ? ' 🏆' : '';
      return '<div class="ch-row"><b>' + esc(c) + mark + '</b><div class="ch-bar"><div class="ch-fill" style="width:' + pct + '%;background:var(--gold-soft,#fbbf24)"></div></div><span>' + pct + '%</span></div>';
    }).join('') + '<div class="ms-small" style="margin-top:8px">' + (p.voted ? 'You picked <b>' + esc(p.voted) + '</b>. ' : '') +
      (p.kind === 'Trivia' ? (p.closed ? 'Answer: <b>' + esc(p.answer) + '</b>' : 'The answer is revealed tomorrow!') : (p.closed ? '' : 'Final results tomorrow.')) + ' · ' + p.total + (p.total === 1 ? ' vote' : ' votes') + '</div></div>';
  }
  // ── Pulse: big Menti-style bars, a squad turnout race, the Pulse page and a TV slide ──
  var PULSE_COLORS = ['#ffe100', '#bb8ef5', '#38bdf8', '#4ade80', '#fb7185', '#f59e0b', '#a3e635', '#f472b6'];
  function pulseBars(choices, counts, total) {
    var max = Math.max.apply(null, choices.map(function (c) { return counts[c] || 0; }).concat([0]));
    return '<div class="pulse-bars">' + choices.map(function (c, i) {
      var v = counts[c] || 0, pct = total ? Math.round(100 * v / total) : 0, col = PULSE_COLORS[i % PULSE_COLORS.length];
      return '<div class="pulse-row' + (v && v === max ? ' top' : '') + '"><div class="pulse-lbl">' + esc(c) + '</div>' +
        '<div class="pulse-track"><div class="pulse-fill" data-w="' + pct + '" style="background:' + col + ';color:' + col + '"></div></div>' +
        '<div class="pulse-num">' + pct + '%<small>' + v + '</small></div></div>';
    }).join('') + '</div>';
  }
  // Bars start at 0 and grow (and grow again from where they were on a refresh).
  function growBars(root) {
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      (root || document).querySelectorAll('.pulse-fill[data-w], .pulse-race i[data-w]').forEach(function (b) { b.style.width = b.getAttribute('data-w') + '%'; });
    }); });
  }
  function pulseRace(t) {
    return '<div class="pulse-race">' + SQ.map(function (s) {
      var x = (t || {})[s] || { n: 0, pct: 0 };
      return '<div><b style="color:' + COLOR[s] + '">' + title(s) + '</b> · ' + x.pct + '% answered<i data-w="' + Math.min(100, x.pct) + '" style="width:0;background:' + COLOR[s] + '"></i></div>';
    }).join('') + '</div>';
  }
  function pulseScreen(p, opts) {
    opts = opts || {};
    var mine = (polls.today || []).filter(function (x) { return x.id === p.id; })[0];
    var vote = !opts.tv && !p.closed && mine && !mine.voted
      ? '<div class="pulse-vote">' + p.choices.map(function (c) { return '<button class="btn btn-purple poll-choice" data-poll="' + esc(p.id) + '" data-choice="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div><div class="ms-err poll-err"></div>'
      : mine && mine.voted ? '<div class="ms-small" style="margin-bottom:10px">You said <b>' + esc(mine.voted) + '</b>. Thanks!</div>' : '';
    return '<div class="' + (opts.tv ? '' : 'ch-card') + '" data-pulse="' + esc(p.id) + '"><span class="pulse-tag">' + (p.closed ? 'Pulse · results' : 'Pulse · live') + '</span>' +
      '<div class="pulse-q">' + esc(p.question) + '</div>' + vote + pulseBars(p.choices, p.counts, p.total) + pulseRace(p.turnout) +
      '<div class="pulse-total">' + p.total + (p.total === 1 ? ' answer' : ' answers') + (p.closed ? '' : ' so far · ' + (opts.tv ? 'answer at clashofclasses.org with your 800#' : 'open through ' + esc(String(p.through).slice(5).replace('-', '/'))) + ' · every answer = a squad point') + '</div></div>';
  }
  var pulseData = null, pulseTimer = null;
  function drawPulsePage() {
    var box = document.getElementById('pulseBody');
    if (!box || !pulseData) return;
    var live = pulseData.live || [], recent = pulseData.recent || [];
    box.innerHTML = (live.length ? live.map(function (p) { return pulseScreen(p); }).join('')
      : '<div class="ch-card"><div class="ch-title">No Pulse question open right now</div><div class="ch-desc">A new one comes out every week or so. Here\'s what EMS said last time.</div></div>') +
      (recent.length ? '<div class="ms-h" style="margin-top:18px">What EMS said</div>' + recent.map(function (p) { return pulseScreen(p); }).join('') : '');
    growBars(box);
  }
  window.renderPulsePage = function () {
    var box = document.getElementById('pulseBody');
    if (!box || !window.gasRun_) return;
    if (!pulseData) box.innerHTML = '<p style="color:var(--text3)">Loading the Pulse…</p>';
    var load = function () {
      var page = document.getElementById('page-pulse');
      if (pulseData && page && !page.classList.contains('active')) { clearInterval(pulseTimer); pulseTimer = null; return; }
      window.gasRun_('clashPulseLive').then(function (d) { pulseData = d; drawPulsePage(); }).catch(function () {});
    };
    load(); loadPolls();
    if (!pulseTimer) pulseTimer = setInterval(load, 15000); // live, like a Menti screen
  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('.pulse-open');
    if (!a) return;
    e.preventDefault();
    if (typeof window.goTo === 'function') window.goTo('pulse');
  });
  window.clashPulseTV_ = function () {
    var box = document.getElementById('tvPulse');
    if (!box || !window.gasRun_) return;
    window.gasRun_('clashPulseLive').then(function (d) {
      var p = (d.live || [])[0];
      window._tvPulse = !!p;
      box.innerHTML = p ? pulseScreen(p, { tv: true }) : '';
      growBars(box);
    }).catch(function () { window._tvPulse = false; });
  };

  function renderPolls() {
    var html = polls.today.map(pollCard).join('') + (polls.last ? pollCard(polls.last) : '');
    ['dailyPollSection', 'myPollSection'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.style.display = html ? 'block' : 'none';
      el.innerHTML = html;
      growBars(el);
    });
  }
  function loadPolls() {
    window.gasRun_('clashDailyPolls', stored(KEY)).then(function (d) { polls = d; renderPolls(); }).catch(function () {});
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.poll-choice');
    if (!b) return;
    var id = stored(KEY) || window.prompt('Type your 800 number to vote:') || '';
    var card = b.closest('.ch-card'), err = card.querySelector('.poll-err');
    if (!String(id).replace(/\D/g, '')) return;
    if (err) err.textContent = 'Voting…';
    var from = b.getBoundingClientRect();
    window.gasRun_('clashPollVote', b.getAttribute('data-poll'), id, b.getAttribute('data-choice')).then(function (d) {
      store(KEY, String(id).replace(/\D/g, ''));
      polls = d; renderPolls();
      if (document.getElementById('page-pulse') && document.getElementById('page-pulse').classList.contains('active')) window.renderPulsePage();
      // Your vote earned your squad a point: celebrate it.
      if (window.craftCelebrate) window.craftCelebrate({ getBoundingClientRect: function () { return from; } });
    }).catch(function (x) { if (err) err.textContent = (x && x.message || '').replace(/^Exception:\s*/, ''); });
  });

  function start() {
    renderForm();
    var saved = stored(KEY);
    if (saved) lookup(saved);
    loadChallenges();
    loadPolls();
    loadDuels();
    setInterval(loadDuels, 120000);
    setInterval(loadChallenges, 120000);
    setInterval(loadPolls, 60000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
