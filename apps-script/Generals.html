<style>
/* ── Generals HQ (Generals.html) ── */
.hq-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.hq-tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px; }
.hq-tab.on { background: var(--squad, var(--gold-soft, #fbbf24)); color: #111; border-color: transparent; }
@media (hover: hover) { .hq-tab:not(.on):hover { border-color: color-mix(in srgb, var(--squad, #fbbf24) 55%, transparent); } }
/* Phones: one swipeable row of tabs instead of three rows of pills. */
@media (max-width: 640px) { .hq-tabs { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; padding: 0 2px 6px; scrollbar-width: none; } .hq-tabs::-webkit-scrollbar { display: none; } .hq-tab { flex: 0 0 auto; scroll-snap-align: start; } }

/* HQ header: the squad's command deck. Contour backdrop in squad color, three numbers a General
   checks every visit (place, points, who still needs an event). */
.ms-card.hq-deck { position: relative; overflow: hidden; border-radius: 22px; padding: 24px; border: 1px solid color-mix(in srgb, var(--squad, #bb8ef5) 40%, transparent);
  background: radial-gradient(110% 130% at 100% 0%, color-mix(in srgb, var(--squad, #bb8ef5) 28%, transparent), transparent 60%), var(--pop-topo) center/600px auto repeat, #14082a; }
.hq-kicker { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: .08em; color: var(--squad, #d6c2ff); }
.hq-deck .ms-hello { font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.02em; line-height: 1.05; margin: 4px 0 16px; text-wrap: balance; }
.hq-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hq-stat { padding: 14px; border-radius: 16px; background: rgba(10,4,20,.5); border: 1px solid rgba(255,255,255,.08); min-width: 0; }
.hq-stat .v { font-family: 'Fraunces', serif; font-weight: 900; font-size: clamp(26px, 4vw, 38px); line-height: 1; color: var(--pop-gold, #ffe100); font-variant-numeric: tabular-nums; }
.hq-stat .l { font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #cbb6ef; margin-top: 7px; }
.hq-stat .g { font-size: 12px; color: #d6c2ff; margin-top: 3px; line-height: 1.35; }
.hq-stat.need .v { color: #fca5a5; } .hq-stat.done .v { color: #86efac; }
.hq-freeze { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(147,197,253,.12); border: 1px solid rgba(147,197,253,.3); color: #bfdbfe; font-size: 13.5px; line-height: 1.5; }
.hq-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hq-tags span { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.07); color: #e9ddff; }
@media (max-width: 420px) { .hq-deck { padding: 18px; } .hq-stat { padding: 11px; } .hq-stat .l { font-size: 9.5px; letter-spacing: .08em; } }
.hq-pill[data-rm] { cursor: pointer; transition: background .15s; }
@media (hover: hover) { .hq-pill[data-rm]:hover { background: rgba(248,113,113,.18); } }
.hq-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
.hq-row:first-child { border-top: 0; }
.hq-pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface2); margin: 2px 2px 0 0; }
.hq-pill.need { background: rgba(248,113,113,.15); color: #f87171; }
.hq-pill.role { background: rgba(251,191,36,.15); color: var(--gold-soft, #fbbf24); }
.hq-select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; max-width: 220px; }
.hq-check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); cursor: pointer; }
.hq-check input { width: 20px; height: 20px; margin-top: 2px; }
.hq-script { white-space: pre-wrap; background: var(--surface2); border-radius: 12px; padding: 16px; font-size: 15px; line-height: 1.6; }
.hq-meet { position: fixed; inset: 0; background: radial-gradient(80% 70% at 50% 0%, color-mix(in srgb, var(--squad, #9b5de5) 26%, transparent), transparent 70%), var(--pop-topo) center/700px auto repeat, #0f0a1e; color: #fff; z-index: 100000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 5vw; }
.hq-meet.on { display: flex; }
/* Each meeting slide settles in when you click next (a few times a meeting, projected). */
.hq-meet h2, .hq-meet .hq-mbody { animation: hqSlide .45s cubic-bezier(.22,1,.36,1) both; }
.hq-meet .hq-mbody { animation-delay: .06s; }
@keyframes hqSlide { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { .hq-meet h2, .hq-meet .hq-mbody { animation: none; } }
.hq-meet h2 { font-family: 'Fraunces', serif; font-size: clamp(28px, 5vw, 64px); margin: 0 0 18px; color: var(--gold-soft, #fbbf24); }
.hq-meet .hq-mbody { font-size: clamp(18px, 2.4vw, 32px); max-width: 1100px; line-height: 1.5; }
.hq-meet .hq-mnav { position: absolute; bottom: 24px; left: 0; right: 0; display: flex; gap: 12px; justify-content: center; align-items: center; }
.hq-mbtn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
</style>
<script>
/* Generals HQ: sign in with 800# + the Generals code; manage your squad (05_Generals.gs). */
(function () {
  var SQ = ['BLACK', 'GOLD', 'GREY', 'PURPLE'];
  var COLOR = { BLACK: 'var(--sq-black, #c5c9d1)', GOLD: 'var(--sq-gold, #ffe100)', GREY: 'var(--sq-grey, #99a8bb)', PURPLE: 'var(--sq-purple, #bb8ef5)' };
  var token = '', data = null, view = 'roster', meet = 0, counted = false;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { return s ? s.charAt(0) + s.slice(1).toLowerCase() : ''; }
  function el() { return document.getElementById('hqApp'); }

  function signIn() {
    el().innerHTML = '<div class="ms-card"><div class="ms-h">Generals HQ: sign in</div>' +
      '<div class="ms-form"><input id="hq800" inputmode="numeric" placeholder="Your 800 number"><input id="hqCode" type="password" placeholder="Generals code"><button class="btn btn-purple" id="hqGo">Open HQ</button></div>' +
      '<div class="ms-err" id="hqErr"></div><div class="ms-small">Only Squad Generals on the MLC Roster can open HQ. Ask your staff advisor for the code.</div>' +
      '<details style="margin-top:12px"><summary class="ms-small" style="cursor:pointer">Staff: preview a squad\'s HQ</summary>' +
      '<div class="ms-form" style="margin-top:8px"><select id="hqPrevSq"><option value="BLACK">Black</option><option value="GOLD">Gold</option><option value="GREY">Grey</option><option value="PURPLE">Purple</option></select>' +
      '<input id="hqPrevPw" type="password" placeholder="Admin password"><button class="btn" id="hqPrevGo">Preview HQ</button></div>' +
      '<div class="ms-small">Opens the real HQ: anything you sign up, tick or nominate there is saved.</div></details></div>';
    var preview = function () {
      var e = document.getElementById('hqErr'); e.textContent = 'Checking…';
      window.gasRun_('clashGeneralsPreview', document.getElementById('hqPrevPw').value, document.getElementById('hqPrevSq').value).then(function (r) {
        token = r.token; load();
      }).catch(function (x) { e.textContent = x.message.replace(/^Exception:\s*/, ''); });
    };
    document.getElementById('hqPrevGo').onclick = preview;
    document.getElementById('hqPrevPw').onkeydown = function (ev) { if (ev.key === 'Enter') preview(); };
    var go = function () {
      var e = document.getElementById('hqErr'); e.textContent = 'Checking…';
      window.gasRun_('clashGeneralsSignIn', document.getElementById('hq800').value, document.getElementById('hqCode').value).then(function (r) {
        token = r.token; load();
      }).catch(function (x) { e.textContent = x.message.replace(/^Exception:\s*/, ''); });
    };
    document.getElementById('hqGo').onclick = go;
    document.getElementById('hqCode').onkeydown = function (ev) { if (ev.key === 'Enter') go(); };
  }

  function load() { window.gasRun_('clashGeneralsHq', token).then(function (d) { data = d; if (window.popSkin) window.popSkin(d.squad); render(); }).catch(fail); }
  function act(fn) { var args = Array.prototype.slice.call(arguments, 1); return window.gasRun_.apply(null, [fn, token].concat(args)).then(function (d) { data = d; render(); }).catch(function (x) { alert(x.message.replace(/^Exception:\s*/, '')); }); }
  function fail(x) { if (/sign in/i.test(x.message)) { token = ''; signIn(); } else el().innerHTML = '<div class="ms-card ms-err">' + esc(x.message) + '</div>'; }

  function render() {
    var d = data, st = d.standing, sq = d.squad;
    var place = st ? ['1st', '2nd', '3rd', '4th'][st.place - 1] : '-';
    var gap = st ? (st.place > 1 ? st.behindBy.toLocaleString() + ' behind ' + title(st.ahead) : 'Leading by ' + st.leadBy.toLocaleString()) : '';
    var tags = (d.theme ? '<span>Theme: <b>' + esc(d.theme.theme) + '</b> · ' + esc(d.theme.meaning) + '</span>' : '') +
      (d.theme && d.theme.trait ? '<span>Squad trait: <b>' + esc(d.theme.trait) + '</b></span>' : '') +
      (d.theme && d.theme.lore ? '<span>📜 <b>' + esc(d.theme.lore.title || 'Our story') + '</b> is on My Squad and in the meeting slides</span>' : '');
    var head = (d.me.preview ? '<div class="ms-card" style="border:1.5px solid var(--gold-soft);padding:8px 12px;font-size:13px">👀 Staff preview of ' + title(sq) + ' Squad HQ. Changes made here are real. <a href="#" id="hqSwitchSq">Preview another squad</a></div>' : '') +
      '<div class="ms-card hq-deck craft-lit craft-motes"><div class="hq-kicker">' + (d.me.preview ? '' : 'General ') + esc(d.me.name) + '</div>' +
      '<div class="ms-hello">' + title(sq) + ' Squad HQ</div>' +
      '<div class="hq-stats">' +
        '<div class="hq-stat"><div class="v">' + place + '</div><div class="l">Place</div>' + (gap ? '<div class="g">' + esc(gap) + '</div>' : '') + '</div>' +
        '<div class="hq-stat"><div class="v"' + (st && !counted ? ' data-count="' + st.total + '"' : '') + '>' + (st ? st.total.toLocaleString() : '0') + '</div><div class="l">Points</div></div>' +
        '<div class="hq-stat ' + (d.notPlaced ? 'need' : 'done') + '"><div class="v">' + d.notPlaced + '</div><div class="l">Not placed</div><div class="g">of ' + d.roster.length + ' members</div></div>' +
      '</div>' +
      (st && st.frozen && window.thawHtml ? window.thawHtml(st.frozen, { hq: true }) : '') + // thaw goals and, for a Fun Freeze, cash out (Pop.html)
      (tags ? '<div class="hq-tags">' + tags + '</div>' : '') + '</div>';
    var tabs = [['roster', '👥 Roster & sign-ups'], ['mayhem', '⚡ Mayhem checklist'], ['hype', '📣 Hype script'], ['meeting', '🎤 Squad meeting'], ['service', '🤝 Service project'], ['nominate', '📝 Nominate & letters'], ['shirts', '👕 Shirt designs']];
    tabs.splice(1, 0, ['game', '🎲 Game']);
    var waiting = d.checkins ? d.checkins.waiting : 0;
    tabs.splice(1, 0, ['checkins', '✅ Check-ins' + (waiting ? ' (' + waiting + ')' : '')]);
    tabs.push(['job', '🎖️ My job']);
    var body = { roster: rosterView, checkins: checkinsView, game: gameView, mayhem: mayhemView, hype: hypeView, meeting: meetingView, service: serviceView, nominate: nominateView, shirts: shirtsView, job: jobView }[view]();
    el().innerHTML = head + '<div class="hq-tabs">' + tabs.map(function (t) { return '<button class="hq-tab' + (view === t[0] ? ' on' : '') + '" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') +
      '<button class="hq-tab" data-v="out">Sign out</button></div>' + body;
    el().querySelectorAll('.hq-tab').forEach(function (b) { b.onclick = function () { if (b.dataset.v === 'out') { token = ''; signIn(); return; } view = b.dataset.v; render(); }; });
    var sw = document.getElementById('hqSwitchSq');
    if (sw) sw.onclick = function (ev) { ev.preventDefault(); token = ''; signIn(); var dt = el().querySelector('details'); if (dt) dt.open = true; };
    wire();
    if (!counted && window.popCountUp) { window.popCountUp(el()); counted = true; } // points count up on the first visit only
  }


  // My job: the Squad General one-pager in short, with the full handbook (Settings › GENERALS_HANDBOOK).
  function jobView() {
    var col = function (h, sub, items) { return '<div class="ms-card" style="flex:1 1 220px"><div class="ms-h">' + h + '</div><div style="opacity:.8;margin-bottom:6px">' + sub + '</div><ul style="margin:0;padding-left:18px">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></div>'; };
    return '<div style="display:flex;flex-wrap:wrap;gap:12px">' +
      col('📣 Rally', 'Build energy and pride.', ['Get people excited about events', 'Spread the word and make announcements', 'Celebrate squad wins', 'Pull in quieter students']) +
      col('🗂️ Organize', 'Get the squad ready.', ['Run sign-ups and hit deadlines', 'Everyone gets a turn before anyone goes twice', 'Notice who needs a check-in', 'Pass on information clearly']) +
      col('⭐ Model', 'Be the example.', ['Your squad watches how you handle hard moments', 'Show the Life Ready Graduate traits', 'Own mistakes and make them right']) +
      '</div><div class="ms-card"><div class="ms-h">My commitment</div><ul style="margin:0;padding-left:18px">' +
      ['Show up to meetings, prepared', 'Follow through on what I say', 'Know what is happening with my squad', 'Include people beyond my friends', 'Lead with character'].map(function (i) { return '<li>✓ ' + i + '</li>'; }).join('') + '</ul>' +
      (data.handbook ? '<p style="margin-top:12px"><a class="hq-mbtn" href="' + esc(data.handbook) + '" target="_blank" rel="noopener">📘 Open the Squad General handbook</a></p>' : '') + '</div>';
  }

  // Game (15_Game.gs): Chance cards, Flip Three, the Hot Streak, the squad engine, the map.
  function gameView() {
    var g = data.game || {}, sq = data.squad, out = '';
    if (g.error) return '<div class="ms-card ms-err">' + esc(g.error) + '</div>';
    var rivals = SQ.filter(function (s) { return s !== sq; });
    if (g.cards) {
      out += '<div class="ms-card"><div class="ms-h">🃏 Chance cards</div><p class="ms-small">Draw ' + (g.drawsLeft ? 'your card for this week' : 'again next week') + '. Points cards count right away; the rest wait in your hand until you play them.</p>' +
        (g.drawsLeft ? '<p><button class="btn btn-gold" id="gDraw">Draw a card (' + g.drawsLeft + ' left this week)</button></p>' : '') +
        (g.hand.length ? g.hand.map(function (h) {
          var play = h.status === 'Armed' ? '<span class="hq-pill role">Armed: it goes off on its own</span>'
            : h.effect === 'flip_three' ? '<select class="hq-select" data-target="' + h.row + '"><option value="">Pick a rival…</option>' + rivals.map(function (r) { return '<option value="' + r + '">' + title(r) + '</option>'; }).join('') + '</select> <button class="btn btn-sm btn-purple" data-play="' + h.row + '">Flip Three!</button>'
            : '<button class="btn btn-sm btn-purple" data-play="' + h.row + '">Play</button>';
          return '<div class="hq-row"><div><b>' + esc(h.card) + '</b><br><span class="ms-small">' + esc(h.text) + '</span></div><div>' + play + '</div></div>';
        }).join('') : '<p class="ms-small">Your hand is empty.</p>') + '<div id="gFlip"></div></div>';
    }
    if (g.streak) {
      out += '<div class="ms-card"><div class="ms-h">🔥 Hot Streak: ' + g.streak.length + ' day' + (g.streak.length === 1 ? '' : 's') + '</div>' +
        '<p class="ms-small">Days in a row your squad had the most Daily Poll voters. Ride it for more, or bank it now. If another squad tops a day first, it cools off (no points are ever lost).' + (g.streak.shields ? ' A Steady Footing card is protecting it.' : '') + '</p>' +
        (g.streak.bank ? '<p><button class="btn btn-gold" id="gBank">Bank it: +' + g.streak.bank + '</button></p>' : '<p class="ms-small">Two days in a row starts a streak you can bank.</p>') + '</div>';
    }
    if (g.engine && g.engine.length) {
      out += '<div class="ms-card"><div class="ms-h">⚙️ Squad engine</div>' + g.engine.map(function (p) {
        var on = p.unlocked[sq];
        return '<div class="hq-row"><div><b>' + (on ? '⚡ ' : '🔒 ') + esc(p.power) + '</b> <span class="hq-pill">' + esc(p.habitat) + '</span><br><span class="ms-small">' + esc(p.text) + (on ? '' : ' · Unlocks: ' + esc(p.hint || p.rule)) + '</span></div></div>';
      }).join('') + '</div>';
    }
    if (g.monster && window.GameUi) out += '<div class="ms-card"><div class="ms-h">⚔️ The Opponent</div>' + GameUi.monster(g.monster) + '</div>';
    if (g.map && window.GameUi) out += '<div class="ms-card"><div class="ms-h">🗺️ The mountain</div><p class="ms-small">Win the most points in a territory to claim it. Hold a whole region and it pays double.</p>' + GameUi.board(g.map) + '</div>';
    return out || '<div class="ms-card ms-small">The game layer is off right now.</div>';
  }

  // Everyone placed once before anyone doubles up (Generals Handbook): least-placed first.
  // Squad event check-ins (26_CheckIns.gs): confirm who really took part. Only confirmed ones count
  // toward Gym 1 (Move · Make · Talk) on the map.
  function checkinsView() {
    var c = data.checkins || { rows: [], events: [] };
    var byEvent = {};
    c.rows.forEach(function (r) { var k = r.date + '|' + r.event; (byEvent[k] = byEvent[k] || { event: r.event, date: r.date, kind: r.kind, rows: [] }).rows.push(r); });
    var groups = Object.keys(byEvent).sort().reverse().map(function (k) {
      var g = byEvent[k], done = g.rows.filter(function (r) { return r.confirmed; }).length;
      return '<div class="ms-card"><div class="ms-h">' + esc(g.event) + ' <span class="ms-small">' + esc(g.kind) + ' · ' + esc(g.date) + ' · ' + done + ' of ' + g.rows.length + ' confirmed</span></div>' +
        g.rows.map(function (r) {
          return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>' + esc(r.name) + '</span><span>' +
            (r.confirmed ? '<span class="ch-done">✓ Confirmed' + (r.by ? ' by ' + esc(r.by) : '') + '</span>'
              : '<button class="btn btn-gold" data-ci-ok="' + r.row + '">Confirm</button>') +
            ' <button class="btn" data-ci-rm="' + r.row + '" title="Didn\'t take part">✕</button></span></div>';
        }).join('') + '</div>';
    }).join('');
    var add = c.events.length ? '<div class="ms-card"><div class="ms-h">Add someone who forgot to check in</div><div class="ms-form">' +
      '<select id="ciEvent" aria-label="Event">' + c.events.map(function (e) { return '<option value="' + esc(e.event) + '">' + esc(e.event) + ' (' + esc(e.kind) + ', ' + esc(e.date) + ')</option>'; }).join('') + '</select>' +
      '<select id="ciWho" aria-label="Squad member"><option value="">Pick a member…</option>' + (data.roster || []).map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-purple" id="ciAdd">Add as confirmed</button></div></div>' : '';
    return '<div class="ms-card"><div class="ms-h">Squad event check-ins</div><p class="ms-small">Students check in on the site at Move, Make and Talk events. Confirm the ones who really took part and remove the rest. ' +
      'Confirmed members plus the squad\'s event points win Gym 1 on the map each month.</p></div>' +
      (groups || '<div class="ms-card"><p>No check-ins yet. They show up here when your squad checks in at a Move, Make or Talk event.</p></div>') + add;
  }
  function rosterView() {
    var d = data;
    var open = d.events.filter(function (e) { return e.open; });
    var opts = open.map(function (e) { return '<option value="' + esc(e.event) + '">' + esc(e.event) + (e.slot ? ' · ' + esc(e.slot) : '') + (e.spots ? ' (' + e.taken + '/' + e.spots + ')' : '') + '</option>'; }).join('');
    return '<div class="ms-card"><div class="ms-h">Events open for sign-up</div>' +
      (d.signupLimit ? '<p class="ms-small">Each student can be in up to ' + d.signupLimit + ' events, never two at the same time. Place everyone once before anyone doubles up.</p>' : '') +
      (d.events.length ? d.events.map(function (e) { return '<span class="hq-pill">' + esc(e.event) + (e.type ? ' · ' + esc(e.type) : '') + (e.slot ? ' · ' + esc(e.slot) : '') + (e.date ? ' · ' + esc(e.date) : '') + ' · ' + e.taken + (e.spots ? '/' + e.spots : '') + (e.open ? '' : ' · closed') + '</span>'; }).join('') : '<span class="ms-small">Staff add events on the Sign-up Events tab.</span>') + '</div>' +
      '<div class="ms-card"><div class="ms-h">Squad roster (not placed yet first)</div>' +
      d.roster.map(function (s) {
        return '<div class="hq-row"><div><b>' + esc(s.name) + '</b>' + (s.grade ? ' <span class="ms-small">Gr ' + esc(s.grade) + '</span>' : '') + '<br>' +
          (s.events.length ? s.events.map(function (e) { return '<span class="hq-pill" title="Click to remove" data-rm="' + esc(e) + '" data-id="' + esc(s.id) + '">✓ ' + esc(e) + ' ✕</span>'; }).join('') : '<span class="hq-pill need">Not placed yet</span>') +
          s.roles.map(function (r) { return '<span class="hq-pill role">⭐ ' + esc(r) + '</span>'; }).join('') + '</div>' +
          (opts ? '<div><select class="hq-select" data-add="' + esc(s.id) + '"><option value="">+ Add to event…</option>' + opts + '</select></div>' : '<div></div>') + '</div>';
      }).join('') + '</div>';
  }

  function mayhemView() {
    var done = data.mayhem.filter(function (m) { return m.done; }).length;
    return '<div class="ms-card"><div class="ms-h">Mayhem Week checklist: ' + done + ' of ' + data.mayhem.length + '</div>' +
      data.mayhem.map(function (m) { return '<label class="hq-check"><input type="checkbox" data-row="' + m.row + '"' + (m.done ? ' checked' : '') + '><span>' + esc(m.item) + '</span></label>'; }).join('') + '</div>';
  }

  function hypeText() {
    var d = data, st = d.standing, sq = title(d.squad);
    var next = d.events.filter(function (e) { return e.open; }).slice(0, 2);
    var ch = (d.challenges || [])[0];
    return 'Good morning, ' + sq + ' Squad! This is General ' + d.me.name + '.\n\n' +
      (st ? (st.place === 1 ? 'We are in FIRST place with ' + st.total.toLocaleString() + ' points, ' + st.leadBy + ' ahead. Let\'s keep it that way!' :
        'We are in ' + ['1st', '2nd', '3rd', '4th'][st.place - 1] + ' place, just ' + st.behindBy + ' points behind ' + title(st.ahead) + '. We can catch them!') + '\n\n' : '') +
      (d.recent.length ? 'Shout-out for our latest points: ' + d.recent[0].name + ' (+' + d.recent[0].pts + ').\n\n' : '') +
      (next.length ? 'Sign up now: ' + next.map(function (e) { return e.event + (e.date ? ' on ' + e.date : ''); }).join(' and ') + '. See your General!\n\n' : '') +
      (ch ? 'This week\'s challenge: ' + ch.title + '. We\'re at ' + (ch.progress[d.squad] || 0) + ' of ' + ch.goal + '.\n\n' : '') +
      (duelLine(d) ? duelLine(d) + '\n\n' : '') +
      (d.lore && d.lore.next ? 'Our story: ' + d.lore.next.hint.replace(/^Unlocks/, 'the next chapter unlocks') + '!\n\n' : '') +
      (d.theme ? 'Remember our theme, ' + d.theme.theme + ': ' + d.theme.meaning + '\n\n' : '') +
      (d.poll && !/^No daily poll/.test(d.poll) ? d.poll + '\n\n' : '') +
      'Every Trait Dough bill counts. Let\'s go, ' + sq + '!';
  }
  // One read-aloud line about this week's Squad Duel ('' if none is running).
  function duelLine(d) {
    var du = (d.duels || []).filter(function (x) { return x.active; })[0];
    if (!du) return '';
    var others = du.squads.filter(function (s) { return s !== d.squad; }).map(title).join(' and ');
    var lead = du.leaders.indexOf(d.squad) > -1;
    return 'Squad Duel: ' + du.title + ' against ' + others + '. We have ' + (du.scores[d.squad] || 0) + ' ' + du.measure.toLowerCase() +
      (lead ? ' and we are in the lead!' : ', so let\'s close the gap!') + ' The winner gets ' + du.bonus + ' bonus points.';
  }
  function hypeView() {
    return '<div class="ms-card"><div class="ms-h">Morning announcement (edit it as you like)</div><div class="hq-script" contenteditable="true" id="hqHype">' + esc(hypeText()) + '</div>' +
      '<p><button class="btn btn-purple" id="hqCopy">Copy</button></p></div>';
  }

  // The handbook's monthly squad meeting, as full-screen slides.
  function slides() {
    var d = data, sq = title(d.squad), st = d.standing;
    var lore = d.theme && d.theme.lore;
    var ch = d.lore && d.lore.chapters.length ? d.lore.chapters[d.lore.chapters.length - 1] : null;
    var chapterSlide = ch ? [['📜 Chapter ' + ch.chapter + ': ' + esc(ch.title), (ch.image ? '<img src="' + esc(ch.image) + '" alt="" style="max-height:34vh;max-width:100%;border-radius:12px"><br>' : '') +
      '<span style="white-space:pre-line">' + esc(ch.story) + '</span>' + (d.lore.next ? '<br><br><i>' + esc(d.lore.next.hint) + '</i>' : '')]] : [];
    return [
      ['Welcome, ' + sq + ' Squad!', d.theme ? 'Our theme: <b>' + esc(d.theme.theme) + '</b><br>' + esc(d.theme.meaning) : 'Led by your Generals'],
    ].concat(lore ? [[esc(lore.title || 'Our story'), (lore.image ? '<img src="' + esc(lore.image) + '" alt="" style="max-height:38vh;max-width:100%;border-radius:12px"><br>' : '') +
      '<span style="white-space:pre-line">' + esc(lore.text) + '</span>']] : []).concat(chapterSlide).concat([
      ['Clash of Classes update', st ? (['1st', '2nd', '3rd', '4th'][st.place - 1] + ' place · ' + st.total.toLocaleString() + ' points<br>') +
        SQ.map(function (s) { return '<span style="color:' + COLOR[s] + '">' + title(s) + ' ' + (d.totals[s] || 0).toLocaleString() + '</span>'; }).join(' &nbsp; ') : ''],
    ].concat(meetingSlides(d, sq)).concat([
      ['Recent wins', d.recent.length ? d.recent.map(function (e) { return esc(e.name) + ' <b>+' + e.pts + '</b>'; }).join('<br>') : 'Let\'s make some this month!'],
      ['Coming up', d.events.filter(function (e) { return e.open; }).map(function (e) { return esc(e.event) + (e.date ? ' · ' + esc(e.date) : ''); }).join('<br>') || 'Watch the announcements!'],
      ['This month' + (d.month ? ': ' + esc(d.month) : ''), (d.trait ? 'Trait: <b>' + esc(d.trait) + '</b><br>' : '') + (d.theme ? 'How is ' + sq + ' living <b>' + esc(d.theme.theme) + '</b> right now?' : '')],
      ['Delegate voice', 'What are you hearing from the squad?'],
      ['Service update', d.theme && d.theme.project ? esc(d.theme.project) + (d.theme.goal ? '<br>' + d.theme.progress + ' of ' + d.theme.goal : '') : 'Our service project is coming soon.'],
      ['Exit ticket', 'One thing <b>you</b> will do for ' + sq + ' Squad before the next meeting. Tell a General on your way out.'],
      ['Let\'s go, ' + sq + '!', 'Every member placed. Every bill counts. 🔥'],
    ]));
  }
  // Slides built from the squad's own numbers (22_Week.gs meetingData_).
  function meetingSlides(d, sq) {
    var m = d.meeting, out = [];
    if (!m) return out;
    var fz = d.standing && d.standing.frozen;
    // January: a clean start, then freeze and thaw in two minutes.
    if (m.fresh) {
      var fd = m.fresh.date ? Number(m.fresh.date.slice(5, 7)) + '/' + Number(m.fresh.date.slice(8, 10)) : 'January';
      out.push(['🌅 Fresh start', 'New year, clean ice. ' + (fz ? 'On <b>' + fd + '</b> every squad starts unfrozen, ours included.' : 'Every squad, <b>' + sq + '</b> included, starts ' + fd + ' unfrozen.') +
        '<br><br>Every point we have is still ours. Let\'s keep it that way.']);
      out.push(['❄️ Freeze & thaw in 60 seconds', '<b>We never lose points.</b> A freeze just stops new points for a while.<br><br>' +
        '<b>Peaks Freeze</b>: the whole squad slipped on Mountaineer Peaks. We thaw it <i>together</i>: hit the goals on My Squad, then our advisor signs off.<br>' +
        '<b>Fun Freeze</b>: a game. Hit the goal once, twice or three times to win back more. Generals cash out before Thaw By or it melts.<br>' +
        '<b>New</b>: poll and Pulse votes count toward thawing.<br><br><span style="opacity:.85">How do we stay unfrozen? <b>Turn and talk: one thing our squad will do this month.</b></span>']);
    }
    if (fz && window.thawHtml) out.push(['❄️ Our freeze', '<div style="text-align:left;max-width:900px;margin:0 auto">' + window.thawHtml(fz) + '</div>']);
    if (m.mp) {
      var mp = m.mp, beat = mp.prevPoints != null && mp.points > mp.prevPoints;
      out.push(['Our ' + esc(mp.name), '<b>' + mp.points.toLocaleString() + '</b> points so far this marking period' +
        (mp.prevPoints != null ? '<br>' + esc(mp.prevName) + ': ' + mp.prevPoints.toLocaleString() + (beat ? '<br>🔥 We\'re beating our last marking period!' : '<br>' + (mp.prevPoints - mp.points).toLocaleString() + ' to go to beat it') : '') +
        (mp.bonus && mp.prevPoints != null ? '<br><span style="opacity:.8">Beat it and every one of us helps earn +' + mp.bonus + '.</span>' : '')]);
    }
    if (m.metrics) {
      var r = m.metrics.rank, n = function (v) { return v == null ? '–' : (Math.round(v * 10) / 10) + '%'; }, pl = function (k) { return ['1st', '2nd', '3rd', '4th'][r[k] - 1] || ''; };
      out.push(['School counts too', 'Attendance <b>' + n(m.metrics.attendance) + '</b> (' + pl('attendance') + ')<br>No office referral <b>' + n(m.metrics.referral) + '</b> (' + pl('referral') + ')<br>No F <b>' + n(m.metrics.grades) + '</b> (' + pl('grades') + ')<br><span style="opacity:.8">The top squad in each earns 250 every month.</span>']);
    }
    out.push(['Our territory', m.zones.length ? 'We hold <b>' + m.zones.length + '</b>: ' + m.zones.map(esc).join(', ') + (m.wings.length ? '<br>Whole wing: ' + m.wings.map(esc).join(', ') : '') : 'No zones yet. Pick one and go take it!']);
    if (m.doubles && m.doubles.length) {
      out.push(['Zones that pay 2x', 'These zones are won by what students <b>do</b>, so they pay double every week:<br>' + m.doubles.map(function (z) {
        return '<b>' + esc(z.zone) + '</b> · ' + esc(z.rule || '') + ' · ' + (z.holder === d.squad ? '<span style="color:#4ade80">ours</span>' : z.holder ? esc(title(z.holder)) : 'open');
      }).join('<br>') + '<br><span style="opacity:.8">Each is judged on last month. Start now, and it\'s ours next month.</span>']);
    }
    if (m.pulse) out.push(['📊 This week\'s Pulse', '<b>' + esc(m.pulse) + '</b><br><br>Answer on clashofclasses.org with your 800#. Every answer = a point for ' + sq + ', and it helps thaw a freeze.']);
    out.push(['Our climbers', '<b>' + m.evolved + '</b> of ' + m.students + ' creatures have evolved' + (m.summit ? ', ' + m.summit + ' at Summit' : '') + '.<br>Open My Climb and earn LRG points to evolve yours.']);
    if (m.firsts.length) out.push(['Where we lead', m.firsts.map(esc).join('<br>')]);
    return out;
  }
  function meetingView() {
    return '<div class="ms-card"><div class="ms-h">Monthly squad meeting</div><p class="ms-small">Opening · Clash update · (January: Fresh start · Freeze &amp; thaw) · Our freeze, if any · Our marking period · School counts · Territory · 2x zones · Pulse · Climbers · Wins · Coming up · Trait · Delegate voice · Service · Exit ticket</p>' +
      '<button class="btn btn-purple" id="hqMeet">▶ Start full screen</button></div>';
  }
  function showSlide() {
    var s = slides(), m = document.getElementById('hqMeetView');
    meet = Math.max(0, Math.min(meet, s.length - 1));
    m.innerHTML = '<h2>' + s[meet][0] + '</h2><div class="hq-mbody">' + s[meet][1] + '</div>' +
      '<div class="hq-mnav"><button class="hq-mbtn" id="hqPrev">◀</button><span>' + (meet + 1) + ' / ' + s.length + '</span><button class="hq-mbtn" id="hqNext">▶</button><button class="hq-mbtn" id="hqClose">✕ Close</button></div>';
    document.getElementById('hqPrev').onclick = function () { meet--; showSlide(); };
    document.getElementById('hqNext').onclick = function () { meet++; showSlide(); };
    document.getElementById('hqClose').onclick = function () { m.classList.remove('on'); };
  }

  function serviceView() {
    var t = data.theme || {};
    return '<div class="ms-card"><div class="ms-h">Service project</div><p>' + (t.project ? esc(t.project) : 'Your staff advisor adds your project on the Squad Themes tab.') + '</p>' +
      (t.goal ? '<div class="ch-bar"><div class="ch-fill" style="width:' + Math.min(100, Math.round(100 * t.progress / t.goal)) + '%;background:' + COLOR[data.squad] + '"></div></div><p>' + t.progress + ' of ' + t.goal + '</p>' +
        '<div class="ms-form"><input id="hqProg" type="number" min="0" value="' + t.progress + '"><button class="btn btn-purple" id="hqSaveProg">Update progress</button></div>' : '') + '</div>';
  }

  // Nominations (Trailback Panel each marking period, next year's Generals) and the two
  // end-of-year letters, from the Generals Handbook. Staff make the final choices.
  function nominateView() {
    var d = data;
    return '<div class="ms-card"><div class="ms-h">Nominate a squad member</div>' +
      '<p class="ms-small">Trailback Panel: students who show empathy and fairness, can hold hard conversations calmly, own their actions, and keep things confidential. Staff make the final selection.</p>' +
      '<div class="ms-form" style="flex-direction:column;align-items:stretch">' +
      '<select class="hq-select" id="nomFor" style="max-width:none">' + d.nominateFor.map(function (f) { return '<option>' + esc(f) + '</option>'; }).join('') + '</select>' +
      '<select class="hq-select" id="nomWho" style="max-width:none"><option value="">Pick a squad member…</option>' + d.roster.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select>' +
      '<textarea id="nomWhy" rows="3" placeholder="Why? (a sentence or two)" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px"></textarea>' +
      '<button class="btn btn-purple" id="nomGo">Send nomination</button></div>' +
      ((d.captainTally || []).length ? '<div class="ms-h" style="margin-top:14px">Captain votes from your squad\'s Generals</div>' +
        '<p class="ms-small">One vote per General per student. Staff confirm captains on the MLC Roster.</p>' +
        d.captainTally.map(function (t) { return '<div class="hq-row"><div><b>' + esc(t.nominee) + '</b> · ' + esc(t.for) + '</div><div><b>' + t.votes + '</b> vote' + (t.votes === 1 ? '' : 's') + '</div></div>'; }).join('') : '') +
      (d.nominations.length ? '<div class="ms-h" style="margin-top:14px">Your nominations</div>' + d.nominations.map(function (n) { return '<div class="hq-row"><div><b>' + esc(n.nominee) + '</b> · ' + esc(n.for) + '<br><span class="ms-small">' + esc(n.date) + ' · ' + esc(n.why) + '</span></div><div></div></div>'; }).join('') : '') + '</div>' +
      d.letters.map(function (l, i) {
        return '<div class="ms-card"><div class="ms-h">End-of-year letter: ' + esc(l.letter) + '</div>' +
          '<p class="ms-small">' + (i === 0 ? 'Honest advice for next year\'s Generals: what worked, what was hard, who helped you most.' : 'Your honest reflection: what should change, which events worked, who showed real leadership.') + '</p>' +
          '<textarea id="letter' + i + '" rows="7" style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px">' + esc(l.text) + '</textarea>' +
          '<p><button class="btn btn-purple" data-letter="' + i + '">Save letter</button> <span class="ms-small">' + (l.updated ? 'Saved ' + esc(l.updated) : 'Not saved yet') + '</span></p></div>';
      }).join('');
  }

  // Mayhem shirt designs (12_ShirtDesigns.gs): upload, see approval status and live votes.
  var designImg = {};
  function shirtsView() {
    var d = data, list = d.designs || [];
    return '<div class="ms-card"><div class="ms-h">Upload a Mayhem shirt design for ' + title(d.squad) + '</div>' +
      '<p class="ms-small">PNG or JPG. Staff approve each design before your squad can vote on it.' + (d.shirtVoting ? ' Voting is open now.' : ' Voting opens when staff turn it on.') + '</p>' +
      '<div class="ms-form" style="flex-direction:column;align-items:stretch">' +
      '<input id="dsTitle" placeholder="Design name (e.g. Summit Lightning)" maxlength="80">' +
      '<input id="dsFile" type="file" accept="image/png,image/jpeg">' +
      '<button class="btn btn-purple" id="dsGo">Upload design</button><div class="ms-err" id="dsErr"></div></div></div>' +
      (list.length ? '<div class="ms-card"><div class="ms-h">Your squad\'s designs</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px">' +
        list.map(function (x) {
          return '<div style="border:1px solid var(--border);border-radius:12px;padding:10px"><img data-design="' + esc(x.id) + '" alt="' + esc(x.title) + '" src="' + (designImg[x.id] || '') + '" style="width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface2);border-radius:8px">' +
            '<div style="font-weight:700;margin-top:6px">' + (x.winner ? '🏆 ' : '') + esc(x.title) + '</div>' +
            '<div class="ms-small">' + (x.approved ? x.votes + ' vote' + (x.votes === 1 ? '' : 's') : 'Waiting for staff approval') + ' · by ' + esc(x.by) + '</div></div>';
        }).join('') + '</div></div>' : '');
  }
  // Shrinks a picture on the device (longest side 1200px, JPEG) so uploads stay small.
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onerror = function () { reject(new Error('Could not read that file.')); };
      r.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('That file isn\'t a picture.')); };
        img.onload = function () {
          var s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function wire() {
    // Check-ins tab (26_CheckIns.gs).
    el().querySelectorAll('[data-ci-ok]').forEach(function (b) { b.onclick = function () { b.disabled = true; act('clashGeneralsConfirmCheckin', Number(b.dataset.ciOk), true); }; });
    el().querySelectorAll('[data-ci-rm]').forEach(function (b) { b.onclick = function () { if (confirm('Remove this check-in? Only remove it if they did not take part.')) act('clashGeneralsConfirmCheckin', Number(b.dataset.ciRm), false); }; });
    var ciAdd = document.getElementById('ciAdd');
    if (ciAdd) ciAdd.onclick = function () { var who = document.getElementById('ciWho').value; if (!who) { alert('Pick a squad member.'); return; } act('clashGeneralsAddCheckin', document.getElementById('ciEvent').value, who); };
    // Game tab (15_Game.gs).
    var gd = document.getElementById('gDraw');
    if (gd) gd.onclick = function () {
      gd.disabled = true;
      window.gasRun_('clashGeneralsDrawCard', token).then(function (d) {
        data = d; render();
        if (d.drew) { alert('You drew ' + d.drew.card + (d.drew.status === 'Counted' ? ': +' + d.drew.value + ' for your squad!' : '. It\'s in your hand.')); if (window.craftCelebrate) window.craftCelebrate(document.querySelector('.hq-deck')); }
      }).catch(function (x) { gd.disabled = false; alert(x.message.replace(/^Exception:\s*/, '')); });
    };
    el().querySelectorAll('[data-play]').forEach(function (b) {
      b.onclick = function () {
        var row = b.getAttribute('data-play'), sel = el().querySelector('[data-target="' + row + '"]');
        if (sel && !sel.value) { alert('Pick a rival squad first.'); return; }
        window.gasRun_('clashGeneralsPlayCard', token, Number(row), sel ? sel.value : '').then(function (d) {
          data = d; render();
          if (d.flipped) {
            var box = document.getElementById('gFlip');
            if (box) box.innerHTML = '<div class="ms-h" style="margin-top:12px">They flipped:</div>' + d.flipped.map(function (c) { return '<span class="hq-pill ' + (c.status === 'Busted' ? 'need' : 'role') + '">' + esc(c.card) + (c.status === 'Busted' ? ' 💥 bust' : '') + '</span>'; }).join(' ');
          }
        }).catch(function (x) { alert(x.message.replace(/^Exception:\s*/, '')); });
      };
    });
    var bank = document.getElementById('gBank');
    if (bank) bank.onclick = function () {
      if (!confirm('Bank the streak now? It starts over after this.')) return;
      var from = bank.getBoundingClientRect();
      act('clashGeneralsBankStreak').then(function () { if (window.craftCelebrate) window.craftCelebrate({ getBoundingClientRect: function () { return from; } }); });
    };
    // Fun Freeze buttons in the thaw panel (14_Thaw.gs).
    var cash = document.getElementById('thawCashOut'), second = document.getElementById('thawSecond');
    if (cash) cash.onclick = function () {
      if (!confirm('Cash out now? Your squad gets these points back and the freeze ends. You can\'t push for a bigger share after this.')) return;
      var from = cash.getBoundingClientRect();
      act('clashGeneralsCashOut').then(function () { if (window.craftCelebrate) window.craftCelebrate({ getBoundingClientRect: function () { return from; } }); });
    };
    if (second) second.onclick = function () { if (confirm('Use your squad\'s one second chance? Thaw By moves a couple of school days later.')) act('clashGeneralsSecondChance'); };
    var ds = document.getElementById('dsGo');
    if (ds) ds.onclick = function () {
      var f = document.getElementById('dsFile').files[0], err = document.getElementById('dsErr');
      if (!f) { err.textContent = 'Pick a picture first.'; return; }
      err.textContent = 'Uploading…';
      shrinkImage(f).then(function (url) { return act('clashGeneralsUploadDesign', document.getElementById('dsTitle').value, url); })
        .catch(function (x) { err.textContent = (x && x.message || '').replace(/^Exception:\s*/, ''); });
    };
    el().querySelectorAll('img[data-design]').forEach(function (im) {
      var id = im.getAttribute('data-design');
      if (designImg[id]) return;
      window.gasRun_('clashShirtImage', id, token).then(function (u) { designImg[id] = u; im.src = u; }).catch(function () {});
    });
    var ng = document.getElementById('nomGo');
    if (ng) ng.onclick = function () { act('clashGeneralsNominate', document.getElementById('nomFor').value, document.getElementById('nomWho').value, document.getElementById('nomWhy').value); };
    el().querySelectorAll('button[data-letter]').forEach(function (b) {
      b.onclick = function () { act('clashGeneralsLetter', data.letters[b.dataset.letter].letter, document.getElementById('letter' + b.dataset.letter).value); };
    });
    el().querySelectorAll('select[data-add]').forEach(function (s) { s.onchange = function () { if (s.value) act('clashGeneralsSignUp', s.value, s.dataset.add, false); }; });
    el().querySelectorAll('[data-rm]').forEach(function (p) { p.onclick = function () { if (confirm('Remove from ' + p.dataset.rm + '?')) act('clashGeneralsSignUp', p.dataset.rm, p.dataset.id, true); }; });
    el().querySelectorAll('input[data-row]').forEach(function (c) { c.onchange = function () { act('clashGeneralsChecklist', c.dataset.row, c.checked); }; });
    var copy = document.getElementById('hqCopy');
    if (copy) copy.onclick = function () { try { navigator.clipboard.writeText(document.getElementById('hqHype').innerText); copy.textContent = 'Copied ✓'; } catch (e) {} };
    var m = document.getElementById('hqMeet');
    if (m) m.onclick = function () {
      var v = document.getElementById('hqMeetView');
      if (v.parentNode !== document.body) document.body.appendChild(v); // full screen above everything
      meet = 0; v.classList.add('on'); showSlide();
    };
    var sp = document.getElementById('hqSaveProg');
    if (sp) sp.onclick = function () { act('clashGeneralsService', document.getElementById('hqProg').value); };
  }

  function start() { if (el()) signIn(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
