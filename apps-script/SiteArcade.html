<!-- The Arcade on the main site (48_Arcade.gs clashSiteArcade*, Arcade.html games). Students type
     their 800# like the Pulse; the same plays, tokens and squad points as My Climb. -->
<style>
.sa-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
.sa-card h2 { margin: 0 0 4px; font-family: 'Fraunces', serif; font-size: 22px; }
.sa-sub { color: var(--text2); font-size: 14px; line-height: 1.55; margin: 4px 0; }
.sa-pill { display: inline-block; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: rgba(255,225,0,.16); color: var(--gold-soft, #ffe100); font-weight: 700; margin: 0 6px 6px 0; }
.sa-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sa-form input { flex: 1 1 180px; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; }
.sa-err { color: #fca5a5; font-size: 14px; min-height: 1.2em; margin-top: 6px; }
.home-arcade { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
</style>
<script>
(function () {
  var KEY = 'clash-my-800', A = null, busy = false;
  function stored() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function store(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function esc(t) { return String(t == null ? '' : t).replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); }
  function title(s) { s = String(s || ''); return s.charAt(0) + s.slice(1).toLowerCase(); }
  function msg(e) { return String((e && e.message) || e || '').replace(/^Exception:\s*/, ''); }
  function box() { return document.getElementById('siteArcadeBody'); }

  function signIn(err) {
    var b = box(); if (!b) return;
    b.innerHTML = '<div class="sa-card"><h2>🕹️ Play for your squad</h2><p class="sa-sub">Type your 800 number to play. You get a free play every school day, and more with tokens from Trait Dough, service and Pulse votes. Every game can add squad points, counted once a day.</p>' +
      '<form class="sa-form" id="saForm"><label for="sa800" class="sr-only" style="position:absolute;left:-9999px">Your 800 number</label><input id="sa800" inputmode="numeric" autocomplete="off" placeholder="Your 800 number" value="' + esc(stored()) + '"><button class="btn btn-gold" type="submit">Open the Arcade</button></form>' +
      '<div class="sa-err" role="alert">' + esc(err || '') + '</div></div>';
    document.getElementById('saForm').onsubmit = function (e) { e.preventDefault(); load(document.getElementById('sa800').value); };
  }

  function draw() {
    var b = box(); if (!b || !A) return;
    var w = A.wallet, r = A.rules, res = A.result, shut = A.hours && A.hours.closed, can = !shut && w.playsToday < w.daily && (w.freeLeft > 0 || w.tokens > 0), sq = title(A.squad);
    var names = {}; A.games.forEach(function (g) { names[g.key] = g.name; });
    var out = '<div class="sa-card"><h2>🕹️ Arcade · ' + esc(sq) + ' Squad</h2>' +
      '<p class="sa-sub">' + (A.pebbles && A.pebbles.on ? 'Every game fills your Pebble pouch. Cash in ' + A.pebbles.per + ' Pebbles for 1 squad point.' : 'Each game can add up to ' + A.maxPoints + ' squad point' + (A.maxPoints === 1 ? '' : 's') + ', added tonight.') + ' <a href="#" id="saSwitch" style="color:var(--gold-soft,#ffe100)">Not you?</a></p>' +
      (window.Arcade && Arcade.pouch ? Arcade.pouch(A.pebbles, esc(sq), 'sa-sub') + (Arcade.about ? Arcade.about(A.pebbles, A.hours, esc(sq)) : '') : '') +
      '<div><span class="sa-pill">🪙 ' + w.tokens + ' token' + (w.tokens === 1 ? '' : 's') + '</span><span class="sa-pill">' + (w.freeLeft ? w.freeLeft + ' free play today' : 'Free play used') + '</span><span class="sa-pill">' + w.playsToday + ' of ' + w.daily + ' plays today</span></div>' +
      '<p class="sa-sub">Earn tokens: ' + r.dough + ' per Trait Dough bill, ' + r.service + ' per approved service' + (r.votes ? ', 1 for every ' + r.votes + ' Pulse votes' : '') + '.</p>' +
      (window.Arcade && Arcade.result ? Arcade.result(A.pebbles, res, names, esc(sq)) : '') +
      '<div id="saStage"></div><p class="sa-sub" id="saMsg"></p><div class="arc-games">' +
      A.games.map(function (g) {
        return '<div class="arc-g"><h3>' + esc(g.name) + '</h3><span class="sa-sub">' + esc(g.blurb) + '</span><span class="sa-sub">' + (window.Arcade && Arcade.rate ? Arcade.rate(A.pebbles, g) : g.per + ' = 1 squad point') + (g.best ? ' · Your best: ' + g.best.toLocaleString() : '') + '</span>' +
          '<button class="btn btn-gold" data-sa-game="' + esc(g.key) + '"' + (can ? '' : ' disabled') + '>' + (can ? 'Play' : shut ? 'Opens at ' + esc(A.hours.until) : 'No plays left') + '</button></div>';
      }).join('') + '</div></div>';
    out += '<div class="sa-card"><h2>This week\'s best</h2><div class="arc-board">' + A.games.map(function (g) {
      var rows = (A.board[g.key] || []).map(function (x) { return '<li>' + (x.who ? esc(x.who) + ' · ' : '') + esc(title(x.squad)) + ' · ' + x.score.toLocaleString() + '</li>'; }).join('');
      return '<div><b>' + esc(g.name) + '</b>' + (rows ? '<ol>' + rows + '</ol>' : '<p class="sa-sub">No scores yet this week.</p>') + '</div>';
    }).join('') + '</div></div>';
    b.innerHTML = out;
    document.getElementById('saSwitch').onclick = function (e) { e.preventDefault(); if (window.Arcade) Arcade.stop(); store(''); A = null; signIn(''); };
    b.querySelectorAll('[data-sa-game]').forEach(function (btn) { btn.onclick = function () { start(btn.getAttribute('data-sa-game')); }; });
    b.querySelectorAll('[data-cash]').forEach(function (btn) {
      btn.onclick = function () {
        if (busy) return; busy = true; btn.disabled = true; btn.textContent = 'Cashing in…';
        window.gasRun_('clashSiteArcadeCashIn', stored()).then(function (a) { A = a; busy = false; draw(); })
          .catch(function (e) { busy = false; btn.disabled = false; btn.textContent = 'Cash in'; document.getElementById('saMsg').textContent = msg(e); });
      };
    });
  }

  function start(game) {
    if (busy || !window.gasRun_) return;
    busy = true;
    var id = stored();
    box().querySelectorAll('[data-sa-game]').forEach(function (x) { x.disabled = true; });
    document.getElementById('saMsg').textContent = 'Starting…';
    window.gasRun_('clashSiteArcadeStart', game, id).then(function (s) {
      document.getElementById('saMsg').textContent = '';
      var stage = document.getElementById('saStage');
      stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (A.look && window.Arcade) Arcade.look(A.look);
      Arcade.play(game, stage, A.squad, function (score) {
        window.gasRun_('clashSiteArcadeFinish', s.play, score, id).then(function (a) { A = a; busy = false; draw(); })
          .catch(function (e) { busy = false; alert(msg(e)); load(id); });
      });
    }).catch(function (e) { busy = false; document.getElementById('saMsg').textContent = msg(e); box().querySelectorAll('[data-sa-game]').forEach(function (x) { x.disabled = false; }); });
  }

  function load(id) {
    var b = box(); if (!b || !window.gasRun_) return;
    id = String(id || '').replace(/\D/g, '');
    if (!id) { signIn(''); return; }
    b.innerHTML = '<div class="sa-card"><p class="sa-sub">Opening the Arcade…</p></div>';
    window.gasRun_('clashSiteArcade', id).then(function (a) { store(id); A = a; draw(); }).catch(function (e) { signIn(msg(e)); });
  }

  // goTo('arcade') calls this (App.html).
  window.renderSiteArcade = function () { if (A) draw(); else load(stored()); };
  window.stopSiteArcade = function () { if (window.Arcade) Arcade.stop(); busy = false; };
})();
</script>
