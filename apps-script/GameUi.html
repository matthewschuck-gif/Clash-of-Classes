<style>
/* ── GameUi: characters, the territory board, the monster (shared by the site, TV and My Climb) ──
   Original characters in the spirit of the 2026-27 shield: each squad's Pennsylvania mountain
   animal on the logo's snowy peak with its boot-print trail. Round, soft, big-eyed (an ode to
   Pixar's craft, not its characters). They blink and breathe; both stop for reduced motion. */
.gc-svg { display: block; width: 100%; height: auto; overflow: visible; }
.gc-breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: gcBreathe 3.6s ease-in-out infinite; }
.gc-blink { transform-box: fill-box; transform-origin: 50% 50%; animation: gcBlink 5.2s infinite; }
.gc-wiggle { transform-box: fill-box; transform-origin: 50% 90%; animation: gcWiggle 2.8s ease-in-out infinite; }
@keyframes gcBreathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .985); } }
@keyframes gcBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
@keyframes gcWiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.gc-hop:hover .gc-breathe, .gc-hop:focus-visible .gc-breathe { animation: gcHop .7s var(--craft-spring, ease-out); }
@keyframes gcHop { 0% { transform: none; } 25% { transform: scale(1.08, .88); } 55% { transform: translateY(-14px) scale(.95, 1.07); } 80% { transform: scale(1.04, .95); } 100% { transform: none; } }

/* Territory board */
.gb { position: relative; border-radius: 18px; overflow: hidden; background: #12081f; }
.gb svg { display: block; width: 100%; height: auto; }
.gb .zone { transition: filter .25s; cursor: default; }
.gb .zone:hover { filter: brightness(1.15); }
.gb-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 13px; }
.gb-legend span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--text2, #d6c2ff); }
.gb-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* Monster */
.gm { position: relative; overflow: hidden; display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: center; padding: 18px; border-radius: 18px;
  background: radial-gradient(90% 120% at 0% 0%, rgba(239, 68, 68, .22), transparent 60%), #1a0b2e; border: 1px solid rgba(248, 113, 113, .35); }
.gm h3 { margin: 0; font-family: 'Fraunces', serif; font-weight: 900; font-size: 22px; color: #fff; }
.gm p { margin: 6px 0 10px; color: #f5d0d0; font-size: 14px; line-height: 1.5; }
.gm-hp { height: 14px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.gm-hp i { display: block; height: 100%; background: linear-gradient(90deg, #f87171, #fbbf24); border-radius: 99px; transition: width 1.2s var(--craft-spring, ease-out); }
.gm-goal { font-family: 'DM Mono', monospace; font-size: 12px; color: #fecaca; margin-top: 6px; }
.gm.dead { border-color: rgba(134, 239, 172, .5); background: radial-gradient(90% 120% at 0% 0%, rgba(134, 239, 172, .2), transparent 60%), #10261a; }
.gm img { width: 110px; height: 110px; object-fit: cover; border-radius: 14px; }
@media (max-width: 520px) { .gm { grid-template-columns: 1fr; } .gm > :first-child { max-width: 120px; } }
@media (prefers-reduced-motion: reduce) { .gc-breathe, .gc-blink, .gc-wiggle, .gc-hop:hover .gc-breathe { animation: none !important; } }
</style>

  var LOOK = { fur: 3, eyes: 4, mood: 4, hat: 5, accent: 6 };

  // character(squad, look, earned gear, mascot info): the squad's animal, as this student made it.
  // With no look it's the squad's own mascot (its signature hat and color).
  function character(squad, look, gearList, m) {
    var s = String(squad || '').toUpperCase().replace('GRAY', 'GREY'), sp = SPECIES[s];
    m = m || {};

    if (!sp) return '';
    var k = look ? { fur: look.fur || 0, eyes: look.eyes || 0, mood: look.mood || 0, hat: look.hat || 0, accent: look.accent || 0 } : { fur: 0, eyes: 0, mood: 0, hat: sp.hat, accent: 0 };
    var has = {}; (gearList || []).forEach(function (g) { if (g.have) has[g.gear] = true; });
    if (!look) has.scarf = true; // the squad mascot always wears its colors

  // ── The territory board ───────────────────────────────────────────
  // Zones sit on a 12 x 8 grid; each is drawn with uneven, hand-cut borders (seeded by its name,
  // so it looks the same every time). General territories only: never the real building.
  function seeded(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
  function blob(z, cell) {
    var rnd = seeded(z.zone), x = z.x * cell + 6, y = z.y * cell + 6, w = z.w * cell - 12, h = z.h * cell - 12, pts = [], n = 5;
    function j() { return (rnd() - .5) * cell * .28; }
    for (var i = 0; i <= n; i++) pts.push([x + w * i / n + (i && i < n ? j() : 0), y + (i && i < n ? j() : 0)]);
    for (i = 1; i <= n; i++) pts.push([x + w + j(), y + h * i / n + (i < n ? j() : 0)]);
    for (i = n - 1; i >= 0; i--) pts.push([x + w * i / n + (i ? j() : 0), y + h + j()]);
    for (i = n - 1; i > 0; i--) pts.push([x + j(), y + h * i / n + j()]);
    return 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + ' Z';
  }
  function board(map, opts) {
    if (!map || !map.zones || !map.zones.length) return '';

    var wingColor = {};

      var fill = z.holder ? SQ_LIGHT[z.holder] : '#3a2a52', ink = z.holder === 'GOLD' || z.holder === 'GREY' || z.holder === 'BLACK' ? '#12081f' : '#fff';
      var cx = (z.x + z.w / 2) * cell, cy = (z.y + z.h / 2) * cell;
      var crown = z.summit ? '<path d="M' + (cx - 18) + ' ' + (cy - 30) + ' l6 -16 l12 10 l12 -10 l6 16 Z" fill="#ffe100" stroke="#12081f" stroke-width="2"/>' : '';

      return '<g class="zone"><path d="' + blob(z, cell) + '" fill="' + fill + '" fill-opacity="' + (z.holder ? .92 : .6) + '" stroke="' + (wingHeld ? '#ffe100' : '#12081f') + '" stroke-width="' + (wingHeld ? 6 : 4) + '" stroke-linejoin="round"><title>' + esc(z.zone + (z.holder ? ', held by ' + z.holder : ', unclaimed') + ' · ' + z.wing) + '</title></path>' +

    }).join('');

    var legend = '<div class="gb-legend">' + held.map(function (w) { return '<span><i style="background:' + SQ_LIGHT[map.wings[w]] + '"></i>' + esc(w) + ': all held by ' + esc(map.wings[w]) + '</span>'; }).join('') +

  }

  // ── Monster of the Month ──────────────────────────────────────────
  // Shady: the small blue hairy gremlin of schadenfreude. His fur tufts shrink with his health;
  // defeated, he's tiny, sheepish and blushing.
  function shady(defeated, health) {
    var h = defeated ? 0 : Math.max(0, Math.min(1, health == null ? 1 : health)), grow = .72 + .28 * h;

      '</g></svg>';
  }
  function monster(m) {
    if (!m) return '';

  }
