window.goTo = function(id){
  try { var seen = JSON.parse(sessionStorage.getItem('clash-seen') || '{}'); if (!seen[id] && window.gasRun_) { seen[id] = 1; sessionStorage.setItem('clash-seen', JSON.stringify(seen)); window.gasRun_('clashTrack', id).catch(function(){}); } } catch (e) {}
  window.__currentPage = id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  var el=document.getElementById('page-'+id);
  if(el) el.classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.id==='tab-'+id);});
  document.querySelectorAll('.mob-tab').forEach(function(t){t.classList.toggle('active',t.id==='mobtab-'+id);});
  window.scrollTo(0,0);
  // If module already loaded, call the full version to trigger renders
  if(window.__moduleReady && window.__real_goTo) window.__real_goTo(id);
};
window.openLogin = function(){
  const m=document.getElementById('loginModal'); if(!m) return;

window.tryLogin = function(){

// ── Apps Script backend (this page is served by the same Apps Script project) ──
// load / meta / save go through google.script.run (window.gasRun_, defined in Index.html).
// How often each open tab checks whether the data changed (Apps Script has no live push).
const GAS_POLL_MS=(window.CLASH_CONFIG&&window.CLASH_CONFIG.pollMs)||5000;

async function gasCall_(body){
  if(body.action==='load'){
    // The first load came with the page (window.__CLASH_BOOT): use it once, no server trip.
    if(window.__CLASH_BOOT&&!window.ADMIN_SESSION){ const b=window.__CLASH_BOOT; window.__CLASH_BOOT=null; return b; }
    return window.gasRun_('clashLoad', window.ADMIN_SESSION||''); // admin: full rows (03_Web.gs publicEvent_)
  }
  if(body.action==='meta') return window.gasRun_('clashMeta');
  if(body.action==='save'){
    // Saving needs an admin sign-in. The server merges, so points added by other projects
    // since this page loaded are kept (see clashSave in 03_Web.gs).
    const res=await window.gasRun_('clashSave', window.ADMIN_SESSION||'', JSON.stringify(body.value), JSON.stringify(window.CLASH_SYNC||{}));
    window.clashRememberSync_(body.value);
    return res;
  }
  throw new Error('Unknown action: '+body.action);
}
window.gasCall_=gasCall_; // exposed because this const lives inside a <script type="module">
// (module scope isn't shared with the later classic <script> tags that also need it --
// the Freudenfreude Ticker and Growth Leaderboard widgets further down the page)

const sb={
  from:(table)=>{
    return {
      select:(cols)=>{
        return {
          eq:(col,val)=>{
            return {
              single:async()=>{
                try{
                  const res=await gasCall_({action:'load'});
                  return {data:res&&res.value!=null?{value:res.value}:null,error:null};
                }catch(e){return {data:null,error:{code:'network',message:e.message}};}
              }
            };
          }
        };
      },
      upsert:async(body)=>{
        try{
          await gasCall_({action:'save',value:body.value});
          return {error:null};
        }catch(e){return {error:{message:e.message}};}
      }
    };
  },
  channel:(name)=>{
    let _handlers=[];
    let _lastUpdatedAt=null;
    let _stopped=false;
    const _ch={
      on:(event,filter,handler)=>{_handlers.push({event,filter,handler});return _ch;},
      subscribe:()=>{
        const _poll=async()=>{
          if(_stopped) return;
          try{
            const meta=await gasCall_({action:'meta'});
            const seenBefore=_lastUpdatedAt!==null;
            if(meta&&meta.updated_at&&meta.updated_at!==_lastUpdatedAt){
              _lastUpdatedAt=meta.updated_at;
              if(seenBefore){
                const full=await gasCall_({action:'load'});
                const sdkPayload={new:full.value,old:null,eventType:'UPDATE'};
                _handlers.forEach(h=>{try{h.handler(sdkPayload);}catch(err){}});
              }
            }
          }catch(e){ /* transient network hiccup -- next poll will retry */ }
          setTimeout(_poll,GAS_POLL_MS);
        };
        _poll();
        return _ch;
      },
      unsubscribe:()=>{_stopped=true;}
    };
    return _ch;
  }
};
window.sb=sb;

document.addEventListener('keydown', function(e){
  // Ctrl+K or / = open admin
  if((e.ctrlKey && e.key==='k') || (e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA')){
    e.preventDefault();
    if(window.requireAdmin) window.requireAdmin(function(){ if(window.openAdmin) window.openAdmin(); });
  }
  // Escape = close any open modal
  if(e.key==='Escape'){
    document.querySelectorAll('.modal.open, .edit-evt-modal.open').forEach(function(m){ m.classList.remove('open'); });
  }
});

// ── CALCS ──
const evtTotal=sq=>(D.events||[]).reduce((s,e)=>s+(e.pts[sq]||0),0);

// Rank-based points for the 3 monthly metrics (attendance / no-referral / no-fail-grade):
// highest % gets 250, 2nd 125, 3rd 50, last 0. Ties share the higher rank's point value and
// the next distinct value skips the intervening rank(s) -- standard competition ranking.
const METRIC_RANK_POINTS=[250,125,50,0];
function rankPoints_(valsBySquad){
  const sorted=SQUADS.slice().sort((a,b)=>(valsBySquad[b]||0)-(valsBySquad[a]||0));
  const pts={};
  let i=0;
  while(i<sorted.length){
    let j=i;
    while(j+1<sorted.length && (valsBySquad[sorted[j+1]]||0)===(valsBySquad[sorted[i]]||0)) j++;
    const shareValue=METRIC_RANK_POINTS[i];
    for(let k=i;k<=j;k++) pts[sorted[k]]=shareValue;
    i=j+1;
  }
  return pts;
}
// Only FINALIZED months count toward a squad's total -- the current, in-progress month's
// percentages (D.metrics) are shown live as a preview but don't score until finalized (see
// finalizeMonth()). This keeps a month's points locked in permanently once awarded, the same
// way D.events entries are permanent, instead of a live snapshot that can silently change the
// grand total whenever someone edits a percentage.
const metTotal=sq=>(D.monthlyMetrics||[]).reduce((s,m)=>s+((m.pts&&m.pts[sq])||0),0);
let sheetEvents=[];
const sheetTotal=sq=>sheetEvents.reduce((s,e)=>s+(e.pts[sq]||0),0);
const grand=sq=>evtTotal(sq)+metTotal(sq)+sheetTotal(sq);
const ranked=()=>[...SQUADS].sort((a,b)=>grand(b)-grand(a));
const maxGrand=()=>Math.max(...SQUADS.map(grand),1);

var _lastLeader=null;
function checkConfetti(){
  var leader=ranked()[0];
  if(_lastLeader&&_lastLeader!==leader) fireConfetti(SQ_HEX[leader]);
  _lastLeader=leader;
}
function fireConfetti(color){
  var canvas=document.getElementById('confettiCanvas'); if(!canvas) return;
  canvas.style.display='block'; canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  var ctx=canvas.getContext('2d');
  var pieces=[];
  var colors=[color,'#ffe100','#ffffff','#9d5fcc','#e8c840'];
  for(var i=0;i<120;i++) pieces.push({x:Math.random()*canvas.width,y:-20-Math.random()*80,w:8+Math.random()*8,h:4+Math.random()*4,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vx:(Math.random()-0.5)*4,vy:2+Math.random()*4,vr:(Math.random()-0.5)*8});
  var frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(function(p){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,1-frame/80);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.08;
    });
    frame++;
    if(frame<90) requestAnimationFrame(draw);
    else{ ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

// ── EXPORT CSV ──
function exportCSV(){
  var events=D.events||[];
  var header=['Event','Type','Date','Note'].concat(SQUADS).concat(['Total']).join(',');
  var rows=events.map(function(ev){
    var total=SQUADS.reduce(function(s,sq){ return s+(ev.pts[sq]||0); },0);
    return ['"'+(ev.name||'').replace(/"/g,'""')+'"',ev.type||'',ev.date||'','"'+(ev.note||'').replace(/"/g,'""')+'"'].concat(SQUADS.map(function(sq){ return ev.pts[sq]||0; })).concat([total]).join(',');
  });
  var grandTotal=SQUADS.reduce(function(s,sq){ return s+grand(sq); },0);
  rows.push(['TOTAL','','',''].concat(SQUADS.map(function(sq){ return grand(sq); })).concat([grandTotal]).join(','));
  var csv=[header].concat(rows).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='clash-of-classes-events-'+new Date().toISOString().split('T')[0]+'.csv'; a.click();
  logActivity('Exported CSV');
}

// TICKER TAPE
// ══════════════════════════════════════════
var tickerClockInterval=null;
function openTicker(){
  document.getElementById('tickerView').classList.add('active');
  buildTicker();
  startTickerClock();
}
function closeTicker(){
  document.getElementById('tickerView').classList.remove('active');
  clearInterval(tickerClockInterval);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('tickerView').classList.contains('active')) closeTicker();
});
function buildTicker(){
  var r=ranked();
  document.getElementById('tickerScores').innerHTML=r.map(function(sq,i){
    return '<div class="ticker-sq" style="background:'+SQ_HEX[sq]+'18;border-right:1px solid rgba(255,255,255,0.06)">'
      +'<div class="ticker-sq-rank">#'+(i+1)+(i===0?' 👑':'')+' </div>'
      +'<div class="ticker-sq-pts" style="color:'+SQ_HEX[sq]+'">'+grand(sq).toLocaleString()+'</div>'
      +'<div class="ticker-sq-name" style="color:'+SQ_HEX[sq]+'">'+sq+'</div>'
      +'</div>';
  }).join('');
  var curMonth=new Date().toLocaleString('en-US',{month:'long'});
  var t=TRAITS.find(function(x){ return x.month===curMonth; })||TRAITS[TRAITS.length-1];
  var items=r.map(function(sq,i){ return '<span class="ticker-item" style="color:'+SQ_HEX[sq]+'">#'+(i+1)+' '+sq+' — '+grand(sq).toLocaleString()+' pts</span><span class="ticker-divider">·</span>'; }).join('')
    +'<span class="ticker-item" style="color:rgba(255,255,255,0.5)">This Month: '+t.trait+'</span><span class="ticker-divider">·</span>';
  document.getElementById('tickerTape').innerHTML=items+items;
}
function startTickerClock(){
  clearInterval(tickerClockInterval);
  function updateClock(){
    var now=new Date();
    var events=D.countdownEvents||[];
    var next=events.find(function(e){ return new Date(e.date+'T00:00:00')>=new Date(now.toDateString()); });
    if(next){
      var target=new Date(next.date+'T00:00:00');
      var diff=target-now;
      if(diff>0){
        var d=Math.floor(diff/864e5);
        var h=Math.floor((diff%864e5)/36e5);
        var m=Math.floor((diff%36e5)/6e4);
        var s=Math.floor((diff%6e4)/1e3);
        document.getElementById('tickerCdLabel').textContent='Until '+next.label;
        document.getElementById('tickerClock').textContent=(d>0?d+'d ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      }
    } else {
      document.getElementById('tickerCdLabel').textContent='';
      document.getElementById('tickerClock').textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
  }
  updateClock();
  tickerClockInterval=setInterval(updateClock,1000);
}

// ══════════════════════════════════════════
// SEASON CALENDAR
// ══════════════════════════════════════════
function renderSeasonCal(){
  var el=document.getElementById('seasonCal'); if(!el) return;
  var events=D.events||[];
  var now=new Date();
  var year=now.getFullYear();
  var month=now.getMonth();
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var monthStr=now.toLocaleString('en-US',{month:'long',year:'numeric'});

  var evtByDate={};
  events.forEach(function(ev){
    if(!ev.date) return;
    var d=ev.date.substring(0,7);
    var key=ev.date;
    if(!evtByDate[key]) evtByDate[key]=[];
    evtByDate[key].push(ev);
  });

  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var hdr='<div style="font-family:DM Mono,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px">'+monthStr+'</div>';
  var dayNames='<div class="cal-month-hdr">'+days.map(function(d){ return '<div class="cal-day-name">'+d+'</div>'; }).join('')+'</div>';
  var cells='';
  for(var i=0;i<firstDay;i++) cells+='<div class="cal-cell"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateKey=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=d===now.getDate();
    var dayEvts=evtByDate[dateKey]||[];
    cells+='<div class="cal-cell'+(isToday?' cal-cell-today':'')+'">'
      +'<div class="cal-cell-num">'+d+'</div>'
      +dayEvts.map(function(ev){
        var winner=ranked()[0];
        var color=SQ_HEX[winner]||'var(--purple)';
        return '<div class="cal-event-dot" style="background:'+color+'" title="'+ev.name+'">'+ev.name+'</div>';
      }).join('')
      +'</div>';
  }
  el.innerHTML='<div class="season-cal">'+hdr+dayNames+'<div class="cal-grid">'+cells+'</div></div>';
}

    D.history.unshift({type:'event',name:name,pts:pts,time:new Date().toISOString()});
    logActivity('Bulk: added event '+name); added++;
  }
  if(added>0){ await save(); flash('bulkOk'); renderAll(); }
}

function applySeasonTheme(theme){
  if(!theme||!theme.primary) return;
  document.documentElement.style.setProperty('--purple', theme.primary);
  var r=parseInt(theme.primary.slice(1,3),16);
  var g=parseInt(theme.primary.slice(3,5),16);
  var b=parseInt(theme.primary.slice(5,7),16);
  document.documentElement.style.setProperty('--purple-lt',
    'rgb('+Math.min(255,r+50)+','+Math.min(255,g+50)+','+Math.min(255,b+50)+')');
  document.documentElement.style.setProperty('--purple-dim',
    'rgba('+r+','+g+','+b+',0.15)');
  if(theme.accent) document.documentElement.style.setProperty('--gold-soft', theme.accent);
}

  el.innerHTML=r.map(function(sq,i){

      +'</div>';

      btn.onclick=(function(month){ return function(){ requireAdmin(function(){ markTraitDone(month); }); }; })(t.month);

// Converts a normal Google Docs/Slides/Sheets "share" link (…/edit?usp=sharing, …/view, etc.)
// into the /preview form Google explicitly supports embedding in an iframe. Docs served via
// /edit refuse to render inside an iframe (same cross-origin-framing restriction we ran into
// with Apps Script's HtmlService); /preview is the documented embeddable view. Returns null if
// the input doesn't look like a recognizable Google Docs/Slides/Sheets link, so callers can
// fall back to just linking out instead of guessing at a broken embed.
function gdocEmbedUrl_(url){
  if(!url) return null;
  const m=url.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) return null;
  return 'https://docs.google.com/'+m[1]+'/d/'+m[2]+'/preview';
}

// 2026-2027 EASD non-pupil days (holidays, breaks, conferences, records days)
// Half-days for students are still counted as school days.
const SCHOOL_HOLIDAYS_2627=new Set([
  '2026-09-04', // No school (pre-Labor Day)
  '2026-09-07', // Labor Day
  '2026-10-12', // Columbus Day / Indigenous Peoples Day
  '2026-10-23', // Parent-Teacher Conferences — no students
  '2026-11-23','2026-11-24','2026-11-25','2026-11-26','2026-11-27','2026-11-30', // Thanksgiving break
  '2026-12-23','2026-12-24','2026-12-25','2026-12-28','2026-12-29','2026-12-30','2026-12-31', // Winter break
  '2027-01-01', // New Year's Day
  '2027-01-18', // MLK Day
  '2027-01-19', // Records Day — teachers only, no students
  '2027-02-15', // Presidents Day
  '2027-03-22','2027-03-23', // Parent-Teacher Conferences — no students
  '2027-03-24','2027-03-25','2027-03-26', // Spring break
  '2027-03-29', // Weather make-up / vacation day
  '2027-05-28', // Weather make-up / vacation day
  '2027-05-31', // Memorial Day
]);
// Days off come from the Sheet's School Calendar tab (13_SchoolCalendar.gs: staff edit it, and it can
// sync from the district calendar). The built-in list above is only used if the Sheet can't be read.
function noSchoolDays(){ const c=D.schoolCalendar; return c&&Array.isArray(c.noSchool)&&c.noSchool.length?new Set(c.noSchool):SCHOOL_HOLIDAYS_2627; }
function localYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function countSchoolDays(startStr, toDate){
  // Count Mon-Fri school days from startStr through toDate (both included), skipping days off.
  // Dates are compared in local time: toISOString() is UTC and can land on the wrong day.
  const start=new Date(startStr+'T00:00:00');
  const end=typeof toDate==='string'?new Date(toDate+'T00:00:00'):new Date(toDate); end.setHours(0,0,0,0);
  if(end<start) return 0;
  const off=noSchoolDays();
  let count=0;
  const cur=new Date(start);
  while(cur<=end){
    const dow=cur.getDay();
    if(dow!==0&&dow!==6&&!off.has(localYmd(cur))) count++;
    cur.setDate(cur.getDate()+1);
  }
  return count;
}
function renderCountdown(){
  const el=document.getElementById('countdownStrip'); if(!el) return;
  const now=new Date(); now.setHours(0,0,0,0);
  const sc=D.schoolCalendar||{};
  const startStr=sc.start||D.schoolStart||DEF.schoolStart||'2026-08-31';
  const endStr=sc.end||D.lastDay||DEF.lastDay||'2027-06-09';
  const lastDay=new Date(endStr+'T00:00:00');
  const daysSinceStart=countSchoolDays(startStr, now);
  // School days after today through the last day. (It used to subtract 1 for today even on a
  // weekend or day off, so it ran one short then.)
  const tomorrow=new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
  const daysToEnd=countSchoolDays(localYmd(tomorrow), endStr);
  const events=D.countdownEvents||DEF.countdownEvents||[];
  const nextEvt=events.find(function(e){ return new Date(e.date+'T00:00:00')>=now; });
  // School days until the event (after today, through the event day), like the other two counts.
  const daysToNext=nextEvt?countSchoolDays(localYmd(tomorrow), nextEvt.date):null;
  // Update stat boxes
  const hs=D.homeStats||DEF.homeStats||{};
  const s1n=document.getElementById('homeStat1Num'); if(s1n) s1n.textContent=hs.stat1num||'4';
  const s1l=document.getElementById('homeStat1Lbl'); if(s1l) s1l.textContent=hs.stat1lbl||'Color Squads';
  const s2n=document.getElementById('homeStat2Num'); if(s2n) s2n.textContent=hs.stat2num||'9';
  const s2l=document.getElementById('homeStat2Lbl'); if(s2l) s2l.textContent=hs.stat2lbl||'LRG Traits';
  // Build countdown cards without nested template literals
  var card1='<div class="countdown-card"><div class="countdown-num">'+daysSinceStart+'</div>'
    +'<div class="countdown-lbl">Days of School</div>'
    +'<div class="countdown-sub">Mon–Fri, excl. holidays</div></div>';
  var card2=daysToNext!==null
    ?'<div class="countdown-card" style="border-top-color:var(--purple-lt)"><div class="countdown-num" style="color:var(--purple-lt)">'+daysToNext+'</div>'
      +'<div class="countdown-lbl">School Days Until</div><div class="countdown-sub">'+nextEvt.label+'</div></div>'
    :'<div class="countdown-card"><div class="countdown-num">—</div>'
      +'<div class="countdown-lbl">Next Event</div><div class="countdown-sub">Add in Admin — Settings</div></div>';
  var card3='<div class="countdown-card" style="border-top-color:#4ade80"><div class="countdown-num" style="color:#4ade80">'+daysToEnd+'</div>'
    +'<div class="countdown-lbl">School Days Left</div><div class="countdown-sub">Until '+endStr+'</div></div>';
  el.innerHTML=card1+card2+card3;
}

function renderTimeline(){
  const el=document.getElementById('timelineChart'); if(!el) return;
  const events=D.events||[];
  if(events.length<2){ el.innerHTML="<div style='text-align:center;color:var(--text3);padding:20px'>Add more events to see the timeline</div>"; return; }
  let running={BLACK:0,GOLD:0,GREY:0,PURPLE:0};
  const points=events.map(ev=>{
    SQUADS.forEach(sq=>running[sq]+=(ev.pts[sq]||0));
    const name=ev.name.length>14?ev.name.substring(0,14)+'…':ev.name;
    return {BLACK:running.BLACK,GOLD:running.GOLD,GREY:running.GREY,PURPLE:running.PURPLE,name};
  });
  const allVals=points.flatMap(p=>SQUADS.map(sq=>p[sq]));
  const maxVal=Math.max(...allVals,1);
  const H=160,padL=44,padR=16,padT=16,padB=50;
  const W=Math.max(560,points.length*72);
  const px=i=>padL+i*((W-padL-padR)/Math.max(points.length-1,1));
  const py=v=>padT+Math.round((1-v/maxVal)*(H-padT-padB));
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${W}px;height:${H}px">`;
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const y=py(maxVal*f);
    svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
    svg+=`<text x="${padL-4}" y="${y+4}" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="end" font-family="monospace">${Math.round(maxVal*f)}</text>`;
  });
  SQUADS.forEach(sq=>{
    const col=SQ_HEX[sq];
    const d=points.map((p,i)=>`${i===0?'M':'L'}${px(i)},${py(p[sq])}`).join(' ');
    svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>`;
    points.forEach((p,i)=>{ svg+=`<circle cx="${px(i)}" cy="${py(p[sq])}" r="3.5" fill="${col}"/>`; });
  });
  points.forEach((p,i)=>{
    svg+=`<text x="${px(i)}" y="${H-padB+14}" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-family="sans-serif">${p.name}</text>`;
  });
  const legY=H-12;
  SQUADS.forEach((sq,i)=>{
    const lx=padL+i*100;
    svg+=`<rect x="${lx}" y="${legY-8}" width="10" height="10" rx="2" fill="${SQ_HEX[sq]}"/>`;
    svg+=`<text x="${lx+14}" y="${legY}" font-size="10" fill="rgba(255,255,255,0.5)" font-family="sans-serif">${sq}</text>`;
  });
  svg+='</svg>';
  el.innerHTML=svg;
}

// ── STREAK TRACKING ──
function calcStreak(){
  // Use snapshots to find who has been #1 most consecutively
  const snaps=(D.snapshots||[]).slice().reverse(); // oldest first
  if(snaps.length<2) return null;
  let streak=0, streakSq=null, cur=0, curSq=null;
  snaps.forEach(function(snap){
    const r=Object.entries(snap.totals||{}).sort((a,b)=>b[1]-a[1]);
    if(!r.length) return;
    const top=r[0][0];
    if(top===curSq){ cur++; } else { cur=1; curSq=top; }
    if(cur>streak){ streak=cur; streakSq=top; }
  });
  // Also check current live standings
  const live=ranked()[0];
  const lastSnap=snaps[snaps.length-1];
  const lastTop=lastSnap?Object.entries(lastSnap.totals||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]:null;
  if(live===lastTop){ cur++; } else { cur=1; curSq=live; }
  if(cur>streak){ streak=cur; streakSq=live; }
  return streak>=2?{squad:streakSq,count:streak}:null;
}

function renderH2H(){
  const sq1El=document.getElementById('h2hSq1');
  const sq2El=document.getElementById('h2hSq2');
  if(!sq1El||!sq2El) return;
  const sq1=sq1El.value||'BLACK';
  const sq2=sq2El.value||'GOLD';
  const out=document.getElementById('h2hOutput'); if(!out) return;

  // Guard: same squad selected
  if(sq1===sq2){
    out.innerHTML='<div style="color:var(--text3);text-align:center;padding:32px;font-size:13px">Select two different squads to compare.</div>';
    return;
  }

  const events=(D.events||[]);
  if(!events.length){
    out.innerHTML='<div style="color:var(--text3);text-align:center;padding:32px;font-size:13px">No events recorded yet.</div>';
    return;
  }

  let wins1=0,wins2=0,ties=0,total1=0,total2=0;
  const rows=events.map(function(ev){
    const p1=ev.pts[sq1]||0, p2=ev.pts[sq2]||0;
    total1+=p1; total2+=p2;
    const winner = p1>p2 ? 1 : p2>p1 ? 2 : 0;
    if(winner===1) wins1++; else if(winner===2) wins2++; else if(p1>0||p2>0) ties++;
    const mx=Math.max(p1,p2,1);
    const w1=Math.round(p1/mx*100), w2=Math.round(p2/mx*100);
    const winBorder = winner===1 ? 'border-left:3px solid '+SQ_HEX[sq1] : winner===2 ? 'border-left:3px solid '+SQ_HEX[sq2] : 'border-left:3px solid var(--border)';
    const typeTag = ev.type==='event'
      ? '<span style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;background:rgba(109,43,159,0.12);color:var(--purple-lt);padding:2px 6px;border-radius:10px;margin-left:6px">Event</span>'
      : '<span style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,0.05);color:var(--text3);padding:2px 6px;border-radius:10px;margin-left:6px">Other</span>';
    const winLabel = winner===1
      ? '<span style="font-family:DM Mono,monospace;font-size:9px;color:'+SQ_HEX[sq1]+';margin-left:auto;font-weight:700">'+sq1+' +</span>'
      : winner===2
        ? '<span style="font-family:DM Mono,monospace;font-size:9px;color:'+SQ_HEX[sq2]+';margin-left:auto;font-weight:700">'+sq2+' +</span>'
        : (p1>0||p2>0)?'<span style="font-family:DM Mono,monospace;font-size:9px;color:var(--text3);margin-left:auto">TIE</span>':'';
    return '<div style="margin-bottom:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;'+winBorder+'">'
      +'<div style="display:flex;align-items:center;gap:4px;margin-bottom:8px">'
      +'<span style="font-size:13px;font-weight:600;color:var(--text)">'+ev.name+'</span>'
      +typeTag
      +(ev.date?'<span style="font-family:DM Mono,monospace;font-size:9px;color:var(--text3);margin-left:4px">'+ev.date+'</span>':'')
      +winLabel
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
      +'<span style="font-family:DM Mono,monospace;font-size:10px;color:'+SQ_HEX[sq1]+';width:52px;text-align:right;flex-shrink:0">'+sq1+'</span>'
      +'<div style="flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden"><div style="height:100%;width:'+w1+'%;background:'+SQ_HEX[sq1]+';border-radius:5px;transition:width 0.4s"></div></div>'
      +'<span style="font-family:Fraunces,serif;font-size:14px;font-weight:700;color:'+SQ_HEX[sq1]+';width:32px;flex-shrink:0">'+p1+'</span>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-family:DM Mono,monospace;font-size:10px;color:'+SQ_HEX[sq2]+';width:52px;text-align:right;flex-shrink:0">'+sq2+'</span>'
      +'<div style="flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden"><div style="height:100%;width:'+w2+'%;background:'+SQ_HEX[sq2]+';border-radius:5px;transition:width 0.4s"></div></div>'
      +'<span style="font-family:Fraunces,serif;font-size:14px;font-weight:700;color:'+SQ_HEX[sq2]+';width:32px;flex-shrink:0">'+p2+'</span>'
      +'</div>'
      +'</div>';
  }).join('');

  const overallWinner = total1>total2 ? sq1 : total2>total1 ? sq2 : null;
  const overallColor = overallWinner ? SQ_HEX[overallWinner] : 'var(--text3)';
  const overallLabel = overallWinner ? overallWinner+' leads overall' : 'Even overall';

    '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:16px;text-align:center;align-items:center">'
    +'<div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid '+SQ_HEX[sq1]+';border-radius:10px;padding:12px">'
    +'<div style="font-family:Fraunces,serif;font-size:28px;font-weight:900;color:'+SQ_HEX[sq1]+'">'+wins1+'</div>'
    +'<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:'+SQ_HEX[sq1]+';margin-top:2px">'+sq1+' wins</div>'
    +'<div style="font-family:Fraunces,serif;font-size:16px;font-weight:700;color:'+SQ_HEX[sq1]+';margin-top:4px">'+total1.toLocaleString()+' pts</div>'

    +'</div>'
    +'<div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid '+SQ_HEX[sq2]+';border-radius:10px;padding:12px">'
    +'<div style="font-family:Fraunces,serif;font-size:28px;font-weight:900;color:'+SQ_HEX[sq2]+'">'+wins2+'</div>'
    +'<div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:'+SQ_HEX[sq2]+';margin-top:2px">'+sq2+' wins</div>'
    +'<div style="font-family:Fraunces,serif;font-size:16px;font-weight:700;color:'+SQ_HEX[sq2]+';margin-top:4px">'+total2.toLocaleString()+' pts</div>'
    +'</div>'
    +'</div>'

    +rows;
}

async function saveEditEvent(){
  const id=parseInt(document.getElementById('editEvtId').value);
  const idx=(D.events||[]).findIndex(e=>e.id===id); if(idx===-1) return;
  const name=document.getElementById('editEvtName').value.trim(); if(!name) return;
  const pts={}; SQUADS.forEach(sq=>pts[sq]=parseFloat(document.getElementById('editPts'+sq).value)||0);
  D.events[idx]={...D.events[idx], name, type:document.getElementById('editEvtType').value,
    date:document.getElementById('editEvtDate').value, note:document.getElementById('editEvtNote').value.trim(), pts};
  D.history.unshift({type:'edit',name,pts,time:new Date().toISOString()});
  logActivity('Edited event: '+name);
  await save(); flash('editEvtOk'); renderAll();
  setTimeout(()=>close1('editEvtModal'),1200);
}

async function deleteEditEvent(){
  const id=parseInt(document.getElementById('editEvtId').value);
  const ev=(D.events||[]).find(e=>e.id===id); if(!ev) return;
  if(!confirm('Delete "'+ev.name+'"? This cannot be undone.')) return;
  D.events=D.events.filter(e=>e.id!==id);
  D.history.unshift({type:'delete',name:ev.name,time:new Date().toISOString()});
  logActivity('Deleted event: '+ev.name);
  await save(); close1('editEvtModal'); renderAll();
}

async function saveGenerals(){
  if(!D.generals) D.generals={};
  SQUADS.forEach(sq=>{
    D.generals[sq]={
      name: document.getElementById('gen-name-'+sq)?.value.trim()||'',
      grade: document.getElementById('gen-grade-'+sq)?.value.trim()||'',
      role: document.getElementById('gen-role-'+sq)?.value.trim()||'Squad General',
      bio: document.getElementById('gen-bio-'+sq)?.value.trim()||'',

// ── SQUAD PAGE EDITOR ──
function openSquadEditor(sq){
  const sp=(D.squadPages&&D.squadPages[sq])||{motto:'',image:'',desc:'',boxes:[]};
  const hex=SQ_HEX[sq];
  const boxes=sp.boxes||[];

  let overlay=document.getElementById('squadEditorOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='squadEditorOverlay';
    overlay.className='overlay';
    overlay.addEventListener('click',function(e){ if(e.target===overlay) closeSquadEditor(); });
    document.body.appendChild(overlay);
  }

  const modal=document.createElement('div');
  modal.className='modal';
  modal.style.maxWidth='680px';

  function fr(labelText, input){
    const w=document.createElement('div'); w.className='fr';
    const l=document.createElement('label'); l.textContent=labelText;
    w.appendChild(l); w.appendChild(input); return w;
  }

  const closeBtn=document.createElement('button');
  closeBtn.className='modal-close'; closeBtn.textContent='✕'; closeBtn.onclick=closeSquadEditor;

  const h2=document.createElement('h2'); h2.style.color=hex; h2.textContent=sq+' Squad Page';

  const mottoIn=document.createElement('input');
  mottoIn.type='text'; mottoIn.id='sqEdit-motto'; mottoIn.value=sp.motto||''; mottoIn.placeholder='e.g. Stay Sharp';

  const descIn=document.createElement('textarea');
  descIn.id='sqEdit-desc'; descIn.rows=3; descIn.placeholder='A few sentences about this squad...'; descIn.textContent=sp.desc||'';

  const fileIn=document.createElement('input');
  fileIn.type='file'; fileIn.id='sqEdit-file'; fileIn.accept='image/*'; fileIn.style.padding='8px';
  fileIn.onchange=function(){ previewSquadImg(this); };

  const prevDiv=document.createElement('div'); prevDiv.id='sqEdit-preview'; prevDiv.style.cssText='margin-top:8px;display:'+(sp.image?'block':'none');
  const prevImg=document.createElement('img'); prevImg.id='sqEdit-previewImg'; prevImg.src=sp.image||''; prevImg.style.cssText='max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--border2)';
  const remBtn=document.createElement('button'); remBtn.textContent='Remove Image'; remBtn.onclick=clearSquadImg;
  remBtn.style.cssText='display:block;margin-top:6px;background:none;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:11px;padding:4px 10px;border-radius:4px';
  prevDiv.appendChild(prevImg); prevDiv.appendChild(remBtn);

  const orDiv=document.createElement('div'); orDiv.style.cssText='font-size:11px;color:var(--text3);margin-top:4px'; orDiv.textContent='— or paste an image URL —';
  const urlIn=document.createElement('input'); urlIn.type='url'; urlIn.id='sqEdit-url'; urlIn.placeholder='https://…'; urlIn.style.marginTop='6px';
  urlIn.value=(sp.image&&!sp.image.startsWith('data:'))?sp.image:'';

  const imgWrap=document.createElement('div'); imgWrap.className='fr';
  const imgLbl=document.createElement('label'); imgLbl.textContent='Squad Image — Upload File';
  imgWrap.appendChild(imgLbl); imgWrap.appendChild(fileIn); imgWrap.appendChild(prevDiv); imgWrap.appendChild(orDiv); imgWrap.appendChild(urlIn);

  const boxHdr=document.createElement('div'); boxHdr.style.cssText='margin:20px 0 12px;display:flex;align-items:center;justify-content:space-between';
  const boxLbl=document.createElement('div'); boxLbl.style.cssText='font-family:DM Mono,monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3)'; boxLbl.textContent='Custom Info Boxes';
  const addBtn=document.createElement('button'); addBtn.className='btn btn-sm btn-purple'; addBtn.textContent='+ Add Box'; addBtn.onclick=addSquadBox;
  boxHdr.appendChild(boxLbl); boxHdr.appendChild(addBtn);

  const boxCon=document.createElement('div'); boxCon.id='sqEdit-boxes';
  boxes.forEach(function(box,i){
    const w=document.createElement('div'); w.id='sqbox-'+i; w.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px';
    const tw=document.createElement('div'); tw.className='fr';
    const tl=document.createElement('label'); tl.textContent='Box Title';
    const ti=document.createElement('input'); ti.type='text'; ti.id='sqbox-'+i+'-title'; ti.value=box.title||''; ti.placeholder='e.g. Our Goals';
    tw.appendChild(tl); tw.appendChild(ti);
    const xw=document.createElement('div'); xw.className='fr';
    const xl=document.createElement('label'); xl.textContent='Box Content';
    const xa=document.createElement('textarea'); xa.id='sqbox-'+i+'-content'; xa.rows=3; xa.placeholder='Content...'; xa.textContent=box.content||'';
    xw.appendChild(xl); xw.appendChild(xa);
    const rb=document.createElement('button'); rb.textContent='Remove Box'; rb.onclick=function(){ w.remove(); };
    rb.style.cssText='background:none;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:11px;padding:4px 10px;border-radius:4px';
    w.appendChild(tw); w.appendChild(xw); w.appendChild(rb);
    boxCon.appendChild(w);
  });

  const okMsg=document.createElement('div'); okMsg.className='fmsg'; okMsg.id='sqEditOk'; okMsg.textContent='✓ Saved!';
  const saveBtn=document.createElement('button'); saveBtn.className='btn-submit'; saveBtn.textContent='Save Squad Page';
  saveBtn.onclick=function(){ saveSquadPage(sq); };

  modal.appendChild(closeBtn);
  modal.appendChild(h2);
  modal.appendChild(fr('Motto', mottoIn));
  modal.appendChild(fr('Squad Description', descIn));
  modal.appendChild(imgWrap);
  modal.appendChild(boxHdr);
  modal.appendChild(boxCon);
  modal.appendChild(okMsg);
  modal.appendChild(saveBtn);

  overlay.innerHTML='';
  overlay.appendChild(modal);
  overlay.classList.add('open');
}

function closeSquadEditor(){
  const o=document.getElementById('squadEditorOverlay');
  if(o) o.classList.remove('open');
}

function previewSquadImg(input){
  if(input.files&&input.files[0]){
    const reader=new FileReader();
    reader.onload=function(e){
      document.getElementById('sqEdit-preview').style.display='block';
      document.getElementById('sqEdit-previewImg').src=e.target.result;
      document.getElementById('sqEdit-url').value='';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function clearSquadImg(){
  document.getElementById('sqEdit-preview').style.display='none';
  document.getElementById('sqEdit-previewImg').src='';
  document.getElementById('sqEdit-file').value='';
  document.getElementById('sqEdit-url').value='';
}

let _sqBoxCount=0;
function addSquadBox(){
  const container=document.getElementById('sqEdit-boxes'); if(!container) return;
  const i=Date.now();
  const wrap=document.createElement('div');
  wrap.id='sqbox-new-'+i;
  wrap.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px';
  const tw=document.createElement('div'); tw.className='fr';
  const tl=document.createElement('label'); tl.textContent='Box Title';
  const ti=document.createElement('input'); ti.type='text'; ti.id='sqbox-new-'+i+'-title'; ti.placeholder='e.g. Our Goals';
  tw.appendChild(tl); tw.appendChild(ti);
  const xw=document.createElement('div'); xw.className='fr';
  const xl=document.createElement('label'); xl.textContent='Box Content';
  const xa=document.createElement('textarea'); xa.id='sqbox-new-'+i+'-content'; xa.rows=3; xa.placeholder='Content for this box...';
  xw.appendChild(xl); xw.appendChild(xa);
  const rb=document.createElement('button'); rb.textContent='Remove Box';
  rb.style.cssText='background:none;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:11px;padding:4px 10px;border-radius:4px';
  rb.onclick=function(){ wrap.remove(); };
  wrap.appendChild(tw); wrap.appendChild(xw); wrap.appendChild(rb);
  container.appendChild(wrap);
}

async function saveSquadPage(sq){
  if(!D.squadPages) D.squadPages={BLACK:{motto:'',image:'',desc:'',boxes:[]},GOLD:{motto:'',image:'',desc:'',boxes:[]},GREY:{motto:'',image:'',desc:'',boxes:[]},PURPLE:{motto:'',image:'',desc:'',boxes:[]}};
  if(!D.squadPages[sq]) D.squadPages[sq]={motto:'',image:'',desc:'',boxes:[]};

  D.squadPages[sq].motto=document.getElementById('sqEdit-motto')?.value.trim()||'';
  D.squadPages[sq].desc=document.getElementById('sqEdit-desc')?.value.trim()||'';

  // Image — file upload takes priority over URL
  const fileInput=document.getElementById('sqEdit-file');
  const urlInput=document.getElementById('sqEdit-url')?.value.trim()||'';
  const previewImg=document.getElementById('sqEdit-previewImg');

  if(fileInput?.files?.length&&previewImg?.src?.startsWith('data:')){
    D.squadPages[sq].image=previewImg.src;
  } else if(urlInput){
    D.squadPages[sq].image=urlInput;
  } else if(!previewImg?.src){
    D.squadPages[sq].image='';
  }

  // Collect boxes from editor
  const boxes=[];
  document.getElementById('sqEdit-boxes').querySelectorAll('[id^="sqbox-"]').forEach(boxEl=>{
    const id=boxEl.id;
    const titleEl=boxEl.querySelector('[id$="-title"]');
    const contentEl=boxEl.querySelector('[id$="-content"]');
    if(titleEl&&contentEl){
      const title=titleEl.value.trim();
      const content=contentEl.value.trim();
      if(title||content) boxes.push({title,content});
    }
  });
  D.squadPages[sq].boxes=boxes;

  // Sync motto back to D.mottos for squad cards
  if(!D.mottos) D.mottos={BLACK:'',GOLD:'',GREY:'',PURPLE:''};
  D.mottos[sq]=D.squadPages[sq].motto;

  await save();
  const ok=document.getElementById('sqEditOk');
  if(ok){ ok.className='fmsg ok'; setTimeout(()=>ok.className='fmsg',2500); }
  closeSquadEditor();
  renderSquadDetail(sq);
  renderSquads();
}

  document.getElementById('traitMain').innerHTML=`
    <div class="trait-main">

// ── PHOTO MANAGEMENT ──

// ── URL VALIDATION ──
function isImageUrl(url){
  if(!url) return false;
  try{ new URL(url); } catch(e){ return false; }
  // Accept any https URL (we can't always predict extension, e.g. Google Drive, CDN)
  // But reject obviously non-image strings
  if(!url.startsWith('http')) return false;
  return true;
}
function validatePhotoUrl(url, errElId){
  if(!isImageUrl(url)){
    const el=document.getElementById(errElId);
    if(el){ el.textContent='⚠ Please enter a valid https:// URL'; el.style.display='block'; setTimeout(()=>el.style.display='none',3000); }
    return false;
  }
  return true;
}

async function addPagePhoto(section){
  const urlEl=document.getElementById('pe'+section.charAt(0).toUpperCase()+section.slice(1)+'PhotoUrl');
  const capEl=document.getElementById('pe'+section.charAt(0).toUpperCase()+section.slice(1)+'PhotoCaption');
  if(!urlEl||!urlEl.value.trim()) return;
  const url=urlEl.value.trim();
  if(!isImageUrl(url)){ alert('Please enter a valid https:// URL for the photo.'); return; }
  const caption=capEl?capEl.value.trim():'';
  if(!D.photos) D.photos={};
  if(!Array.isArray(D.photos[section])) D.photos[section]=[];
  D.photos[section].push({url, caption, id:Date.now()});
  urlEl.value=''; if(capEl) capEl.value='';
  await save();
  renderAdminPhotoList(section+'PhotoList', section);
  if(section==='mayhem') renderMayhem();
  if(section==='champs') renderChamps();
  if(section==='kickoff') renderKickoff();
  logActivity('Added photo to '+section);
}

async function removePagePhoto(section, idx){
  if(!D.photos||!Array.isArray(D.photos[section])) return;
  D.photos[section].splice(idx,1);
  await save();
  renderAdminPhotoList(section+'PhotoList', section);
  if(section==='mayhem') renderMayhem();
  if(section==='champs') renderChamps();
  if(section==='kickoff') renderKickoff();
}

function renderAdminPhotoList(containerId, section){
  const el=document.getElementById(containerId); if(!el) return;
  const photos=(D.photos&&D.photos[section])||[];
  if(!photos.length){ el.innerHTML='<div style="font-size:12px;color:var(--text3)">No photos added yet.</div>'; return; }
  el.innerHTML=photos.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <img src="${p.url}" style="width:40px;height:30px;object-fit:cover;border-radius:4px;flex-shrink:0">
      <div style="flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.caption||p.url}</div>
      <button onclick="removePagePhoto('${section}',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;flex-shrink:0">×</button>
    </div>`).join('');

// ── EVENT PAGES FROM THE SHEET (10_EventPages.gs: Event Pages + Event Rows tabs) ──
// Each page renders as before (Edit Page panel), then anything filled in on the Sheet wins.
var EVENT_PAGES=null; // var: render functions may run before this line does
const evEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const evParas=s=>'<p>'+evEsc(s).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
function applyEventPage_(p){
  const d=EVENT_PAGES&&EVENT_PAGES[p]; if(!d) return;
  const f=d.fields||{}, $=id=>document.getElementById(id);

// A program web app (Trait Dough, Student of the Month, Mindset) shown inside its page. The frame
// only loads once its page is on screen, so the home page stays fast. Students are signed in with
// their school account; anyone else gets the Open button.
function appEmbed_(url, title, note){
  if(!url) return '';
  const embed=!(D.apps&&D.apps.embed===false);
  return `<div class="card" style="padding:0;overflow:hidden;margin-top:6px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)">
      <div style="font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--text)">${title}</div>
      <a class="btn btn-gold" href="${url}" target="_blank" rel="noopener">Open in a new tab &#8599;</a>
    </div>
    ${embed?`<iframe data-src="${url}" title="${title}" style="display:block;width:100%;height:760px;border:0;background:#fff"></iframe>`:''}
    <div style="padding:8px 16px;font-size:12px;color:var(--text3)">${note}</div>
  </div>`;
}
function armAppEmbeds_(){
  const frames=document.querySelectorAll('iframe[data-src]:not([src])');
  if(!frames.length) return;
  if(!('IntersectionObserver' in window)){ frames.forEach(f=>f.src=f.dataset.src); return; }
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.src=e.target.dataset.src; io.unobserve(e.target); } }),{rootMargin:'200px'});
  frames.forEach(f=>io.observe(f));
}

function renderGrowth(){
  var wrap=document.getElementById('growth-panel-wrap');
  if(!wrap) return;
  if(wrap._loaded) return;
  wrap._loaded=true;
  // Trail Journal numbers come from the Trail Journal Data Sheet (Settings › TJ_SHEET_ID),
  // read on the server by clashTrailJournalStats in 03_Web.gs: only insight levels, dates,
  // squads and statuses, never student names or text.
  var SQUADS_TJ=['Gold','Grey','Black','Purple'];
  var SQ_CLR={Gold:'var(--sq-gold)',Grey:'var(--sq-grey)',Black:'var(--sq-black)',Purple:'var(--sq-purple)'};
  var SQ_BG={Gold:'#ffe100',Grey:'#99a8bb',Black:'#c5c9d1',Purple:'#bb8ef5'};
  var THRESHOLDS=[{min:5,pts:25,label:'5 reflections'},{min:10,pts:50,label:'10 reflections'},{min:25,pts:150,label:'25 reflections'},{min:50,pts:300,label:'50 reflections'}];
  function ago(ts){var d=Date.now()-ts,m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
  wrap.innerHTML='<div class="tj-panel">'
    +'<div class="tj-panel-head"><span style="font-size:1.4rem">&#x26F0;&#xFE0F;</span>'
    +'<h3>Community Culture Stats</h3>'
    +'<span class="tj-badge">Trail Journal</span>'
    +'<span class="tj-badge-panel">Trailback Panel</span>'
    +'<button class="tj-refresh" onclick="loadTJStats()">&#8635; Refresh</button></div>'
    +'<div class="tj-stat-row">'
    +'<div class="tj-stat"><div class="tj-stat-val" id="tj-total">&mdash;</div><div class="tj-stat-lbl">Reflections</div></div>'
    +'<div class="tj-stat"><div class="tj-stat-val" id="tj-high" style="color:#4ade80">&mdash;</div><div class="tj-stat-lbl">High Insight</div></div>'
    +'<div class="tj-stat"><div class="tj-stat-val" id="tj-panels" style="color:var(--purple-lt)">&mdash;</div><div class="tj-stat-lbl">Panels</div></div>'
    +'<div class="tj-stat"><div class="tj-stat-val" id="tj-pts-total" style="color:var(--gold-soft)">&mdash;</div><div class="tj-stat-lbl">Growth Pts</div></div>'
    +'<div class="tj-stat"><div class="tj-stat-val" id="tj-week" style="color:var(--purple-lt)">&mdash;</div><div class="tj-stat-lbl">This Week</div></div>'
    +'<div class="tj-stat"><div class="tj-stat-val" id="tj-bonus-total" style="color:var(--gold-soft)">&mdash;</div><div class="tj-stat-lbl">Bonus Pts</div></div>'
    +'</div>'
    +'<div class="tj-section-head">Per-Squad Breakdown</div>'
    +'<div class="tj-squad-grid" id="tj-squad-grid"><div class="tj-loading">Loading&#8230;</div></div>'
    +'<div class="tj-section-head">Bonus Thresholds</div>'
    +'<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px" id="tj-thresholds"><div class="tj-loading">Loading&#8230;</div></div>'
    +'<div class="tj-section-head">Recent Growth Moments</div>'
    +'<div class="frd-feed" id="tj-frd-feed"><div class="tj-loading">Loading&#8230;</div></div>'
    +'<div class="tj-bonus" id="tj-bonus-note" style="display:none"><span class="tj-bonus-icon">&#129334;</span><span id="tj-bonus-text"></span></div>'
    +'</div>';
  window.loadTJStats=async function(){
    try{
      var tj=await window.gasRun_('clashTrailJournalStats');
      var cocLoad=await window.gasCall_({action:'load'});
      var refs=tj.reflections,pnls=tj.panels;
      if(!Array.isArray(refs))return;
      var coc=(cocLoad&&cocLoad.value)?cocLoad.value:{};
      var total=refs.length;
      var hi=refs.filter(function(r){return r.insight_level==='High';}).length;
      var pc=Array.isArray(pnls)?pnls.filter(function(p){return p.status==='complete';}).length:0;
      var wago=Date.now()-7*24*60*60*1000;
      var wk=refs.filter(function(r){return new Date(r.created_at).getTime()>wago;}).length;
      var tjP={Gold:0,Grey:0,Black:0,Purple:0},plP={Gold:0,Grey:0,Black:0,Purple:0};
      var tjC={Gold:0,Grey:0,Black:0,Purple:0},hiC={Gold:0,Grey:0,Black:0,Purple:0};
      var plC={Gold:0,Grey:0,Black:0,Purple:0};
      (coc.events||[]).forEach(function(e){
        if(!e.pts||!e.type)return;
        SQUADS_TJ.forEach(function(sq){
          var p=e.pts[sq.toUpperCase()]||0;if(!p)return;
          if(e.type==='trail_journal'){tjP[sq]+=p;tjC[sq]++;hiC[sq]++;} // all TJ events are High insight (awardClashPoints only fires on High)
          else if(e.type==='trailback_panel'){plP[sq]+=p;plC[sq]++;}
        });
      });
      var tgp=0,tbp=0;
      SQUADS_TJ.forEach(function(sq){tgp+=tjP[sq]+plP[sq];var c=tjC[sq];THRESHOLDS.forEach(function(t){if(c>=t.min)tbp+=t.pts;});});
      function setEl(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
      setEl('tj-total',total);setEl('tj-high',hi);setEl('tj-panels',pc);
      setEl('tj-pts-total',tgp);setEl('tj-week',wk);setEl('tj-bonus-total',tbp||'--');
      var grid=document.getElementById('tj-squad-grid');
      if(grid){
        var mxT=Math.max.apply(null,SQUADS_TJ.map(function(sq){return tjC[sq];}));mxT=Math.max(mxT,1);
        var mxH=Math.max.apply(null,SQUADS_TJ.map(function(sq){return hiC[sq];}));mxH=Math.max(mxH,1);
        grid.innerHTML=SQUADS_TJ.map(function(sq){
          var tp=tjP[sq]+plP[sq],hp=tjC[sq]?Math.round((hiC[sq]/tjC[sq])*100):0;
          var bn=0;THRESHOLDS.forEach(function(t){if(tjC[sq]>=t.min)bn=t.pts;});
          return '<div class="tj-squad-card"><div class="tj-sq-head">'
            +'<div class="tj-sq-dot" style="background:'+SQ_BG[sq]+'"></div>'
            +'<div class="tj-sq-name" style="color:'+SQ_CLR[sq]+'">'+sq+'</div>'
            +'<div class="tj-sq-total">'+tp+' pts</div></div>'
            +'<div class="tj-sq-row"><div class="tj-sq-row-lbl">Reflections</div><div class="tj-bar-track"><div class="tj-bar-fill" style="width:'+Math.round((tjC[sq]/mxT)*100)+'%;background:'+SQ_BG[sq]+'"></div></div><div class="tj-sq-row-val">'+tjC[sq]+'</div></div>'
            +'<div class="tj-sq-row"><div class="tj-sq-row-lbl">High Insight</div><div class="tj-bar-track"><div class="tj-bar-fill" style="width:'+Math.round((hiC[sq]/mxH)*100)+'%;background:#4ade80"></div></div><div class="tj-sq-row-val" style="color:#4ade80">'+hp+'%</div></div>'
            +'<div class="tj-sq-row"><div class="tj-sq-row-lbl">TJ Points</div><div class="tj-bar-track"><div class="tj-bar-fill" style="width:'+Math.min(100,tjP[sq]*10)+'%;background:'+SQ_BG[sq]+'"></div></div><div class="tj-sq-row-val" style="color:'+SQ_CLR[sq]+'">'+tjP[sq]+'</div></div>'
            +(plC[sq]>0?'<div class="tj-panel-badge">Panel x'+plC[sq]+' &middot; +'+plP[sq]+' pts</div>':'')
            +(bn>0?'<div class="tj-panel-badge" style="background:rgba(255,225,0,.08);color:var(--gold-soft);border-color:rgba(255,225,0,.25);margin-top:4px">+'+bn+' bonus</div>':'')
            +'</div>';
        }).join('');
      }
      var tr=document.getElementById('tj-thresholds');
      if(tr)tr.innerHTML=THRESHOLDS.map(function(t){
        var ok=total>=t.min;
        return '<div class="tj-threshold-row"><div class="tj-threshold-label">'+t.label+'</div><div class="tj-threshold-val '+(ok?'earned':'pending')+'">'+(ok?'&#10003; +'+t.pts+' pts':(t.min-total)+' more needed')+'</div></div>';
      }).join('');
      var fl=(coc.freudenLog||[]).slice(-8).reverse();
      var fd=document.getElementById('tj-frd-feed');

async function addEvent(){
  const name=document.getElementById('evtName').value.trim(); if(!name) return;
  if(isDuplicateEvent(name) && !confirm('An event named "'+name+'" already exists. Add it anyway?')) return;
  if(!D.nextId) D.nextId=100;
  const pts={}; SQUADS.forEach(sq=>pts[sq]=parseFloat(document.getElementById('pts'+sq).value)||0);
  if(!Array.isArray(D.events)) D.events=[];
  var multiplier=parseFloat(document.getElementById('evtMultiplier')?.value)||1;
  var finalPts={}; SQUADS.forEach(function(sq){ finalPts[sq]=Math.round((pts[sq]||0)*multiplier); });
  var evtName=name+(multiplier!==1?' ('+multiplier+'x)':'');
  D.events.push({id:D.nextId++,name:evtName,type:document.getElementById('evtType').value,date:document.getElementById('evtDate').value,note:document.getElementById('evtNote').value.trim(),pts:finalPts,multiplier:multiplier});
  D.history.unshift({type:'event',name:evtName,pts:finalPts,time:new Date().toISOString()});
  logActivity('Added event: '+evtName+(multiplier!==1?' ['+multiplier+'x]':''));
  await save();
  const _topSq=SQUADS.filter(sq=>finalPts[sq]>0).sort((a,b)=>finalPts[b]-finalPts[a])[0];
  if(_topSq) showToast(evtName+' saved — '+_topSq+' +'+finalPts[_topSq]+' pts','save','✓');
  flash('evtOk'); document.getElementById('evtName').value=''; document.getElementById('evtNote').value='';
  SQUADS.forEach(sq=>document.getElementById('pts'+sq).value=0);
}

function renderNavOrder(){
  const list=document.getElementById('navOrderList');

  let orderedPages=PAGES_DEF.slice();
  if(D&&D.navOrder&&Array.isArray(D.navOrder)&&D.navOrder.length){
    const lookup=Object.fromEntries(PAGES_DEF.map(p=>[p.id,p]));
    const reordered=D.navOrder.map(id=>lookup[id]).filter(Boolean);
    PAGES_DEF.forEach(p=>{ if(!D.navOrder.includes(p.id)) reordered.push(p); });
    orderedPages=reordered;
  }
  list.innerHTML=orderedPages.map((p,i)=>{
    const icon=(D&&D.navIcons&&D.navIcons[p.id])||p.icon;
    const label=(D&&D.navLabels&&D.navLabels[p.id])||p.label;
    return `<div class="nav-order-item" data-id="${p.id}" draggable="true"
      style="display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:grab;user-select:none;transition:background .15s">
      <span style="color:var(--text3);font-family:'DM Mono',monospace;font-size:11px;width:18px;text-align:right;flex-shrink:0">${i+1}</span>
      <input type="text" data-nav-icon="${p.id}" value="${icon}"
        style="width:36px;text-align:center;font-size:18px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:3px;cursor:text;flex-shrink:0"
        onclick="event.stopPropagation()" ondragstart="event.stopPropagation()">
      <input type="text" data-nav-label="${p.id}" value="${label}"
        style="flex:1;font-size:12px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;color:var(--text);cursor:text;min-width:60px"
        onclick="event.stopPropagation()" ondragstart="event.stopPropagation()">
      <span style="color:var(--text3);font-size:14px;flex-shrink:0;cursor:grab">&#9776;</span>
    </div>`;
  }).join('');
  // Wire drag-and-drop
  let dragSrc=null;
  list.querySelectorAll('.nav-order-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{ dragSrc=item; item.style.opacity='.4'; e.dataTransfer.effectAllowed='move'; });
    item.addEventListener('dragend',()=>{ dragSrc.style.opacity='1'; list.querySelectorAll('.nav-order-item').forEach(i=>i.style.background='var(--surface2)'); });
    item.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; item.style.background='var(--surface)'; return false; });
    item.addEventListener('dragleave',()=>{ item.style.background='var(--surface2)'; });
    item.addEventListener('drop',e=>{ e.stopPropagation();
      if(dragSrc!==item){
        const items=[...list.querySelectorAll('.nav-order-item')];
        const fromIdx=items.indexOf(dragSrc), toIdx=items.indexOf(item);
        if(fromIdx<toIdx) list.insertBefore(dragSrc,item.nextSibling);
        else list.insertBefore(dragSrc,item);
        // Renumber
        list.querySelectorAll('.nav-order-item').forEach((it,i)=>{ it.querySelector('span:first-child').textContent=i+1; });
      }
      item.style.background='var(--surface2)';
      return false;
    });
  });
}
async function saveNavOrder(){
  const items=[...document.querySelectorAll('#navOrderList .nav-order-item')];

  if(!D.navIcons) D.navIcons={};
  if(!D.navLabels) D.navLabels={};

  document.querySelectorAll('[data-nav-icon]').forEach(el=>{
    const id=el.dataset.navIcon;
    const def=PAGES_DEF.find(p=>p.id===id);
    const val=el.value.trim();
    if(val && def && val!==def.icon) D.navIcons[id]=val;
    else delete D.navIcons[id];
  });
  document.querySelectorAll('[data-nav-label]').forEach(el=>{
    const id=el.dataset.navLabel;

    const val=el.value.trim();
    if(val && def && val!==def.label) D.navLabels[id]=val;
    else delete D.navLabels[id];
  });
  await save();
  buildNav();
  flash('navOrderOk');
}

// Locks in this month's percentages as permanent points (see rankPoints_/metTotal above),
// then clears the form so the next month starts blank. Separate from saveMetrics() -- saving
// is just persisting in-progress percentages as they trickle in; finalizing is the one-way
// action that actually awards points.
async function finalizeMonth(){
  const monthLabel=(document.getElementById('monthLabel').value||D.metrics.month||'').trim();
  if(!monthLabel){ alert('Enter a Month Label first (e.g. "September 2026").'); return; }
  if(!confirm('Finalize "'+monthLabel+'"? This locks in points for Attendance, No Referral, and No Fail Grade based on the current percentages, adds them permanently to each squad\'s score, and clears the metrics form for next month. This cannot be undone.')) return;
  D.metrics.month=monthLabel;
  const metricDefs=[{key:'attendance',label:'Attendance'},{key:'referral',label:'No Referral'},{key:'grades',label:'No Fail Grade'}];
  const totalPts={BLACK:0,GOLD:0,GREY:0,PURPLE:0};
  const breakdown={};
  metricDefs.forEach(d=>{
    const vals={}; SQUADS.forEach(sq=>{ vals[sq]=D.metrics[d.key][sq]||0; });
    const rp=rankPoints_(vals);
    breakdown[d.key]=rp;
    SQUADS.forEach(sq=>{ totalPts[sq]+=rp[sq]; });
  });
  if(!Array.isArray(D.monthlyMetrics)) D.monthlyMetrics=[];
  D.monthlyMetrics.push({
    id:Date.now(), month:monthLabel,
    attendance:{...D.metrics.attendance}, referral:{...D.metrics.referral}, grades:{...D.metrics.grades},
    metricPts:breakdown, pts:totalPts, finalizedAt:new Date().toISOString(),
  });
  D.history.unshift({type:'metrics-finalized',label:monthLabel,pts:totalPts,time:new Date().toISOString()});
  D.metrics={attendance:{BLACK:0,GOLD:0,GREY:0,PURPLE:0},referral:{BLACK:0,GOLD:0,GREY:0,PURPLE:0},grades:{BLACK:0,GOLD:0,GREY:0,PURPLE:0},month:''};
  await save();
  flash('metOk');
  renderTally(); renderMetrics(); renderScoreSummary(); renderHistList();
  aTab('metrics');
}

    D.sotmData.statStudents=g('peSotmSt1'); D.sotmData.statPerSquad=g('peSotmSt2');
    D.sotmData.statPoints=g('peSotmSt3'); D.sotmData.statTime=g('peSotmSt4');
    D.sotmData.statLocation=g('peSotmSt5');
    D.sotmData.partnersHeader=g('peSotmPartnersHdr');
    const rawP=g('peSotmPartners');
    D.sotmData.partners=rawP.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const pts=l.split('|'); return {month:pts[0]||'',trait:pts[1]||'',partners:pts[2]||''};
    });
  }
  if(page.startsWith('sq-')){
    const sq=page.replace('sq-','');
    if(!D.mottos) D.mottos={BLACK:'',GOLD:'',GREY:'',PURPLE:''};
    if(!D.squadPages) D.squadPages={BLACK:{motto:'',image:'',desc:'',boxes:[]},GOLD:{motto:'',image:'',desc:'',boxes:[]},GREY:{motto:'',image:'',desc:'',boxes:[]},PURPLE:{motto:'',image:'',desc:'',boxes:[]}};
    SQUADS.forEach(sq=>{
      if(!D.squadPages[sq]) D.squadPages[sq]={motto:'',image:'',desc:'',boxes:[]};
      if(!Array.isArray(D.squadPages[sq].boxes)) D.squadPages[sq].boxes=[];
      // Sync motto from squadPages back to mottos for squad cards
      if(D.squadPages[sq].motto) D.mottos[sq]=D.squadPages[sq].motto;
    });
    if(!D.squadDesc) D.squadDesc={BLACK:'',GOLD:'',GREY:'',PURPLE:''};
    if(!D.squadDesc) D.squadDesc={BLACK:'',GOLD:'',GREY:'',PURPLE:''};
    D.mottos[sq]=document.getElementById('peSqMotto')?.value.trim()||'';
    D.squadDesc[sq]=document.getElementById('peSqDesc')?.value.trim()||'';
  }
  await save(); flash('pageOk');
  renderSquads();
}

async function addLink(){
  const section=document.getElementById('linkSection').value;
  const label=document.getElementById('linkLabel').value.trim();
  const url=document.getElementById('linkUrl').value.trim();
  if(!label||!url) return;
  if(!D.links) D.links={mindset:[],mayhem:[],champs:[]};
  if(!Array.isArray(D.links[section])) D.links[section]=[];

  // For mindset, parse month and grade from label
  let key=null;
  if(section==='mindset'){
    const months=TRAITS.map(t=>t.month);
    const foundMonth=months.find(m=>label.toLowerCase().includes(m.toLowerCase()));
    if(label.toLowerCase().includes('7th')||label.toLowerCase().includes('seventh')) key=`7th-${foundMonth||''}`;
    else if(label.toLowerCase().includes('8th')||label.toLowerCase().includes('eighth')) key=`8th-${foundMonth||''}`;
    else if(label.toLowerCase().includes('ext')) key=`ext-${foundMonth||''}`;
  }

  D.links[section].push({label,url,key,id:Date.now()});
  await save(); flash('linkOk');
  document.getElementById('linkLabel').value=''; document.getElementById('linkUrl').value='';
  renderLinksList();
}

async function addGItem(type){
  if(!D.gallery) D.gallery={photos:[],quotes:[],spotlights:[],calendar:[]};
  let okId;
  if(type==='photo'){
    const fileInput=document.getElementById('gPhotoFile');
    const urlInput=document.getElementById('gPhotoUrl').value.trim();
    if(urlInput && !isImageUrl(urlInput)){ alert('Please enter a valid https:// URL for the photo.'); return; }
    const title=document.getElementById('gPhotoTitle').value.trim();
    const date=document.getElementById('gPhotoDate').value;
    if(fileInput&&fileInput.files&&fileInput.files[0]){
      const file=fileInput.files[0];
      const reader=new FileReader();
      reader.onload=async(e)=>{
        D.gallery.photos.unshift({url:e.target.result,title,date,id:Date.now()});
        await save(); flash('gPhotoOk'); renderGallery();
        document.getElementById('gPhotoUrl').value=''; document.getElementById('gPhotoTitle').value='';
        fileInput.value=''; document.getElementById('gPhotoPreview').style.display='none';
      };
      reader.readAsDataURL(file);
      return;
    }
    if(!urlInput) return;
    D.gallery.photos.unshift({url:urlInput,title,date,id:Date.now()});
    okId='gPhotoOk'; document.getElementById('gPhotoUrl').value=''; document.getElementById('gPhotoTitle').value='';
  } else if(type==='quote'){

    okId='gQuoteOk'; document.getElementById('gQuoteText').value='';
  } else if(type==='cal'){

    D.gallery.calendar.push({title,date:document.getElementById('gCalDate').value,desc:document.getElementById('gCalDesc').value.trim(),type:document.getElementById('gCalType').value,id:Date.now()});
    okId='gCalOk'; document.getElementById('gCalTitle').value=''; document.getElementById('gCalDesc').value='';

}

let _tvRemoteRaf=null, _tvLastSpinId=null;

function tvRemoteSpinStart(state){
  if(!state||state.id===_tvLastSpinId) return;
  _tvLastSpinId=state.id;
  const overlay=document.getElementById('tvSpinOverlay');
  const canvas=document.getElementById('tvRemoteCanvas');
  if(!overlay||!canvas) return;
  overlay.style.display='flex';
  const badge=document.getElementById('tvSpinSquadBadge');
  if(badge){ badge.textContent=(D.squadNames&&D.squadNames[state.squad])||state.squad; badge.style.color=SQ_HEX[state.squad]||'var(--gold-soft)'; }
  const pips=document.getElementById('tvSpinPips');
  if(pips){ pips.innerHTML=[0,1,2,3].map(i=>`<div style="width:14px;height:14px;border-radius:50%;background:${i<state.spinNum?'var(--gold-soft)':i===state.spinNum?'#fff':'rgba(255,255,255,0.2)'};transition:background .3s"></div>`).join(''); }
  const banner=document.getElementById('tvSpinResultBanner');
  const sub=document.getElementById('tvSpinResultSub');
  if(banner){banner.textContent='';banner.style.opacity='0';}
  if(sub) sub.textContent='Spinning…';
  SP_QUADS=SP_QUADS_BY_SPIN[Math.min(state.quadsIdx||state.spinNum,3)]; spRebuildAll();
  const ctx=canvas.getContext('2d');
  const {a0,delta,dur,easeExp}=state;
  const ease=t=>1-Math.pow(1-t,easeExp||3);
  const elapsed=Math.min(Date.now()-state.startedAt, dur*0.9);
  const t0=performance.now()-elapsed;
  if(_tvRemoteRaf) cancelAnimationFrame(_tvRemoteRaf);
  function fr(now){
    const t=Math.min((now-t0)/dur,1);
    spDrawWheel(ctx,a0+delta*ease(t),520);
    if(t<1) _tvRemoteRaf=requestAnimationFrame(fr);
    else spDrawWheel(ctx,a0+delta,520);
  }
  _tvRemoteRaf=requestAnimationFrame(fr);
}

function tvRemoteSpinResult(state){
  if(!state||!state.result) return;
  const canvas=document.getElementById('tvRemoteCanvas');
  const ctx=canvas?canvas.getContext('2d'):null;
  const finalAngle=state.result.finalAngle||spAngle;
  SP_QUADS=SP_QUADS_BY_SPIN[Math.min(state.quadsIdx||state.spinNum,3)]; spRebuildAll();
  if(ctx){
    const savedAngle=spAngle; spAngle=finalAngle;
    const landed=spSegAtPointer();
    spAngle=savedAngle;
    if(landed&&landed.li>=0) spDrawWheel(ctx,finalAngle,520,landed.li);
    else spDrawWheel(ctx,finalAngle,520);
  }
  const banner=document.getElementById('tvSpinResultBanner');
  const sub=document.getElementById('tvSpinResultSub');
  if(banner){banner.textContent=state.result.label||'';banner.style.opacity='1';}
  if(sub) sub.textContent=state.result.sub||'';
  setTimeout(()=>{
    const overlay=document.getElementById('tvSpinOverlay');
    if(overlay) overlay.style.display='none';
    SP_QUADS=SP_QUADS_BY_SPIN[0]; spRebuildAll();
  },6000);
}

  document.getElementById('tvNav').innerHTML=Array.from({length:TV_SLIDE_COUNT},(_,i)=>i).map(i=>`<div class="tv-dot${i===tvSlide?' on':''}" onclick="showSlide(${i});startAuto()"></div>`).join('');
}

const TV_SLIDE_COUNT=9; // 7 = the map, 8 = the Opponent (skipped when none is showing)

// Summit Map slide, built for a hallway TV read in a few seconds from across the hall.
// Left: a night mountain with a switchback trail; each squad is a pennant with its place on it.
// The leader camps near the summit and each place below sits one camp lower (tied squads share a
// camp), so close scores still read clearly. Right: the standings in big type, each row tied to
// its flag by a line. The flags climb in from the bottom when the slide comes up, leader last
// (no motion for people who turn motion off). Frozen squads get ❄️.
function buildSummitMap(){
  const el=document.getElementById('tvSummit'); if(!el) return;
  const r=ranked();
  const levels=[...new Set(r.map(sq=>grand(sq)))]; // distinct scores, highest first
  const CAMP_T=[0.86,0.64,0.42,0.2];                // how far up the trail each place camps (1st sits just under the snowline)
  const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const titleCase=sq=>sq.charAt(0)+sq.slice(1).toLowerCase();

  // The trail: switchbacks from base camp to the summit, smoothed (Catmull-Rom) and sampled, so
  // flags can be placed by distance along it.
  const knots=[[230,790],[560,722],[330,640],[655,560],[420,472],[690,384],[522,292],[602,206],[566,118]];
  const pts=[];
  for(let i=0;i<knots.length-1;i++){
    const p0=knots[Math.max(i-1,0)],p1=knots[i],p2=knots[i+1],p3=knots[Math.min(i+2,knots.length-1)];
    for(let s=0;s<24;s++){ const t=s/24,t2=t*t,t3=t2*t;
      pts.push([0,1].map(k=>0.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3))); }
  }
  pts.push(knots[knots.length-1]);
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=cum[cum.length-1];
  const at=t=>{ const d=Math.min(Math.max(t,0),1)*total; let i=1; while(i<cum.length-1&&cum[i]<d) i++;
    const k=(d-cum[i-1])/((cum[i]-cum[i-1])||1); return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k]; };
  const trailD='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');

  // Squads that share a camp (a tie) stand side by side.
  const placeOf=sq=>levels.indexOf(grand(sq));
  const marks=r.map(sq=>{
    const lvl=placeOf(sq), mates=r.filter(o=>placeOf(o)===lvl), k=mates.indexOf(sq);
    const [x,y]=at(CAMP_T[Math.min(lvl,3)]);
    return { sq, place:lvl+1, x:x+(k-(mates.length-1)/2)*58, y, frozen:(D.freezes||[]).some(f=>f.squad===sq) };
  });

  // Standings rows on the right, top to bottom in place order.
  const rowY=i=>150+i*172;
  const ord=n=>n+(n===1?'st':n===2?'nd':n===3?'rd':'th');
  const sub=(m,i)=>{
    const pts_=grand(m.sq);
    if(i===0) return r.length>1&&grand(r[1])===pts_ ? 'Tied for the summit' : `Leading by ${(pts_-grand(r[1]||m.sq)).toLocaleString()}`;
    const ahead=marks[i-1];
    return grand(ahead.sq)===pts_ ? `Tied with ${titleCase(ahead.sq)}` : `${(grand(ahead.sq)-pts_).toLocaleString()} behind ${titleCase(ahead.sq)}`;
  };

  // A few fixed stars (same every time, so the slide doesn't flicker between refreshes).
  const stars=Array.from({length:46},(_,i)=>{ const x=(i*317)%1060+20, y=(i*151)%330+18, rr=i%5===0?2.2:1.2;
    return `<circle cx="${x}" cy="${y}" r="${rr}" fill="#efe7ff" opacity="${(0.25+((i*37)%50)/100).toFixed(2)}"/>`; }).join('');

  const connectors=marks.map((m,i)=>{
    const y2=rowY(i)-10, x1=m.x+30, mx=(x1+1118)/2;
    return `<path d="M${x1.toFixed(0)} ${(m.y-58).toFixed(0)} C${mx.toFixed(0)} ${(m.y-58).toFixed(0)} ${mx.toFixed(0)} ${y2} 1118 ${y2}" fill="none" stroke="${SQ_HEX[m.sq]}" stroke-width="2" stroke-opacity=".45" stroke-dasharray="2 7" stroke-linecap="round" class="sm-rise" style="animation-delay:${(0.25+(marks.length-1-i)*0.22+0.35).toFixed(2)}s"/>`;
  }).join('');

  const flags=marks.slice().reverse().map((m,j)=>{
    const c=SQ_HEX[m.sq], delay=(0.25+j*0.22).toFixed(2);
    // Animation principles: the flag drops, squashes on landing and springs back; the cloth flutters
    // (follow-through); the leader crouches and hops once it has landed (anticipation).
    return `<g class="sm-drop" style="animation-delay:${delay}s"><g${m.place===1?` class="sm-lead" style="animation-delay:${(+delay+1.3).toFixed(2)}s"`:''}>
      <ellipse cx="${m.x}" cy="${m.y+4}" rx="22" ry="6" fill="#07020d" opacity=".55"/>
      <line x1="${m.x}" y1="${m.y+2}" x2="${m.x}" y2="${m.y-84}" stroke="#12081f" stroke-width="7" stroke-linecap="round" opacity=".7"/>
      <line x1="${m.x}" y1="${m.y+2}" x2="${m.x}" y2="${m.y-84}" stroke="#f3eefc" stroke-width="4" stroke-linecap="round"/>
      <g class="sm-flag" style="animation-delay:${(j*0.37).toFixed(2)}s"><path d="M${m.x+2} ${m.y-84} L${m.x+66} ${m.y-68} L${m.x+2} ${m.y-50} Z" fill="${c}" stroke="${m.frozen?'#93c5fd':'#12081f'}" stroke-width="${m.frozen?4:3}" stroke-linejoin="round" paint-order="stroke"/>
      <text x="${m.x+24}" y="${m.y-59}" text-anchor="middle" font-family="Fraunces,serif" font-weight="900" font-size="24" fill="#12081f">${m.place}</text></g>
      ${m.frozen?`<text x="${m.x+82}" y="${m.y-60}" font-size="26">❄️</text>`:''}
    </g></g>`;
  }).join('');

  const rows=marks.map((m,i)=>{
    const c=SQ_HEX[m.sq], y=rowY(i), delay=(0.25+(marks.length-1-i)*0.22+0.35).toFixed(2);
    return `<g class="sm-rise" style="animation-delay:${delay}s">
      <text x="1140" y="${y-34}" font-family="DM Mono,monospace" font-size="22" letter-spacing="1" fill="#b09ec8">${ord(m.place)}${m.frozen?'  ·  ❄️ POINT FREEZE':''}</text>
      <text x="1140" y="${y+22}" font-family="Fraunces,serif" font-weight="900" font-size="60" fill="${c}">${esc(titleCase(m.sq))}</text>
      <text x="1556" y="${y+22}" text-anchor="end" font-family="DM Mono,monospace" font-weight="500" font-size="40" fill="#f3eefc">${grand(m.sq).toLocaleString()}</text>
      <text x="1140" y="${y+58}" font-family="DM Mono,monospace" font-size="21" fill="#b09ec8">${esc(sub(m,i))}</text>
    </g>`;
  }).join('');

  el.innerHTML=`<svg viewBox="0 0 1600 840" style="width:100%;height:auto;max-height:76vh;display:block" role="img"
      aria-label="Summit Map: ${r.map((sq,i)=>`${ord(marks[i].place)} ${titleCase(sq)}, ${grand(sq)} points`).join('; ')}">
    <defs>
      <linearGradient id="smSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160a29"/><stop offset=".7" stop-color="#241140"/><stop offset="1" stop-color="#3a1c5c"/></linearGradient>
      <radialGradient id="smGlow" cx="566" cy="96" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe100" stop-opacity=".32"/><stop offset="1" stop-color="#ffe100" stop-opacity="0"/></radialGradient>
      <linearGradient id="smLit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3a8a"/><stop offset="1" stop-color="#3a2360"/></linearGradient>
      <linearGradient id="smShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c1a4a"/><stop offset="1" stop-color="#1b0f2e"/></linearGradient>
      <clipPath id="smPlate"><rect width="1600" height="840" rx="28"/></clipPath>
    </defs>
    <style>
      #tvSummit .sm-rise{animation:smRise .9s cubic-bezier(.25,1,.5,1) backwards}
      @keyframes smRise{from{opacity:0;transform:translateY(46px)}}
      #tvSummit .sm-drop{transform-box:fill-box;transform-origin:50% 100%;animation:smDrop 1.15s cubic-bezier(.3,0,.3,1) backwards}
      @keyframes smDrop{0%{opacity:0;transform:translateY(-140px) scaleY(1.14) scaleX(.92)}50%{opacity:1;transform:translateY(0) scaleY(1.1) scaleX(.94)}64%{transform:scaleY(.8) scaleX(1.14)}80%{transform:scaleY(1.06) scaleX(.97)}100%{transform:none}}
      #tvSummit .sm-lead{transform-box:fill-box;transform-origin:50% 100%;animation:smHop .9s cubic-bezier(.3,0,.3,1) both}
      @keyframes smHop{0%,100%{transform:none}22%{transform:scaleY(.84) scaleX(1.1)}48%{transform:translateY(-34px) scaleY(1.1) scaleX(.94)}72%{transform:translateY(0) scaleY(.88) scaleX(1.08)}86%{transform:scaleY(1.03)}}
      #tvSummit .sm-flag{transform-box:fill-box;transform-origin:0% 50%;animation:smFlutter 2.6s ease-in-out infinite alternate}
      @keyframes smFlutter{from{transform:skewY(-4deg) scaleX(.96)}to{transform:skewY(3deg) scaleX(1.02)}}
      @media (prefers-reduced-motion:reduce){#tvSummit .sm-rise,#tvSummit .sm-drop,#tvSummit .sm-lead,#tvSummit .sm-flag{animation:none}}
    </style>
    <g clip-path="url(#smPlate)">
      <rect width="1600" height="840" fill="url(#smSky)"/>
      ${stars}
      <circle cx="566" cy="96" r="260" fill="url(#smGlow)"/>
      <path d="M-20 840 L120 560 L210 610 L330 430 L410 500 L470 455 L470 840 Z M640 840 L760 520 L840 590 L930 470 L1060 640 L1120 840 Z" fill="#2a1747" opacity=".85"/>
      <path d="M40 840 L230 560 L300 602 L432 336 L470 360 L566 86 L1080 840 Z" fill="url(#smShade)"/>
      <path d="M566 86 L652 300 L700 272 L860 520 L920 502 L1080 840 L566 840 L610 560 L540 380 Z" fill="url(#smLit)" opacity=".9"/>
      <path d="M566 86 L604 182 L586 172 L570 196 L548 168 L528 186 L520 176 Z" fill="#f3eefc"/>
      <path d="M566 86 L604 182 L586 172 Z" fill="#cbbfe3"/>
      <path d="${trailD}" fill="none" stroke="#0f0719" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
      <path d="${trailD}" fill="none" stroke="#e3d6fb" stroke-width="4" stroke-dasharray="1 12" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      ${CAMP_T.map(t=>{ const [x,y]=at(t); return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="6" fill="#0f0719" stroke="#e3d6fb" stroke-width="2" opacity=".7"/>`; }).join('')}
      <path d="M566 86 L566 40" stroke="#ffe100" stroke-width="4" stroke-linecap="round"/><path d="M568 40 L604 50 L568 60 Z" fill="#ffe100"/>
      <text x="56" y="86" font-family="Fraunces,serif" font-weight="900" font-size="54" fill="#f3eefc">The Summit Map</text>
      <text font-family="DM Mono,monospace" font-size="21" fill="#b09ec8"><tspan x="58" y="124">Every point moves your</tspan><tspan x="58" y="152">squad up the mountain</tspan></text>
      <line x1="1118" y1="70" x2="1118" y2="790" stroke="#f3eefc" stroke-opacity=".08" stroke-width="2"/>
      ${connectors}${flags}${rows}
    </g>
  </svg>`;
}
function showSlide(n){ if(n===6) buildSummitMap(); /* replays the climb */ tvSlide=n; document.querySelectorAll('.tv-slide').forEach((s,i)=>s.classList.toggle('active',i===n)); document.querySelectorAll('.tv-dot').forEach((d,i)=>d.classList.toggle('on',i===n)); tvPct=0; tvProgRun(false); }
// The slide timer bar fills with one GPU transform per slide instead of a width change every 80ms.
function tvProgRun(go){ const p=document.getElementById('tvProg'); if(!p) return; p.style.transition='none'; p.style.transform='scaleX(0)'; if(!go) return; void p.offsetWidth; p.style.transition='transform '+TV_MS+'ms linear'; p.style.transform='scaleX(1)'; }
function tvNext(step){ let n=tvSlide; for(let i=0;i<TV_SLIDE_COUNT;i++){ n=(n+step+TV_SLIDE_COUNT)%TV_SLIDE_COUNT; if(!(n===8&&!(window._tvGame&&window._tvGame.monster))&&!(n===7&&!(window._tvGame&&window._tvGame.map))) return n; } return 0; }
function startAuto(){ clearInterval(tvTimer); clearInterval(tvPTimer); tvProgRun(true); tvTimer=setInterval(()=>{showSlide(tvNext(1));startAuto();},TV_MS); }

document.addEventListener('keydown',e=>{

});

function renderMindsetLinkGrid(){
  const links=D.links.mindset||[];
  const getUrl=(month,grade)=>{
    const found=links.find(l=>l.key===`${grade}-${month}`);
    return found?found.url:'';
  };
  const hdr=`<div class="mindset-grid-hdr"><span>Month</span>${GRADE_LABELS.map(g=>`<span>${g}</span>`).join('')}</div>`;
  const rows=MONTHS_SHORT.map(month=>`

    </div>`).join('');

}

async function saveMindsetLinks(){
  if(!D.links) D.links={};
  if(!Array.isArray(D.links.mindset)) D.links.mindset=[];
  // Rebuild mindset links from grid
  const kept=D.links.mindset.filter(l=>!l.key); // keep any without keys
  const fromTab={}; D.links.mindset.forEach(l=>{ if(l.fromSheet) fromTab[l.key]=l.url; }); // the Mindset Links tab's
  document.querySelectorAll('#mindsetLinkGrid input').forEach(input=>{
    const month=input.dataset.month, grade=input.dataset.grade;
    const url=input.value.trim();
    const key=`${grade}-${month}`;
    const label=`${month} — ${grade==='7th'?'7th Grade':grade==='8th'?'8th Grade':'Extension'}`;
    // An unchanged tab link stays the tab's (edit it in the Sheet); a new link here wins over the tab.
    if(url) kept.push(url===fromTab[key]?{label,url,key,fromSheet:true}:{label,url,key,id:Date.now()+Math.random()});
  });
  D.links.mindset=kept;
  await save(); flash('mindsetLinkOk');
}

async function addLinkSection(section){
  const label=document.getElementById('linkLabel-'+section)?.value.trim();
  const url=document.getElementById('linkUrl-'+section)?.value.trim();
  if(!label||!url) return;
  if(!D.links) D.links={};
  if(!Array.isArray(D.links[section])) D.links[section]=[];
  D.links[section].push({label,url,id:Date.now()});
  await save();
  flash('linkOk-'+section);
  document.getElementById('linkLabel-'+section).value='';
  document.getElementById('linkUrl-'+section).value='';
  renderSimpleLinksList(section);
}

function renderSimpleLinksList(section){
  const el=document.getElementById('linksList-'+section); if(!el) return;
  const links=(D.links||{})[section]||[];
  if(!links.length){ el.innerHTML='<p style="color:var(--text3);font-size:13px;margin-top:8px">No links yet.</p>'; return; }
  el.innerHTML=links.map((l,i)=>`

async function removeLinkSection(section,i){

function renderPoll(){
  const el=document.getElementById('pollSection'); if(!el) return;
  const poll=D.poll||{};
  if(!poll.active||!poll.question){ el.style.display='none'; return; }
  el.style.display='block';
  const totalVotes=Object.values(poll.votes||{}).reduce(function(s,v){return s+v;},0);

  var optionsHTML=(poll.options||[]).map(function(opt,i){
