    +'<div style="font-family:DM Mono,monospace;font-size:10px;color:var(--text3);margin-top:10px">'+totalVotes+' vote'+(totalVotes!==1?'s':'')+' total</div>'

}

async function castVote(optIndex){
  const poll=D.poll||{}; if(!poll.active) return;
  const key='coc-poll-'+poll.question;
  let prev=null;
  try{ prev=localStorage.getItem(key); }catch(e){}
  // Votes are counted on the server (no admin sign-in needed), only the poll changes.
  try{
    const votes=await window.gasRun_('clashVote', poll.question, optIndex, prev===null?-1:Number(prev));
    D.poll.votes=votes||{};
    try{ localStorage.setItem(key,String(optIndex)); }catch(e){}
  }catch(e){ console.error('Vote not counted:',e); }
  renderPoll();
}

  if(!Array.isArray(D.snapshots)) D.snapshots=[];

// ══════════════════════════════════════════
// WHEEL SPINNER
// ══════════════════════════════════════════

// Real wheel segments — single flat disc, 4 colour quadrants
// Points always earned on rings 1-3 regardless of colour
// Ring 4 and LOYALTY: must match squad colour to earn
const W_SEGS = [
  // Each segment: {color, type:'pts'|'special', val, name?, loyalty?}
  // BLACK quadrant (6 segments)
  {color:'BLACK', type:'pts',     val:1},
  {color:'BLACK', type:'pts',     val:10},
  {color:'BLACK', type:'pts',     val:25},
  {color:'BLACK', type:'special', val:0,  name:'NONE'},
  {color:'BLACK', type:'pts',     val:50},
  {color:'BLACK', type:'pts',     val:5},
  // GOLD quadrant
  {color:'GOLD',  type:'pts',     val:20},
  {color:'GOLD',  type:'pts',     val:5},
  {color:'GOLD',  type:'special', val:20, name:'LOYALTY', loyalty:true},
  {color:'GOLD',  type:'pts',     val:50},
  {color:'GOLD',  type:'pts',     val:10},
  {color:'GOLD',  type:'pts',     val:25},
  // GREY quadrant
  {color:'GREY',  type:'pts',     val:1},
  {color:'GREY',  type:'pts',     val:30},
  {color:'GREY',  type:'pts',     val:10},
  {color:'GREY',  type:'special', val:0,  name:'ZERO'},
  {color:'GREY',  type:'pts',     val:20},
  {color:'GREY',  type:'pts',     val:75},
  // PURPLE quadrant
  {color:'PURPLE',type:'pts',     val:5},
  {color:'PURPLE',type:'pts',     val:50},
  {color:'PURPLE',type:'special', val:0,  name:'AUTO'},
  {color:'PURPLE',type:'pts',     val:25},
  {color:'PURPLE',type:'pts',     val:10},
  {color:'PURPLE',type:'special', val:20, name:'LOYALTY', loyalty:true},
];

const W_SQ_HEX = {BLACK:'#b8bcc6',GOLD:'#ffe100',GREY:'#8899aa',PURPLE:'#bb8ef5'};
const W_SQ_DARK= {BLACK:'#5a6070',GOLD:'#907000',GREY:'#445566',PURPLE:'#6a40a8'};
const W_SPEC   = {
  NONE:    {bg:'#151520',text:'#5050a0',label:'NONE'},
  ZERO:    {bg:'#151520',text:'#5050a0',label:'ZERO'},
  NADA:    {bg:'#151520',text:'#5050a0',label:'NADA'},
  GIVE:    {bg:'#1e1400',text:'#cc9900',label:'GIVE'},
  AUTO:    {bg:'#0c1220',text:'#4477aa',label:'AUTO'},
  LOYALTY: {bg:'#180830',text:'#aa55ee',label:'LOYALTY'},
};

let wCanvas, wCtx, wAngle=0, wSpinning=false, wRing=0, wBanked=0;
let wSquad='BLACK', wRaf=null;

const W_N = W_SEGS.length;
const W_SA = (Math.PI*2)/W_N;
const W_CX=150, W_CY=150, W_R=142;

function openWheelSpinner(){
  wCanvas=document.getElementById('wSpinCanvas');
  wCtx=wCanvas.getContext('2d');
  wAngle=0; wRing=0; wBanked=0; wSpinning=false;
  wUpdateDots(); wUpdateBanked(); wDrawWheel();
  wSetResult('—','Pick a squad and spin','');
  wSetBtns(true,false,false);
  document.getElementById('wSaveArea').style.display='none';
  document.getElementById('wheelSpinModal').classList.add('open');
}

function closeWheelSpinner(){
  if(wRaf) cancelAnimationFrame(wRaf);
  document.getElementById('wheelSpinModal').classList.remove('open');
}

function wDrawWheel(){
  if(!wCtx) return;
  const ctx=wCtx;
  ctx.clearRect(0,0,300,300);
  for(let i=0;i<W_N;i++){
    const seg=W_SEGS[i];
    const a0=wAngle+i*W_SA-Math.PI/2;
    const a1=a0+W_SA, am=a0+W_SA/2;
    ctx.beginPath();
    ctx.moveTo(W_CX,W_CY);
    ctx.arc(W_CX,W_CY,W_R,a0,a1);
    ctx.closePath();
    // Color: dim non-active rings (just cosmetic — all rings share same flat disc)
    if(seg.type==='special'){
      const ss=W_SPEC[seg.name]||W_SPEC.NONE;
      ctx.fillStyle=ss.bg;
    } else {
      ctx.fillStyle=W_SQ_HEX[seg.color];
    }
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
    // Label
    const lr=W_R*0.62, lx=W_CX+Math.cos(am)*lr, ly=W_CY+Math.sin(am)*lr;
    ctx.save(); ctx.translate(lx,ly); ctx.rotate(am+Math.PI/2);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(seg.type==='special'){
      const ss=W_SPEC[seg.name]||W_SPEC.NONE;
      ctx.fillStyle=ss.text;
      ctx.font='bold 8px "DM Mono",monospace,"Courier New"';
      ctx.fillText(seg.name,0,0);
    } else {
      const light=seg.color==='GOLD'||seg.color==='GREY';
      ctx.fillStyle=light?'#111':'#fff';
      ctx.font='bold 12px "Fraunces",serif';
      ctx.fillText(seg.val,0,0);
    }
    ctx.restore();
  }
  // Outer rim
  wCtx.beginPath(); wCtx.arc(W_CX,W_CY,W_R,0,Math.PI*2);
  wCtx.strokeStyle='rgba(232,200,64,0.35)'; wCtx.lineWidth=3; wCtx.stroke();
  // Ring 4 highlight: inner donut to show which ring matters for colour
  if(wRing===3){
    wCtx.beginPath(); wCtx.arc(W_CX,W_CY,W_R*0.5,0,Math.PI*2);
    wCtx.strokeStyle='rgba(232,200,64,0.55)'; wCtx.lineWidth=2.5; wCtx.stroke();
    wCtx.beginPath(); wCtx.arc(W_CX,W_CY,W_R*0.5,0,Math.PI*2);
    wCtx.strokeStyle='rgba(232,200,64,0.15)'; wCtx.lineWidth=W_R; wCtx.stroke();
  }
  // Hub
  wCtx.beginPath(); wCtx.arc(W_CX,W_CY,18,0,Math.PI*2);
  wCtx.fillStyle='#0f0f18'; wCtx.fill();
  wCtx.strokeStyle='rgba(255,255,255,0.18)'; wCtx.lineWidth=1.5; wCtx.stroke();
  wCtx.beginPath(); wCtx.arc(W_CX,W_CY,5,0,Math.PI*2);
  wCtx.fillStyle='#e8c840'; wCtx.fill();
}

function wDoSpin(){
  if(wSpinning) return;
  wSpinning=true;
  document.getElementById('wSaveArea').style.display='none';
  wSetBtns(false,false,false);
  wSetResult('—','Spinning…','');
  const landIdx=Math.floor(Math.random()*W_N);
  const extra=5+Math.random()*5;
  const target=-Math.PI/2-landIdx*W_SA-W_SA/2-extra*Math.PI*2;
  const a0=wAngle, delta=target-a0;
  const dur=3000+Math.random()*1600, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,4);
  function frame(now){
    const t=Math.min((now-t0)/dur,1);
    wAngle=a0+delta*ease(t); wDrawWheel();
    if(t<1){ wRaf=requestAnimationFrame(frame); }
    else { wSpinning=false; wLand(W_SEGS[landIdx]); }
  }
  wRaf=requestAnimationFrame(frame);
}

function wLand(seg){
  const isRing4=(wRing===3);
  // Determine earn
  if(seg.type==='special'){
    const n=seg.name;
    if(n==='NONE'||n==='ZERO'||n==='NADA'){
      wSetResult(n+' — 0 pts','No points this spin.','zero');
      wSetBtns(false,false,false);
      setTimeout(()=>{wNextOrSave(false);},1200);
    } else if(n==='LOYALTY'){
      const match=(seg.color===wSquad);
      const pts=match?seg.val:0;
      if(match) wBanked+=pts;
      wUpdateBanked();
      wSetResult('LOYALTY — '+(match?'+'+pts+' pts':'0 pts'), match?'Your squad color — points earned!':'Not your squad color. No points.', match?'earn':'zero');
      if(isRing4||!match){ setTimeout(()=>wNextOrSave(match),1200); }
      else { wSetBtns(false,true,true); }
    } else if(n==='AUTO'){
      wSetResult('AUTO — advance!','Must spin the next ring!','auto');
      wRing=Math.min(wRing+1,3);
      wUpdateDots();
      setTimeout(wDoSpin,1600);
      return;
    } else if(n==='GIVE'){
      const pts=seg.val||20;
      wBanked=Math.max(0,wBanked-pts);
      wUpdateBanked();
      wSetResult('GIVE — −'+pts+' pts','Give those points to another squad!','give');
      if(isRing4){ setTimeout(()=>wNextOrSave(false),1200); }
      else { wSetBtns(false,true,true); }
    }
  } else {
    // Points segment
    const pts=seg.val;
    const colorMatch=(seg.color===wSquad);
    // Ring 4: must match colour. Rings 1-3: always earn.
    const earn=(isRing4?colorMatch:true);
    if(earn){ wBanked+=pts; wUpdateBanked(); }
    wSetResult(
      earn ? '+'+pts+' pts' : '0 pts — wrong colour',
      earn
        ? (isRing4 ? 'Your squad colour on Ring 4! +'+pts+' pts.' : '+'+pts+' pts earned.')
        : 'Ring 4: must land on your squad colour. No points.',
      earn?'earn':'zero'
    );
    if(isRing4||!earn){
      setTimeout(()=>wNextOrSave(earn),1200);
    } else {
      wSetBtns(false,true,true);
    }
  }
}

function wNextOrSave(earned){
  // Show save panel — always, so admin can choose to save or discard
  wShowSave();
  wSetBtns(true,false,false); // allow another full spin session
}

function wDoBank(){
  wSetBtns(false,false,false);
  wShowSave();
}

function wDoRisk(){
  if(wRing>=3) return;
  wSetBtns(false,false,false);
  wRing++;
  wUpdateDots();
  setTimeout(wDoSpin,300);
}

function wShowSave(){
  const area=document.getElementById('wSaveArea');
  area.style.display='block';
  const label='Wheel — '+SQ_HEX_NAMES[wSquad]+' Squad';
  document.getElementById('wEvtLabel').value=label;
  const prev=document.getElementById('wSavePreview');
  if(wBanked>0){
    const pts={}; SQUADS.forEach(s=>pts[s]=0); pts[wSquad]=wBanked;
    prev.innerHTML='<strong style="color:var(--gold-soft)">+'+wBanked+' pts</strong> for '+SQ_HEX_NAMES[wSquad]+' Squad';
  } else {
    prev.innerHTML='<span style="color:var(--text3)">0 points — nothing to save.</span>';
  }
}

async function wSaveToTracker(){
  if(wBanked<=0){
    // Nothing to save — just close
    const ok=document.getElementById('wSaveOk');
    ok.textContent='No points to save.'; ok.className='fmsg on';
    setTimeout(()=>{ok.className='fmsg';},1800);
    return;
  }
  const label=document.getElementById('wEvtLabel').value.trim()||('Wheel — '+SQ_HEX_NAMES[wSquad]+' Squad');
  const pts={}; SQUADS.forEach(s=>pts[s]=0); pts[wSquad]=wBanked;
  if(!D.nextId) D.nextId=100;
  if(!Array.isArray(D.events)) D.events=[];
  D.events.push({id:D.nextId++,name:label,type:'event',date:new Date().toISOString().split('T')[0],note:'Wheel spin',pts});
  D.history.unshift({type:'event',name:label,pts,time:new Date().toISOString()});
  logActivity('Wheel spin: +'+wBanked+' to '+wSquad);
  await save();
  renderAll();
  flash('wSaveOk');
  // Reset for next spin
  wBanked=0; wRing=0; wUpdateDots(); wUpdateBanked();
  document.getElementById('wSaveArea').style.display='none';
  wSetResult('Saved!','Points added to tracker.','earn');
  wSetBtns(true,false,false);
}

const SQ_HEX_NAMES={BLACK:'Black',GOLD:'Gold',GREY:'Grey',PURPLE:'Purple'};

function wSetSq(sq){
  wSquad=sq;
  document.querySelectorAll('.w-sq-btn').forEach(b=>{
    const on=b.dataset.wsq===sq;
    b.classList.toggle('w-sq-on',on);
    b.style.background=on?W_SQ_HEX[sq]:'var(--surface2)';
    b.style.borderColor=on?W_SQ_HEX[sq]:'var(--border)';
    b.style.color=on?(sq==='BLACK'||sq==='PURPLE'?'#fff':'#000'):'var(--text2)';
    b.style.fontWeight=on?'700':'400';
  });
}

function wUpdateDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('wDot'+i);
    if(!d) continue;
    const active=i===wRing, done=i<wRing;
    d.style.background=active?'var(--gold-soft)':done?'rgba(232,200,64,.35)':'var(--surface)';
    d.style.border=active?'none':done?'1.5px solid rgba(232,200,64,.4)':'1.5px solid var(--border)';
    d.style.boxShadow=active?'0 0 6px rgba(232,200,64,.5)':'none';
  }
  document.getElementById('wRiskBtn').textContent=wRing>=3?'Go Center ⚡':'Risk It ⚡';
}

function wUpdateBanked(){
  document.getElementById('wBankedPts').textContent=wBanked;
  document.getElementById('wBankedSub').textContent=wBanked===0?'nothing banked yet':'pts banked this spin';
}

function wSetResult(v,s,cls){
  const c=document.getElementById('wResultCard');
  c.style.borderColor=cls==='earn'?'rgba(75,222,128,.4)':cls==='zero'?'rgba(248,113,113,.3)':cls==='give'?'rgba(255,225,0,.4)':cls==='auto'?'rgba(153,168,187,.35)':cls==='loyalty'?'rgba(187,142,245,.4)':'var(--border)';
  c.style.background=cls==='earn'?'rgba(75,222,128,.04)':cls==='zero'?'rgba(248,113,113,.03)':'var(--surface)';
  document.getElementById('wResultVal').textContent=v;
  document.getElementById('wResultSub').textContent=s;
}

function wSetBtns(spin,bank,risk){
  const sb=document.getElementById('wSpinBtn'),bb=document.getElementById('wBankBtn'),rb=document.getElementById('wRiskBtn');
  sb.disabled=!spin; sb.style.opacity=spin?'1':'.35'; sb.style.cursor=spin?'pointer':'default';
  bb.disabled=!bank; bb.style.opacity=bank?'1':'.3'; bb.style.cursor=bank?'pointer':'default';
  rb.disabled=!risk; rb.style.opacity=risk?'1':'.3'; rb.style.cursor=risk?'pointer':'default';
}

// ── AUDIO ───────────────────────────────────
function spInitAudio(){
  if(spAudioCtx) return;
  try{ spAudioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function spPlayTick(intensity){
  if(!spAudioCtx) return;
  try{
    const o=spAudioCtx.createOscillator(),g=spAudioCtx.createGain();
    o.connect(g);g.connect(spAudioCtx.destination);
    o.type='sine';o.frequency.setValueAtTime(900+intensity*300,spAudioCtx.currentTime);
    g.gain.setValueAtTime(0.05*intensity,spAudioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,spAudioCtx.currentTime+0.07);
    o.start();o.stop(spAudioCtx.currentTime+0.07);
  }catch(e){}
}
function spPlayLand(type){
  if(!spAudioCtx) return;
  try{
    const freqs=type==='earn'?[523,659,784]:type==='zero'?[220,185,165]:[440,550];
    freqs.forEach((f,i)=>{
      const o=spAudioCtx.createOscillator(),g=spAudioCtx.createGain();
      o.connect(g);g.connect(spAudioCtx.destination);
      o.type=type==='earn'?'triangle':'sawtooth';
      o.frequency.setValueAtTime(f,spAudioCtx.currentTime+i*.05);
      g.gain.setValueAtTime(0.07,spAudioCtx.currentTime+i*.05);
      g.gain.exponentialRampToValueAtTime(0.0001,spAudioCtx.currentTime+0.55+i*.05);
      o.start(spAudioCtx.currentTime+i*.05);
      o.stop(spAudioCtx.currentTime+0.65+i*.05);
    });
  }catch(e){}
}

// ── DRAW ────────────────────────────────────
function spDrawWheel(ctx,angle,sz,hlSeg){
  if(!ctx) return;
  const cx=sz/2, cy=sz/2, r=sz/2-6, sc=sz/380;

  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=32*sc;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#08080f'; ctx.fill();
  ctx.restore();
  const SP_BASE={BLACK:{fill:'#1e2130',mid:'#2a2f45',edge:'#12141f'},GOLD:{fill:'#d4a800',mid:'#ffe44d',edge:'#a07800'},GREY:{fill:'#6b7f94',mid:'#9ab0c4',edge:'#4a5a6a'},PURPLE:{fill:'#6b2daa',mid:'#a05de0',edge:'#3d1265'}};
  const SP_SPEC_FILL={BLACK:{fill:'#0d0f1a',mid:'#14182a',edge:'#08090f'},GOLD:{fill:'#5a4200',mid:'#7a5e00',edge:'#3a2a00'},GREY:{fill:'#2a3540',mid:'#3a4a58',edge:'#1a2028'},PURPLE:{fill:'#230d45',mid:'#341460',edge:'#120625'}};
  let si=0;
  SP_QUADS.forEach((q,qi)=>{
    const qBase=SP_QS[qi]+angle;
    q.segs.forEach(seg=>{
      const a0=qBase+seg.sf*SP_QA, a1=qBase+seg.ef*SP_QA, am=(a0+a1)/2;
      const isHL=(hlSeg!==undefined&&si===hlSeg);
      const pal=seg.t==='sp'?(SP_SPEC_FILL[q.color]||SP_SPEC_FILL.BLACK):(SP_BASE[q.color]||SP_BASE.BLACK);
      const gmx=cx+Math.cos(am)*r*0.5, gmy=cy+Math.sin(am)*r*0.5;
      const grad=ctx.createRadialGradient(gmx,gmy,r*0.05,cx,cy,r);
      grad.addColorStop(0,pal.mid); grad.addColorStop(0.55,pal.fill); grad.addColorStop(1,pal.edge);
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
      ctx.fillStyle=grad; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.75)'; ctx.lineWidth=1.5*sc; ctx.stroke();
      if(isHL){
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
        ctx.fillStyle='rgba(232,200,64,0.18)'; ctx.fill();
        ctx.strokeStyle='rgba(232,200,64,0.9)'; ctx.lineWidth=3*sc; ctx.stroke();
      }
      const lr=r*0.64, lx=cx+Math.cos(am)*lr, ly=cy+Math.sin(am)*lr;
      ctx.save(); ctx.translate(lx,ly); ctx.rotate(am+Math.PI/2);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if(seg.t==='sp'){
        const lt=q.color==='GOLD'||q.color==='GREY';
        ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=4;
        ctx.fillStyle=lt?'rgba(255,230,100,0.9)':'rgba(200,170,255,0.92)';
        ctx.font='bold '+Math.round(6.5*sc)+'px "DM Mono",monospace';
        ctx.fillText(seg.n,0,0); ctx.shadowBlur=0;
      } else {
        const lt=q.color==='GOLD'||q.color==='GREY';
        ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=5*sc;
        ctx.fillStyle=lt?'#111111':'#ffffff';
        ctx.font='bold '+Math.round(14*sc)+'px "Fraunces",serif';
        const sn=window._spSpinNumAtStart!==undefined?window._spSpinNumAtStart:spSpinNum;
        if(sn===3){
          ctx.font='bold '+Math.round(8*sc)+'px "DM Mono",monospace';
          ctx.fillText(q.color,0,-5*sc);
          ctx.font=Math.round(7*sc)+'px "DM Mono",monospace';
          ctx.fillStyle=lt?'rgba(0,0,0,0.45)':'rgba(255,255,255,0.45)';
          ctx.fillText('= 100',0,6*sc);
        } else {
          const displayVal=spCapVal(seg.v);
          ctx.fillText(displayVal,0,0);
          if(seg.arrow){
            ctx.font=Math.round(10*sc)+'px sans-serif';
            ctx.fillStyle=lt?'rgba(0,0,0,0.5)':'rgba(255,255,255,0.6)';

  });
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=5*sc; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r-3*sc,0,Math.PI*2);
  ctx.strokeStyle='rgba(232,200,64,0.6)'; ctx.lineWidth=2*sc; ctx.stroke();

  const hubGrad=ctx.createRadialGradient(cx-hubR*0.3,cy-hubR*0.3,0,cx,cy,hubR);

  ctx.beginPath(); ctx.arc(cx,cy,hubR,0,Math.PI*2);
  ctx.fillStyle=hubGrad; ctx.fill();
  ctx.strokeStyle='rgba(232,200,64,0.5)'; ctx.lineWidth=2*sc; ctx.stroke();
  const dotR=Math.round(7*sc);
  const dotGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,dotR);
  dotGrad.addColorStop(0,'#fff8b0'); dotGrad.addColorStop(0.4,'#e8c840'); dotGrad.addColorStop(1,'rgba(232,200,64,0)');
  ctx.beginPath(); ctx.arc(cx,cy,dotR,0,Math.PI*2); ctx.fillStyle=dotGrad; ctx.fill();
  if(hlSeg!==undefined&&hlSeg>=0&&hlSeg<SP_ALL.length){

    if(_sn===3){ lbl=(hs.color===spSquad)?'100':'0'; }
    else if(hs.t==='sp'){ lbl=hs.n||''; }

    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(232,200,64,0.9)'; ctx.shadowBlur=18*sc;
    ctx.fillStyle='#ffe060'; ctx.font='bold '+Math.round(22*sc)+'px "Fraunces",serif';
    ctx.fillText(lbl,cx,cy); ctx.restore();
  }
  const pw=typeof spPointerWobble!=='undefined'?spPointerWobble:0;

  const pL={x:cx+Math.cos(pA+Math.PI/2)*6*sc+Math.cos(pA)*pBase,y:cy+Math.sin(pA+Math.PI/2)*6*sc+Math.sin(pA)*pBase};
  const pR={x:cx+Math.cos(pA-Math.PI/2)*6*sc+Math.cos(pA)*pBase,y:cy+Math.sin(pA-Math.PI/2)*6*sc+Math.sin(pA)*pBase};

let spPointerWobble=0;

// ── SPIN ────────────────────────────────────
function sDoSpin(){
  if(spSpinning) return;
  if(!spSquad) return; // must select squad first
  spSquadLocked=true; // lock squad for this user's session
  SP_QUADS=SP_QUADS_BY_SPIN[Math.min(spSpinNum,3)]; spRebuildAll();
  window._spSpinNumAtStart=spSpinNum; // snapshot for consistent display+scoring
  spUpdSquadBtns();
  spSetIntensity(spSpinNum+1); // ramp up background intensity each spin
  spInitAudio();
  spSpinning=true;
  spSetBtns(false,false,false);
  document.getElementById('sSaveArea').style.display='none';
  spSetResult('—','Spinning\u2026','');
  spSetChoiceHint('');
  const cv=document.getElementById('spinCanvas');
  if(cv){ cv.style.boxShadow='0 0 70px rgba(232,200,64,.18),0 0 120px rgba(187,142,245,.08)'; cv.style.cursor='default'; }

  // Spin to a purely random angle — result is read from pointer position after stop.
  // For spin 4, bias toward landing near a quadrant center (1-in-4 color odds).
  let extraRot, landOffset;
  if(spSpinNum===3){
    // Pick a random quadrant center ±5% of a segment width
    const qIdx=Math.floor(Math.random()*4);
    landOffset=SP_QS[qIdx]+0.5*SP_QA+(Math.random()-0.5)*SP_QA*0.08;
  } else {
    landOffset=Math.random()*Math.PI*2;
  }
  // Spin count scales intensity: more rotations and longer duration each spin
  const spinRotations = [5, 7, 9, 12]; // min full rotations per spin number
  const spinDurations = [3000, 3500, 4000, 5000]; // min ms per spin number
  const minRots = spinRotations[Math.min(spSpinNum, 3)];
  const minDur  = spinDurations[Math.min(spSpinNum, 3)];

  // Compute a final angle that lands on landOffset, with enough extra rotations
  // spAngle + landOffset = -PI/2  =>  final spAngle = -PI/2 - landOffset
  // Add minRots full rotations on top (negative = clockwise in canvas)
  const a0 = spAngle;
  const baseTarget = -Math.PI/2 - landOffset;
  // Normalize baseTarget so it's always less than a0 (we always spin forward/clockwise)
  let finalTarget = baseTarget;
  while(finalTarget > a0) finalTarget -= Math.PI*2;
  // Now ensure we travel at least minRots full rotations from a0
  const minTravel = minRots * Math.PI * 2;
  while((a0 - finalTarget) < minTravel) finalTarget -= Math.PI*2;
  // Add a random extra 0-2 rotations for variety
  finalTarget -= Math.floor(Math.random()*3) * Math.PI*2;
  const delta = finalTarget - a0;
  const dur = minDur + Math.random()*1500, t0=performance.now();
  // Ease: faster spins feel more intense on later rounds
  const easeExp = spSpinNum===3 ? 4 : 3;
  const ease = t => 1-Math.pow(1-t, easeExp);
  const mc=document.getElementById('spinCanvas'),tc=document.getElementById('spinTVCanvas');
  const mCtx=mc?mc.getContext('2d'):null;
  const tvVisible=document.getElementById('spinTV')&&document.getElementById('spinTV').style.display!=='none';
  const tCtx=(tc&&tvVisible)?tc.getContext('2d'):null;
  spLastTickAngle=spAngle;
  function fr(now){
    const t=Math.min((now-t0)/dur,1);
    spAngle=a0+delta*ease(t);
    if(mCtx) spDrawWheel(mCtx,spAngle,380);
    if(spTVOpen&&tCtx) spDrawWheel(tCtx,spAngle,420);
    const spSwept=Math.abs(spAngle-spLastTickAngle);
    if(spSwept>=(Math.PI*2)/24){
      spLastTickAngle=spAngle;
      const speed=1-t,intensity=Math.min(1,speed*2.5);
      if(intensity>0.02){
        spPlayTick(intensity);
        const tf=document.getElementById('spinTickFlash');
        if(tf){tf.style.background='rgba(232,200,64,'+intensity*.07+')';tf.style.opacity='1';setTimeout(()=>{if(tf)tf.style.opacity='0';},80);}
        if(speed<0.14){
          spPointerWobble=(Math.random()-.5)*0.09;
          setTimeout(()=>{spPointerWobble=0;},100);
        }
      }
    }
    if(t<1){ spRaf=requestAnimationFrame(fr); }
    else {
      spAngle=a0+delta;
      spPointerWobble=0;
      if(mCtx) spDrawWheel(mCtx,spAngle,380);
      if(spTVOpen&&tCtx) spDrawWheel(tCtx,spAngle,420);
      spSpinning=false;
      if(cv) cv.style.cursor='pointer';
      // Read which segment is actually under the pointer
      const landed=spSegAtPointer();
      if(!landed){ spLand({t:'sp',n:'NONE',v:0,color:'BLACK'}); return; }
      if(landed.li>=0&&mCtx) spDrawWheel(mCtx,spAngle,380,landed.li);
      if(spTVOpen&&tCtx) spDrawWheel(tCtx,spAngle,420,landed.li);
      spLand(landed.seg);
    }
  }
  // ── BROADCAST spin for remote TV (saved via Apps Script, same app_data blob) ──
  if(!D.spinState) D.spinState={};
  D.spinState={id:Date.now(),squad:spSquad,spinNum:spSpinNum,a0,delta,dur,easeExp,startedAt:Date.now(),result:null,quadsIdx:Math.min(spSpinNum,3)};
  _lastSaveId=SESSION_ID+'-spin-'+Date.now(); D._saveId=_lastSaveId;
  sb.from('app_data').upsert({key:'coc',value:D,updated_at:new Date().toISOString()}).then(()=>{});

  spRaf=requestAnimationFrame(fr);
}

// Read which segment the pointer (-PI/2) is currently over
function spSegAtPointer(){
  const ptr=-Math.PI/2;
  for(let qi=0;qi<SP_QUADS.length;qi++){
    let rel=((ptr-SP_QS[qi]-spAngle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    if(rel>=0&&rel<SP_QA){
      const frac=rel/SP_QA;
      const segs=SP_QUADS[qi].segs;
      for(let si=0;si<segs.length;si++){
        if(frac>=segs[si].sf&&frac<segs[si].ef){
          let li=0;
          for(let q2=0;q2<qi;q2++) li+=SP_QUADS[q2].segs.length;
          li+=si;
          return {seg:{...segs[si],color:SP_QUADS[qi].color,qi},li};
        }
      }
    }
  }
  return null;
}

function spLand(seg){
  const isSpin4=spSpinNum===3;
  const cv=document.getElementById('spinCanvas');

  if(seg.t==='sp'){
    if(seg.n==='GIVE'){
      // GIVE only active on spins 2 & 3 (spSpinNum 1 or 2)
      if(spSpinNum===1||spSpinNum===2){
        const givePts=spCapVal(seg.v);
        window._spGivePts=givePts; // captured for spConfirmGive
        spPlayLand('earn');
        if(cv) cv.style.boxShadow='0 0 50px rgba(232,160,32,.3)';
        spSetResult('GIVE \u2014 '+givePts+' pts','Choose a squad to give '+givePts+' points to!','give');
        spShowGivePicker();
      } else {
        window._spGivePts=0;
        spPlayLand('zero');
        if(cv) cv.style.boxShadow='0 0 50px rgba(248,113,113,.2)';
        spSetResult('GIVE \u2014 0 pts','GIVE only applies on spins 2 & 3. No points.','zero');
        spPipDone();setTimeout(spShowSave,1500);
      }
      return;
    } else if(seg.n==='NONE'||seg.n==='ZERO'){
      spPlayLand('zero');
      if(cv) cv.style.boxShadow='0 0 50px rgba(248,113,113,.2)';
      spSetResult(seg.n+' \u2014 0 pts','No points. Spin over.','zero');
      spPipDone();setTimeout(spShowSave,1500);
    } else if(seg.n==='AUTO'){
      spPlayLand('zero');
      spSetResult('AUTO \u2014 0 pts','No points. Advance to next spin!','auto');
      spPipDone();
      if(spSpinNum<3){ spSpinNum++; spUpdPips(); SP_QUADS=SP_QUADS_BY_SPIN[Math.min(spSpinNum,3)]; spRebuildAll(); }
      else { setTimeout(spShowSave,1500); return; }
      setTimeout(sDoSpin,1800);return;
    } else if(seg.n==='LOYALTY'){
      // LOYALTY only active on spins 2 & 3 (spSpinNum 1 or 2)
      if(spSpinNum===1||spSpinNum===2){
        const match=seg.color===spSquad,pts=match?spCapVal(seg.v):0;
        if(match){spBanked+=pts;spUpdBanked();}
        if(match) spPlayLand('earn'); else spPlayLand('zero');
        if(cv) cv.style.boxShadow=match?'0 0 65px rgba(74,222,128,.25)':'0 0 50px rgba(248,113,113,.2)';
        spSetResult('LOYALTY \u2014 '+(match?'+'+pts+' pts':'0 pts'),match?'Your squad! +'+pts+' pts.':'Not your squad. 0 points.',match?'earn':'zero');
      } else {
        spPlayLand('zero');
        if(cv) cv.style.boxShadow='0 0 50px rgba(248,113,113,.2)';
        spSetResult('LOYALTY \u2014 0 pts','LOYALTY only applies on spins 2 & 3. No points.','zero');
      }
      spPipDone();setTimeout(spShowSave,1500);
    }
  } else {
    // Spin 4 handled above — only spins 1-3 reach here
    const pts=spCapVal(seg.v);
    if(pts>0){spBanked+=pts;spUpdBanked();}
    if(seg.arrow){
      // THE TEMPTATION
      spPlayLand('earn');
      if(cv) cv.style.boxShadow='0 0 65px rgba(74,222,128,.25)';
      spSetResult('+'+pts+' pts \u2192','Bank it safe\u2026 or risk it for more?','choice');
      spSetChoiceHint('Spin '+(spSpinNum+2)+' could win up to '+SP_SPIN_MAX[spSpinNum+1]+' pts \u2014 if you dare.');
      const rc=document.getElementById('sResultCard');
      if(rc) rc.classList.add('sp-choice-card');
      const bb=document.getElementById('sBankBtn'),rb=document.getElementById('sRiskBtn');
      if(bb) bb.classList.add('sp-shimmer-btn');
      if(rb) rb.classList.add('sp-shimmer-btn');
      spSetBtns(false,true,true);
    } else {
      spPlayLand('earn');
      if(cv) cv.style.boxShadow='0 0 65px rgba(74,222,128,.2)';
      spSetResult('+'+pts+' pts','Points earned. Spin complete.','earn');
      spPipDone();setTimeout(spShowSave,1500);
    }
  }
  spTVResult();
  // Broadcast result for remote TV (saved via Apps Script, same app_data blob)
  if(D.spinState){
    D.spinState.result={
      label:document.getElementById('sResultVal')?document.getElementById('sResultVal').textContent:'',
      sub:document.getElementById('sResultSub')?document.getElementById('sResultSub').textContent:'',
      finalAngle:spAngle,
    };
    _lastSaveId=SESSION_ID+'-res-'+Date.now(); D._saveId=_lastSaveId;
    sb.from('app_data').upsert({key:'coc',value:D,updated_at:new Date().toISOString()}).then(()=>{});
  }
}

function sDoRisk(){

async function spConfirmGive(targetSq){
  const box=document.getElementById('sGiveBox');if(box)box.style.display='none';
  const nm=SP_SQNAME[targetSq];
  const givePts=window._spGivePts||spCapVal(50); // use captured value from landing
  const label='Wheel GIVE — '+nm+' Squad (+'+givePts+' pts)';
  const pts={};SQUADS.forEach(s=>pts[s]=0);pts[targetSq]=givePts;
  if(!D.nextId)D.nextId=100;if(!Array.isArray(D.events))D.events=[];
  D.events.push({id:D.nextId++,name:label,type:'event',date:new Date().toISOString().split('T')[0],note:'Wheel GIVE',pts});
  D.history.unshift({type:'event',name:label,pts,time:new Date().toISOString()});
  logActivity('Wheel GIVE: +'+givePts+' to '+targetSq);
  await save();renderAll();
  sSetResult('GIVE → '+nm+' +'+givePts+' pts',givePts+' points given to '+nm+' Squad — saved!','earn');
  spPipDone();
  setTimeout(spShowSave,1200);
}
async function sSavePoints(){
  const nm=SP_SQNAME[spSquad];
  const label=document.getElementById('sEvtLabel').value.trim()||'Wheel \u2014 '+nm+' Squad';
  const pts={};SQUADS.forEach(s=>pts[s]=0);if(spBanked>0) pts[spSquad]=spBanked;
  if(!D.nextId) D.nextId=100;if(!Array.isArray(D.events)) D.events=[];
  D.events.push({id:D.nextId++,name:label,type:'event',date:new Date().toISOString().split('T')[0],note:'Wheel spin',pts});
  D.history.unshift({type:'event',name:label,pts,time:new Date().toISOString()});
  logActivity('Wheel spin: +'+spBanked+' to '+spSquad);
  await save();renderAll();
  flash('sSaveOk');
  if(spBanked>0) showToast('+'+spBanked+' pts saved for '+nm+' Squad 🎉','earn','⚡');
  spLog.unshift({sq:spSquad,pts:spBanked,nm});spSessTotal+=spBanked;
  const sb=document.getElementById('sSessionBadge');if(sb) sb.textContent='session: '+spSessTotal+' pts';
  spRenderLog();spTVSync();
  // Reset for next person — wheel stays where it is
  spBanked=0;spSpinNum=0;spUpdBanked();spUpdPips();
  document.getElementById('sSaveArea').style.display='none';
  const cv=document.getElementById('spinCanvas');if(cv) cv.style.boxShadow='0 0 40px rgba(187,142,245,.1)';
  spSetResult('\u2713 Saved!','Points added to tracker. Ready for next spin.','earn');
}
