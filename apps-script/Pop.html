<style>
/* ── Pop: the shared "game-day poster" layer (event pages, Mayhem Week, My Squad) ──────────

/* Squad skins: once a student opens My Squad (or a General opens HQ), the site takes on their

  border: 1px solid color-mix(in srgb, var(--pop-gold) 28%, transparent); box-shadow: 0 20px 60px -30px color-mix(in srgb, var(--pop-purple) 70%, transparent); margin-bottom: 24px; }

.pop-bento > .card:first-child { grid-row: span 1; background: linear-gradient(150deg, color-mix(in srgb, var(--pop-gold) 18%, transparent), color-mix(in srgb, var(--pop-purple) 12%, transparent)) !important; }
.pop-bento > .card [id$="Date"], .pop-bento > .card [id$="Location"], .pop-bento > .card [id$="Format"], .pop-bento > .card [id$="EventCount"] { font-family: 'Fraunces', serif !important; font-size: 19px !important; font-weight: 700; color: var(--pop-ink) !important; line-height: 1.25; }

/* Mayhem Week as a trail: five stops joined by a dashed path */
.pop-trail { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding-top: 26px; }
.pop-trail::before { content: ''; position: absolute; left: 6%; right: 6%; top: 9px; border-top: 3px dashed color-mix(in srgb, var(--pop-gold) 45%, transparent); }
.pop-stop { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 14px 14px; transition: transform .25s cubic-bezier(.22,1,.36,1), border-color .25s; }
.pop-stop::before { content: ''; position: absolute; top: -24px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #14082a; border: 3px solid var(--pop-gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pop-gold) 12%, transparent); }
.pop-stop:last-child { border-color: color-mix(in srgb, var(--pop-gold) 50%, transparent); background: linear-gradient(170deg, color-mix(in srgb, var(--pop-gold) 12%, transparent), var(--surface) 60%); }
.pop-stop:last-child::before { background: var(--pop-gold); }
.pop-stop:hover { transform: translateY(-4px); border-color: rgba(187,142,245,.6); }

@media (max-width: 900px) {
  .pop-trail { grid-template-columns: 1fr; padding-top: 0; padding-left: 28px; }

}

.pop-race { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; }

.pop-card:hover { transform: translateY(-4px) rotate(-.4deg); border-color: color-mix(in srgb, var(--pop-gold) 50%, transparent); box-shadow: 0 18px 40px -22px color-mix(in srgb, var(--pop-gold) 55%, transparent); }

.pop-card .rules { position: relative; font-size: 13.5px; color: var(--text2); line-height: 1.6; margin-bottom: 12px; }
.pop-card .pts { position: relative; display: inline-block; max-width: 100%; font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.45; color: #1a0b2e; background: var(--pop-gold); padding: 5px 10px; border-radius: 10px; font-weight: 700; }

.pop-ticket .main { padding: 22px 24px; }

.pop-ticket .stub::before, .pop-ticket .stub::after { content: ''; position: absolute; left: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg, #09010f); }

.pop-ticket .admit { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--pop-gold); }

.pop-ticket .final em { display: block; font-style: normal; font-size: 12px; color: var(--pop-gold-soft); font-weight: 700; margin-top: 3px; }
@media (max-width: 700px) { .pop-ticket { grid-template-columns: 1fr; } .pop-ticket .stub { border-left: 0; border-top: 2px dashed color-mix(in srgb, var(--pop-gold) 45%, transparent); } .pop-ticket .stub::before, .pop-ticket .stub::after { display: none; } }

/* Home: contour hero and leaderboard cards with squad glows; the visitor's own squad (once

#home-hero-section { position: relative; isolation: isolate; }
#home-hero-section::before { content: ''; position: absolute; inset: -20px -16px auto; height: 100%; z-index: -1; background: var(--pop-topo) center/640px auto repeat; opacity: .8; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); pointer-events: none; }
.hero-sq-card { position: relative; transition: transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s; }
.hero-sq-card:hover { transform: translateY(-3px); }
.hero-sq-card[data-sq="BLACK"] { box-shadow: inset 0 3px 0 #c5c9d1; } .hero-sq-card[data-sq="GOLD"] { box-shadow: inset 0 3px 0 #ffe100; }

html[data-squad="BLACK"] .hero-sq-card[data-sq="BLACK"], html[data-squad="GOLD"] .hero-sq-card[data-sq="GOLD"], html[data-squad="GREY"] .hero-sq-card[data-sq="GREY"], html[data-squad="PURPLE"] .hero-sq-card[data-sq="PURPLE"] {

  background: radial-gradient(110% 130% at 100% 0%, color-mix(in srgb, var(--squad, #bb8ef5) 30%, transparent), transparent 60%), var(--pop-topo) center/600px auto repeat, #14082a; }

#mySquadApp .ms-badge:not(.locked):nth-child(2)::after { animation-delay: .12s; } #mySquadApp .ms-badge:not(.locked):nth-child(3)::after { animation-delay: .24s; }

}
@keyframes popGrow { from { transform: scaleX(0); } }

:is(#tvView, body.light-mode) [style*="color:#c5c9d1"]:not([style*="background:#c5c9d1"]), :is(#tvView, body.light-mode) [style*="color:#b8bcc6"]:not([style*="background:#b8bcc6"]) { color: #1f2430 !important; }
:is(#tvView, body.light-mode) [style*="color:#99a8bb"]:not([style*="background:#99a8bb"]), :is(#tvView, body.light-mode) [style*="color:#8899aa"]:not([style*="background:#8899aa"]) { color: #4b5b70 !important; }

:is(#tvView, body.light-mode) [style*="color:#bb8ef5"]:not([style*="background:#bb8ef5"]) { color: #6d28d9 !important; }

/* Keyboard users can see where they are (the site had no focus ring). */
.btn:focus-visible, .btn-submit:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {

<script>
/* Pop helpers: a live countdown and count-up numbers. Pages call them after they render. */
(function () {
  // "Friday, March 19, 2027" (or any date the browser can read) → a ticking countdown.
  var timers = {};
  window.popCountdown = function (el, dateText) {
    if (!el) return;
    clearInterval(timers[el.id]);
    var target = new Date(String(dateText || '').replace(/^[A-Za-z]+,\s*/, ''));
    if (isNaN(target)) { el.innerHTML = ''; return; }
    target.setHours(7, 50, 0, 0); // the school day starts
    var tick = function () {
      var ms = target - new Date();
      if (ms <= 0) { el.innerHTML = ms > -86400000 ? '<span class="live">It\'s game day!</span>' : ''; clearInterval(timers[el.id]); return; }
      var d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
      el.innerHTML = [[d, d === 1 ? 'day' : 'days'], [h, 'hours'], [m, 'min']].map(function (u) {
        return '<div class="u"><div class="n">' + u[0] + '</div><div class="l">' + u[1] + '</div></div>';
      }).join('');
    };
    tick();
    timers[el.id] = setInterval(tick, 30000);
  };
  // Squad skin: remembered on this device; '' clears it. Applied at once on load.
  window.popSkin = function (squad) {
    var sq = String(squad || '').toUpperCase().replace('GRAY', 'GREY');
    if (['BLACK', 'GOLD', 'GREY', 'PURPLE'].indexOf(sq) < 0) sq = '';
    if (sq) document.documentElement.setAttribute('data-squad', sq); else document.documentElement.removeAttribute('data-squad');
    try { if (sq) localStorage.setItem('clash-skin', sq); else localStorage.removeItem('clash-skin'); } catch (e) {}
  };
  try { var saved = localStorage.getItem('clash-skin'); if (saved) document.documentElement.setAttribute('data-squad', saved); } catch (e) {}
  // Numbers with data-count="123" count up once when they appear (skipped for reduced motion).
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.popCountUp = function (root) {
    if (reduce || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        io.unobserve(en.target);
        var el = en.target, end = Number(el.getAttribute('data-count')) || 0, t0 = performance.now();
        var step = function (t) { var k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 4); el.textContent = Math.round(end * e).toLocaleString(); if (k < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      });
    });
    (root || document).querySelectorAll('[data-count]').forEach(function (el) { io.observe(el); });
  };
})();
