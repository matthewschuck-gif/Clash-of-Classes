<script>
(function () {
  var D = null, tab = 'me', look = null, preview = null; // preview = { id, token } for staff
  var BLANK = { fur: 0, eyes: 0, mood: 0, hat: 0, accent: 0 };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { s = String(s || ''); return s.charAt(0) + s.slice(1).toLowerCase(); }
  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, no) {
      google.script.run.withSuccessHandler(function (r) { ok(typeof r === 'string' ? JSON.parse(r) : r); }).withFailureHandler(no)[fn].apply(null, args);
    });
  }
  function who() { return preview ? [preview.id, preview.token] : []; }
  function msg(e) { return String(e && e.message || e).replace(/^Exception:\s{0,}/, '').replace(/^(SIGN_IN|NOT_FOUND|CLOSED):\s{0,}/, ''); }

  // Anonymous page opens (22_Week.gs), once per tab per visit.
  var tracked = {};
  function track(t) { if (tracked[t]) return; tracked[t] = 1; try { google.script.run.clashTrack('me-' + t); } catch (e) {} }
  function load() {
    track('me');
    run.apply(null, ['clashMe'].concat(who())).then(function (d) { D = d; look = Object.assign({}, BLANK, d.look || {}); if (window.popSkin) popSkin(d.me.squad); render(); var evolving = !D.preview && maybeEvolve();
      if (window.CliffTour && D.tour) CliffTour.init(D.tour, { noAuto: evolving || D.preview, delay: 1200, go: function (name) { if (tab !== name) { tab = name; render(); } } }); })
      .catch(function (e) {
        var m = msg(e), raw = String(e && e.message), signin = /SIGN_IN|NOT_FOUND/.test(raw), closed = /CLOSED/.test(raw);
        $('me').innerHTML = '<div class="me-card me-err">' + (closed ? '<img src="https:\/\/raw.githubusercontent.com/matthewschuck-gif/Clash-of-Classes/ready-to-go-live/assets/cliff.png" alt="Cliff, the Mountaineer" style="height:180px;display:block;margin:0 auto 6px">' : '') +
          '<h2>' + (closed ? 'The trail is resting' : signin ? 'Almost there' : 'Something went wrong') + '</h2><p class="me-sub">' + esc(m) + '</p>' +
          '<details style="margin-top:18px;color:#b09ec8"><summary style="cursor:pointer">Staff: preview a student</summary><div class="me-form">' +
          '<input id="pv800" inputmode="numeric" placeholder="Student 800#" aria-label="Student 800 number"><input id="pvPw" type="password" placeholder="Clash admin password" aria-label="Clash admin password">' +
          '<button class="btn btn-purple" id="pvGo">Preview</button></div>' +
          '<p class="me-sub" style="margin:10px 0 4px">No 800#? See a made-up sample student on a squad (nothing saves):</p><div class="me-form">' +
          '<select id="pvSq" aria-label="Squad"><option value="BLACK">Black</option><option value="GOLD">Gold</option><option value="GREY">Grey</option><option value="PURPLE">Purple</option></select>' +
          '<button class="btn" id="pvSample">Sample student</button></div><p class="me-sub" id="pvErr"></p></details></div>';
        var staffPreview = function (asId) {
          $('pvErr').textContent = 'Checking…';
          run('clashLogin', $('pvPw').value).then(function (r) { preview = { id: asId(), token: r.token }; load(); }).catch(function (x) { $('pvErr').textContent = msg(x); });
        };
        $('pvGo').onclick = function () { staffPreview(function () { return $('pv800').value; }); };
        $('pvSample').onclick = function () { staffPreview(function () { return 'sample-' + $('pvSq').value; }); };
      });
  }

  function animal() { return String((D.mascot && D.mascot.animal) || 'mascot').toLowerCase(); }
  // Cliff, the Mountaineer, says the most useful thing first.
  function cliffLine() {
    var st = D.standing || {}, c = D.creature || {};
    if (c.choices && Object.keys(c.choices).length) return 'You evolved! Pick a boost for your ' + animal() + ' in the Me tab.';
    if (c.next && c.next.need <= 10) return 'Only ' + c.next.need + ' LRG points until your ' + animal() + ' evolves!';
    if (st.frozen) return st.frozen.kind === 'Fun' ? 'Ice breaker time! Push our luck!' : 'We thaw this one together.';
    if (D.tickets.some(function (t) { return t.status === 'Completed' && t.completed === new Date().toISOString().slice(0, 10); })) return 'Ticket done! That one counts for all of us.';
    if (st.place === 1) return 'Top of the mountain. Let\'s stay here!';
    return 'Every point moves us up the mountain.';
  }
  function cliffName() { return (D && D.cliff && D.cliff.name) || 'Cliff'; }
  function cliffSay(text) {
    return '<div class="me-guide"><img src="' + esc(D.cliff.image) + '" alt="' + esc(cliffName()) + ', the Mountaineer"><div class="me-say"><b>' + esc(cliffName()) + '</b>' + text + '</div></div>';
  }
  function art(stage) { var c = D.creature, a = c.art[(stage || c.show) - 1]; return a.v[c.version] || a.v[1]; }
  function wornHtml() {
    var worn = (D.creature.gear || []).filter(function (g) { return g.worn && g.image; });
    return worn.length ? '<div class="me-worn" aria-label="Gear: ' + esc(worn.map(function (g) { return g.gear; }).join(', ')) + '">' + worn.map(function (g) { return '<img src="' + esc(g.image) + '" alt="" loading="lazy">'; }).join('') + '</div>' : '';
  }
  function creatureImg(stage, label) {
    var c = D.creature, st = stage || c.show;
    return '<div class="me-cr" style="' + frameCss() + '"><img src="' + esc(art(st)) + '" alt="Your ' + esc(animal()) + ', ' + esc(c.names[st - 1]) + ' form" loading="lazy">' + (label ? '<span class="stg">' + esc(c.names[st - 1]) + '</span>' + wornHtml() : '') + '</div>';
  }
  // Perk looks: a frame's glow and a scene's background.
  var SCENES = {
    night: 'radial-gradient(110% 130% at 100% 0%, color-mix(in srgb, var(--squad, #bb8ef5) 30%, transparent), transparent 60%), #14082a',
    sunrise: 'radial-gradient(120% 90% at 20% 110%, rgba(255,170,90,.55), transparent 60%), linear-gradient(180deg, #3b1466, #7a2f6b 70%, #c45a4a)',
    forest: 'radial-gradient(100% 80% at 50% 120%, rgba(60,140,90,.5), transparent 65%), linear-gradient(180deg, #0f1f24, #133628)',
    aurora: 'radial-gradient(80% 60% at 30% 0%, rgba(80,255,180,.35), transparent 70%), radial-gradient(70% 60% at 80% 10%, rgba(150,110,255,.45), transparent 70%), #0b0a24'
  };
  function equipped(kind) { var p = D.creature.perks; var name = p.equipped[kind]; return name ? p.list.filter(function (x) { return x.perk === name; })[0] : null; }
  function frameCss() {
    var f = equipped('frame'); if (!f) return '';
    var v = f.value.toLowerCase();
    if (v === 'aurora') return 'box-shadow:0 0 0 3px #7dffc4,0 0 0 6px #9b7bff,0 0 36px rgba(125,255,196,.55)';
    var c = v === 'squad' || !v ? 'var(--squad, #bb8ef5)' : /^#[0-9a-f]{3,8}$/i.test(v) ? v : 'var(--squad, #bb8ef5)';
    return 'box-shadow:0 0 0 4px ' + c + ',0 0 32px ' + c;
  }
  function sceneCss() {
    var sc = equipped('scene'); if (!sc) return '';
    if (/^https:\/[/]/i.test(sc.value)) return 'background:linear-gradient(rgba(13,5,24,.55),rgba(13,5,24,.55)),url(' + JSON.stringify(sc.value) + ') center/cover';
    return SCENES[sc.value.toLowerCase()] ? 'background:' + SCENES[sc.value.toLowerCase()] : '';
  }
  function perksHtml() {
    var p = D.creature.perks; if (!p.list.length) return '';
    var row = function (kind, label) {
      var list = p.list.filter(function (x) { return x.kind === kind; }); if (!list.length) return '';
      return '<div class="me-perk-row"><b>' + label + '</b><div class="me-chips">' + list.map(function (x) {
        var sw = kind === 'frame' ? '<i style="background:' + (x.value.toLowerCase() === 'aurora' ? 'linear-gradient(90deg,#7dffc4,#9b7bff)' : /^#/.test(x.value) ? esc(x.value) : 'var(--squad,#bb8ef5)') + '"></i>' : '';
        return x.open ? '<button class="me-chip craft-press" data-perk="' + esc(x.perk) + '" aria-pressed="' + (p.equipped[kind] === x.perk) + '" title="' + esc(x.text) + '">' + sw + esc(x.perk) + '</button>'
          : '<span class="me-chip locked" title="' + esc(x.text) + '">🔒 ' + esc(x.perk) + '</span>';
      }).join('') + '</div></div>';
    };
    var rewards = p.list.filter(function (x) { return x.kind === 'reward'; }).map(function (x) {
      return '<div class="me-reward' + (x.open ? '' : ' locked') + '">' + (x.open ? '🎁 <b>' + esc(x.perk) + '</b>: ' + esc(x.value || x.text) : '🔒 <b>' + esc(x.perk) + '</b>: ' + esc(x.text)) + '</div>';
    }).join('');
    return '<h3 style="font-family:Fraunces,serif;margin:16px 0 6px">Perks</h3><p class="me-sub" style="margin-bottom:8px">Unlock them as you climb. Tap one to wear it, tap again to take it off.</p>' +
      '<div class="me-perks">' + row('title', 'Title') + row('frame', 'Frame') + row('scene', 'Scene') + (rewards ? '<div class="me-perk-row"><b>Rewards</b><div class="me-perks">' + rewards + '</div></div>' : '') + '</div>';
  }

  // Evolving! Once per new stage, on this device.
  function maybeEvolve() {
    var c = D.creature, key = 'clash-stage-' + D.me.id, seen = 0;
    try { seen = Number(localStorage.getItem(key)) || 0; localStorage.setItem(key, c.stage); } catch (e) { return false; }
    if (c.stage <= 1 || seen >= c.stage) return false;
    var from = Math.max(1, seen || c.stage - 1), el = document.createElement('div');
    el.className = 'me-evolve'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Your creature evolved');
    el.innerHTML = '<div class="me-evolve-box"><div class="me-cr"><img class="from" src="' + esc(art(from)) + '" alt=""><img class="to" src="' + esc(art(c.stage)) + '" alt="Your ' + esc(animal()) + ', ' + esc(c.names[c.stage - 1]) + ' form"></div>' +
      '<h2>Your ' + esc(animal()) + ' evolved!</h2><p class="me-sub">It reached its <b>' + esc(c.names[c.stage - 1]) + '</b> form. ' + (c.choices[c.stage] ? 'Pick a boost to help your squad.' : '') + '</p>' +
      '<button class="btn btn-gold craft-press" id="evoOk">' + (c.choices[c.stage] ? 'Pick my boost' : 'Awesome!') + '</button></div>';
    document.body.appendChild(el);
    var ok = el.querySelector('#evoOk');
    ok.focus();
    ok.onclick = function () { el.remove(); tab = 'me'; render(); var b = $('boosts'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    return true;
  }

  function render() {
    var me = D.me, st = D.standing || {};
    var first = String(me.name || '').split(' ')[0];
    var standing = st.place ? '<b>' + title(st.squad) + '</b> is in <b>' + ['1st', '2nd', '3rd', '4th'][st.place - 1] + ' place</b>' +
      (st.place > 1 ? ', ' + st.behindBy.toLocaleString() + ' behind ' + title(st.ahead) + '.' : ', ' + st.leadBy.toLocaleString() + ' ahead.') : '';
    var tabs = [['me', 'Me'], ['tickets', 'Tickets'], ['squad', 'My Squad'], ['map', 'Map'], ['game', 'Game']];
    $('me').innerHTML = (D.sample ? '<div class="me-card" style="border-color:#fbbf24">Sample student on ' + esc(me.squad.charAt(0) + me.squad.slice(1).toLowerCase()) + ' with made-up numbers. Look around every tab; nothing you change here is saved. <a href="#" id="pvAnother">Another squad</a></div>'
      : D.preview ? '<div class="me-card" style="border-color:#fbbf24">Staff preview of ' + esc(me.name) + '. Changing their creature, picking a boost or keeping tickets here changes their real account.</div>' : '') +
      '<section class="me-hero craft-lit craft-motes" style="' + sceneCss() + '"><div class="me-mascot">' + creatureImg(0, true) + '</div><div>' +
      '<h1>Hi, ' + esc(first) + '!</h1>' + (equipped('title') ? '<div style="font-family:DM Mono,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--pop-gold,#ffe100);margin-top:4px">' + esc(equipped('title').value || equipped('title').perk) + '</div>' : '') + '<div class="me-pills"><span class="me-pill">' + esc(title(me.squad)) + ' Squad</span>' +
      (D.roles || []).map(function (r) { return '<span class="me-pill alt">' + esc(r) + '</span>'; }).join('') + '</div><div class="me-standing">' + standing + '</div></div>' +
      '<div class="me-say"><b>' + esc(cliffName()) + '</b>' + esc(cliffLine()) + '</div><img class="me-cliff" src="' + esc(D.cliff.image) + '" alt="' + esc(cliffName()) + ', the Mountaineer"></section>' +
      '<nav class="me-tabs" role="tablist">' + tabs.map(function (t) { return '<button class="me-tab craft-press" role="tab" data-t="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</nav>' +
      '<div id="meBody">' + ({ me: meTab, tickets: ticketsTab, squad: squadTab, map: mapTab, game: gameTab }[tab])() + '</div>';
    document.querySelectorAll('.me-tab').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); track(tab); render(); }; });
    wire();
  }

  // ── Me: my numbers next to my squad's average, my gear, my mascot ──
  function meTab() {
    var metrics = (D.metrics || []).map(function (m) {
      var you = m.me == null ? 0 : m.me, avg = m.squadAvg == null ? 0 : m.squadAvg, top = Math.max(you, avg, m.pct ? 100 : 1);
      var note = m.me != null && m.squadAvg != null && m.me > m.squadAvg ? 'Above your squad\'s average' : m.me != null && m.squadAvg != null && m.me === m.squadAvg ? 'Right at your squad\'s average' : '';
      return '<div class="me-m"><div class="l">' + esc(m.label) + '</div><div class="v">' + (m.me == null ? '–' : esc(m.me) + (m.pct ? '%' : '')) + '</div>' +
        '<div class="avg">Squad average: ' + (m.squadAvg == null ? '–' : esc(m.squadAvg) + (m.pct ? '%' : '')) + '</div>' +
        '<div class="me-bars" aria-hidden="true"><i class="you" style="width:' + Math.round(100 * you / top) + '%"></i><i class="sq" style="width:' + Math.round(100 * avg / top) + '%"></i></div>' +
        (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
    }).join('');
    var c = D.creature, worn = (c.gear || []).filter(function (g) { return g.worn; }).length;
    var gear = (c.gear || []).map(function (g) {
      if (!g.image) return '<span class="me-chip' + (g.have ? '' : ' locked') + '">' + (g.have ? '✓ ' : '🔒 ') + esc(g.gear) + '</span>';
      return '<button class="me-gt' + (g.have ? ' craft-press' : ' locked') + '" ' + (g.have ? 'data-gear="' + esc(g.gear) + '"' : 'disabled') + ' aria-pressed="' + !!g.worn + '"' +
        ' aria-label="' + esc(g.gear) + (g.have ? (g.worn ? ', worn' : ', earned') : ', locked: ' + esc(g.need)) + '"><img src="' + esc(g.image) + '" alt="" loading="lazy"><span>' + esc(g.gear) + '</span>' +
        (g.have ? '' : '<small>🔒 ' + esc(g.need) + '</small>') + '</button>';
    }).join('');
    var badges = (D.me.badges || []).map(function (b) { return '<span class="ms-badge">' + esc(b) + '</span>'; }).join('') || '<span class="me-sub">Your first badge is one Trait Dough bill away.</span>';
    var stamps = D.passport ? D.passport.stamps.map(function (s) { return '<span class="me-pill ' + (s.done ? '' : 'alt') + '" style="text-transform:none;letter-spacing:0;font-family:inherit">' + (s.done ? '✓ ' : '') + esc(s.label) + '</span>'; }).join(' ') : '';
    return creatureCard() + '<section class="me-card"><h2>You and your squad</h2><p class="me-sub">Your numbers next to the ' + esc(title(D.me.squad)) + ' Squad\'s average. Only you see your own.</p><div class="me-metrics">' + metrics + '</div></section>' +
      '<section class="me-card"><h2>Your ' + esc(animal()) + '\'s gear</h2><p class="me-sub">Gear comes from what you do: bills, summits, shout-outs, streaks, tickets. Tap gear you\'ve earned to wear it (up to ' + c.gearMax + ', wearing ' + worn + ').</p><div class="me-gear-grid">' + gear + '</div><p class="me-sub" id="gearMsg" style="margin-top:8px"></p></section>' +
      '<section class="me-card"><h2>Badges and passport</h2><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">' + badges + '</div>' + stamps + '</section>';
  }

  // ── Your creature: stages, LRG points, version, evolution boosts, perks ──
  function creatureCard() {

      '<div class="me-xp"><div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="LRG points to the next form"><i style="width:' + pct + '%"></i></div>' +
      '<div class="t"><span>' + c.xp + ' LRG points</span><span>' + (c.next ? c.next.at + ' LRG: ' + esc(c.next.name) : 'Final form') + '</span></div></div>' +
      '<div class="me-seg" role="group" aria-label="Version">' + [1, 2, 3].map(function (v) { return '<button data-version="' + v + '" aria-pressed="' + (c.version === v) + '">' + esc(c.versions[v]) + '</button>'; }).join('') + '</div>' +
      '<div id="boosts"><h3 style="font-family:Fraunces,serif;margin:4px 0 6px">Evolution boosts</h3>' + (picked ? '<div class="me-boosts">' + picked + '</div>' : '') + choose + later + '</div>' + perksHtml() + '<p class="me-sub" id="crMsg"></p>' +
      '</div></div></section>';

  function gameTab() {
    var g = D.game || {}, sq = D.me.squad, out = '';
    if (g.monster) out += '<section class="me-card"><h2>The Opponent</h2>' + GameUi.monster(g.monster) + '</section>';
    (g.rounds || []).forEach(function (r) {
      var top = Math.max.apply(null, ['BLACK', 'GOLD', 'GREY', 'PURPLE'].map(function (s) { return r.scores[s]; }).concat([1]));
      out += '<section class="me-card"><h2>Round goal: ' + esc(r.goal) + '</h2><p class="me-sub">' + esc(r.start) + ' to ' + esc(r.end) + ' · 1st +' + r.prizes[0] + ', 2nd +' + r.prizes[1] + ', 3rd +' + r.prizes[2] + '</p><div class="me-rg">' +
        ['BLACK', 'GOLD', 'GREY', 'PURPLE'].sort(function (a, b) { return r.scores[b] - r.scores[a]; }).map(function (s) {
          return '<div class="row' + (s === sq ? ' mine' : '') + '"><span>' + title(s) + '</span><i style="width:' + Math.round(100 * r.scores[s] / top) + '%;background:' + GameUi.SQ[s] + '"></i><span>' + r.scores[s] + '</span></div>';
        }).join('') + '</div></section>';
    });
    if (g.streaks && g.streaks[sq]) {
      var s = g.streaks[sq];
      out += '<section class="me-card"><h2>🔥 Hot Streak: ' + s.length + ' day' + (s.length === 1 ? '' : 's') + '</h2><p class="me-sub">Days in a row ' + esc(title(sq)) + ' had the most Daily Poll voters. ' +
        (s.bank ? 'Worth +' + s.bank + ' if your Generals bank it now. Or ride it for more.' : 'Two days in a row starts a streak your Generals can bank.') + ' Vote every morning to keep it going.</p></section>';
    }
    if (g.engine && g.engine.length) {
      var habs = {}; g.engine.forEach(function (p) { (habs[p.habitat] = habs[p.habitat] || []).push(p); });
      out += '<section class="me-card"><h2>Squad engine</h2><p class="me-sub">Powers your squad unlocks for the rest of the year.</p><div class="me-engine">' + Object.keys(habs).map(function (h) {
        return '<div class="me-hab"><b>' + esc(h) + '</b><div class="cards">' + habs[h].map(function (p) {
          var on = p.unlocked[sq];
          return '<div class="me-pw' + (on ? '' : ' locked') + '"><strong>' + (on ? '⚡ ' : '🔒 ') + esc(p.power) + '</strong>' + esc(p.text) + (on ? '' : '<br><em>Unlocks: ' + esc(p.hint || p.rule) + '</em>') + '</div>';
        }).join('') + '</div></div>';
      }).join('') + '</div></section>';
    }
    return out || '<section class="me-card"><p class="me-sub">Nothing running right now. Check back soon.</p></section>';
  }

  function wire() {
    // Sample student: "Another squad" steps to the next squad's sample (same staff sign-in).
    var pa = $('pvAnother');
    if (pa) pa.onclick = function (ev) { ev.preventDefault(); var sq = ['BLACK', 'GOLD', 'GREY', 'PURPLE']; preview.id = 'sample-' + sq[(sq.indexOf(D.me.squad) + 1) % 4]; load(); };
    var saveCreature = function (choice) {
      if ($('crMsg')) $('crMsg').textContent = 'Saving…';
      run.apply(null, ['clashMeSaveCreature', choice].concat(who())).then(function (d) { D = d; render(); }).catch(function (e) { if ($('crMsg')) $('crMsg').textContent = msg(e); });
    };
    document.querySelectorAll('[data-show]').forEach(function (b) { b.onclick = function () { saveCreature({ show: Number(b.getAttribute('data-show')) }); }; });
    document.querySelectorAll('[data-perk]').forEach(function (b) { b.onclick = function () { saveCreature({ perk: b.getAttribute('data-perk') }); }; });
    document.querySelectorAll('[data-version]').forEach(function (b) { b.onclick = function () { if (b.getAttribute('aria-pressed') !== 'true') saveCreature({ version: Number(b.getAttribute('data-version')) }); }; });
    document.querySelectorAll('[data-gear]').forEach(function (b) {
      b.onclick = function () {
        $('gearMsg').textContent = 'Saving…';
        run.apply(null, ['clashMeSaveCreature', { gear: b.getAttribute('data-gear') }].concat(who())).then(function (d) { D = d; render(); }).catch(function (e) { $('gearMsg').textContent = msg(e); });
      };
    });
    document.querySelectorAll('[data-boost]').forEach(function (b) {
      b.onclick = function () {
        var name = b.getAttribute('data-boost');
        if (!confirm('Pick the ' + name + ' boost? It stays for the whole year.')) return;
        $('crMsg').textContent = 'Locking it in…';
        var from = b.getBoundingClientRect();
        run.apply(null, ['clashMePickBoost', Number(b.getAttribute('data-stage')), name].concat(who())).then(function (d) {
          D = d; render(); if (window.craftCelebrate) craftCelebrate({ getBoundingClientRect: function () { return from; } });
        }).catch(function (e) { $('crMsg').textContent = msg(e); });
      };
    });
    if ($('drawT')) $('drawT').onclick = function () {
      $('offer').innerHTML = '<p class="me-sub">Drawing…</p>';
      run.apply(null, ['clashMeDrawTickets'].concat(who())).then(function (r) {
        $('offer').innerHTML = '<h3 style="font-family:Fraunces,serif;margin:16px 0 6px">Pick at least one (up to ' + r.keepUpTo + ')</h3><div class="me-tickets">' +
          r.offer.map(function (t) { return ticket({ ticket: t.ticket, text: t.text, points: t.points, progress: [] }, true); }).join('') +
          '</div><p style="margin-top:12px"><button class="btn btn-gold craft-press" id="keepT" disabled>Keep these</button></p>';
        document.querySelectorAll('[data-pick]').forEach(function (c) {
          var flip = function () {
            var picked = document.querySelectorAll('[data-pick].on').length;
            if (!c.classList.contains('on') && picked >= r.keepUpTo) return;
            c.classList.toggle('on'); c.setAttribute('aria-checked', c.classList.contains('on'));
            $('keepT').disabled = !document.querySelectorAll('[data-pick].on').length;
          };
          c.onclick = flip; c.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
        });
        $('keepT').onclick = function () {
          var names = Array.prototype.map.call(document.querySelectorAll('[data-pick].on'), function (c) { return c.getAttribute('data-pick'); });
          var from = $('keepT').getBoundingClientRect();
          run.apply(null, ['clashMeKeepTickets', names].concat(who())).then(function (d) { D = d; render(); if (window.craftCelebrate) craftCelebrate({ getBoundingClientRect: function () { return from; } }); })
            .catch(function (e) { alert(msg(e)); });
        };
      }).catch(function (e) { $('offer').innerHTML = '<p class="me-sub">' + esc(msg(e)) + '</p>'; });
    };
  }

  load();
})();
</script>
</body>
</html>
