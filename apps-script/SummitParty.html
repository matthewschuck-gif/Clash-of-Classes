<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Mono:wght@500&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  /* Summit Party board. Clash brand: purple #490e6f, gold #ffe100, Fraunces display (the Clash brand face). */
  :root { --bg:#14091f; --panel:#1f1133; --line:#3a2659; --ink:#f7f2ff; --mute:#bfaee0; --gold:#ffe100; --purple:#490e6f;
    --t-start:#ffd23f; --t-trail:#38a3ff; --t-rock:#ff5a4f; --t-cairn:#a66bff; --t-spring:#2fcf7a; --hop:320ms; }
  @media (prefers-reduced-motion: reduce) { :root { --hop:0ms; } }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
  body { background: radial-gradient(1200px 700px at 28% -12%, #3b1a66 0%, transparent 62%), var(--bg); }
  .wrap { min-height:100dvh; display:grid; grid-template-columns: minmax(0,1fr) minmax(280px, 24%); gap:1.8vw; padding:2vh 2vw; align-items:start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; padding:16px; } }
  .head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:1.6vh; }
  .head h1 { margin:0; font-family:Fraunces,Georgia,serif; font-weight:900; font-size:clamp(28px,3.4vw,58px); letter-spacing:-.02em; line-height:1.05; }
  .head .code { margin-left:auto; display:flex; align-items:center; gap:10px; background:var(--panel); border:2px solid var(--gold); border-radius:16px; padding:6px 14px; }
  .head .code span { font-family:'DM Mono',monospace; font-size:clamp(10px,.85vw,13px); color:var(--mute); line-height:1.2; }
  .head .code b { font-family:'DM Mono',monospace; font-weight:500; font-size:clamp(26px,2.8vw,48px); letter-spacing:.18em; color:var(--gold); }

  /* ── The board (shared) ── */
  .table { display:grid; place-items:center; padding:14px; }
  .board { position:relative; width:100%; border-radius:26px; overflow:hidden; box-shadow: 0 0 0 10px #2a173f, 0 0 0 14px #6b3fa0, 0 30px 60px -10px #000c; }
  .board.trail { aspect-ratio: 16 / 10; max-height:80vh; }
  .board.square { aspect-ratio: 1 / 1; width:min(100%, 80vh); }
  .scenery { position:absolute; inset:0; width:100%; height:100%; }
  .tile { position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center; z-index:2; }
  .tile i { line-height:1; }
  .pieces { position:absolute; inset:0; z-index:4; pointer-events:none; }

  /* ── Mountain trail (Candyland style) ── */
  .trail .tile { width:6.6%; aspect-ratio:1; border-radius:22%; border:.35vw solid #fff; box-shadow: 0 .45vw 0 #0005, inset 0 -.5vw 0 #0002; color:#fff; }
  .trail .tile i { font-size:clamp(14px,2.2vw,38px); filter: drop-shadow(0 2px 0 #0003); }
  .trail .tile .n { position:absolute; top:-.45em; left:-.35em; font:800 clamp(9px,.85vw,14px)/1 'DM Sans',sans-serif; background:#fff; color:#2a173f; border-radius:999px; padding:.2em .45em; }
  .trail .tile.start { width:9.5%; border-radius:26%; color:#5e4500; }
  .trail .tile.start .lab { position:absolute; top:-1.9em; white-space:nowrap; font:800 clamp(10px,1vw,17px)/1 'DM Sans',sans-serif; color:#fff; text-shadow:0 2px 0 #0008; letter-spacing:.06em; }
  .trail .tile.short { width:5.4%; border-style:dashed; }
  .trail .shield { position:absolute; left:50%; top:54%; width:17%; transform:translate(-50%,-50%); filter: drop-shadow(0 10px 18px #0009); z-index:1; }

  /* ── Square board (Monopoly style) ── */
  .board.square { background:#dff1e6; }
  .square .tile { background:#fbfdf9; color:#1c2a22; border:2px solid #23402f; border-radius:6px; overflow:hidden; text-align:center; }
  .square .tile .band { position:absolute; left:0; right:0; top:0; height:24%; }
  .square .tile .body { position:relative; display:grid; place-items:center; gap:.15em; padding-top:18%; }
  .square .tile i { font-size:clamp(14px,2.3vw,34px); }
  .square .tile .lab { font:800 clamp(7px,.8vw,13px)/1.05 'DM Sans',sans-serif; text-transform:uppercase; letter-spacing:.02em; }
  .square .tile .n { position:absolute; bottom:3%; right:6%; font:700 clamp(7px,.7vw,11px)/1 'DM Mono',monospace; color:#4c6b58; }
  .square .tile.edge-b, .square .tile.edge-t { width:16.4%; height:18%; }
  /* Top row reads upright: easier on a projector than real board-game upside-down text. */
  .square .tile.edge-t .band { top:auto; bottom:0; }
  .square .tile.edge-l, .square .tile.edge-r { width:18%; height:16.4%; }
  .square .tile.edge-l .band { top:0; bottom:0; left:auto; right:0; width:24%; height:auto; }
  .square .tile.edge-r .band { top:0; bottom:0; right:auto; left:0; width:24%; height:auto; }
  .square .tile.edge-l .body, .square .tile.edge-r .body { padding-top:0; }
  .square .tile.corner { width:18%; height:18%; }
  .square .tile.corner .band { height:100%; opacity:.22; }
  .square .tile.corner .body { padding-top:0; }
  .square .tile.corner i { font-size:clamp(20px,3.6vw,56px); }
  .square .tile.corner .lab { font-size:clamp(9px,1.05vw,17px); }
  .square .tile.short { width:9%; height:9%; border-radius:50%; border-style:dashed; }
  .square .tile.short .band, .square .tile.short .lab { display:none; }
  .square .tile.short .body { padding-top:0; }
  .square .middle { position:absolute; inset:30%; display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0,1fr) auto; gap:4% 6%; place-items:center; z-index:1; }
  .square .middle .title { grid-column: 1 / -1; font-family:Fraunces,serif; font-weight:900; color:var(--purple); font-size:clamp(18px,2.6vw,44px); transform:rotate(-6deg); letter-spacing:-.02em; text-align:center; line-height:1; }
  .square .middle img { grid-column: 1 / -1; height:100%; min-height:0; max-width:70%; object-fit:contain; filter: drop-shadow(0 8px 14px #0005); }
  .deck { width:92%; aspect-ratio: 5 / 3.2; border-radius:10px; display:grid; place-items:center; text-align:center; color:#fff; font:800 clamp(9px,1vw,17px)/1.15 'DM Sans',sans-serif; box-shadow: 4px 4px 0 #fff, 7px 7px 0 #0003, 8px 8px 0 #fff, 11px 11px 0 #0003; }
  .deck i { display:block; font-size:clamp(14px,1.9vw,32px); margin-bottom:4%; }
  .deck.cairn { background:var(--t-cairn); transform:rotate(-12deg); }
  .deck.fork { background:var(--t-spring); transform:rotate(10deg); }

  /* ── Pieces: each squad's evolved My Climb creature on a pawn base ── */
  .piece { position:absolute; width:7.6%; aspect-ratio:1; margin:-5.6% 0 0 -3.8%; transition: left var(--hop) cubic-bezier(.34,1.56,.64,1), top var(--hop) cubic-bezier(.34,1.56,.64,1); }
  .square .piece { width:8.6%; margin:-6.2% 0 0 -4.3%; }
  .piece .face { position:absolute; inset:0; border-radius:50%; border:.3vw solid var(--ring); background:var(--base) var(--focus, center 15%) / 240% no-repeat; box-shadow: 0 .5vw 0 var(--baseDark), 0 1vw 1.4vw #0009; display:grid; place-items:center; color:#fff; font:900 clamp(12px,1.6vw,26px) Fraunces,serif; }
  .piece.turn .face { animation: bob 1.2s ease-in-out infinite; box-shadow: 0 0 0 .3vw var(--gold), 0 .5vw 0 var(--baseDark), 0 1vw 1.4vw #0009; }
  @keyframes bob { 50% { transform: translateY(-14%); } }
  @media (prefers-reduced-motion: reduce) { .piece.turn .face { animation:none; } }
  .flag { position:absolute; z-index:3; font-size:clamp(22px,3vw,48px); color:var(--gold); margin:-3.4% 0 0 -.6%; filter: drop-shadow(0 3px 0 #000a); transition: left .6s, top .6s; }

  .banner { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) scale(.7); opacity:0; pointer-events:none; text-align:center; z-index:6;
    font-family:Fraunces,serif; font-weight:900; font-size:clamp(30px,5vw,86px); color:#fff; text-shadow:0 6px 30px #000c; transition: transform .4s cubic-bezier(.2,1.5,.4,1), opacity .3s; width:86%; }
  .banner.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .banner small { display:block; font-family:'DM Sans',sans-serif; font-weight:700; font-size:.3em; margin-top:.4em; color:#fff; }
  .banner .blogo { display:block; width:max-content; margin:0 auto .2em; padding:.12em .28em; border-radius:.22em; box-shadow:0 6px 24px #0008; }
  .banner .blogo img { display:block; height:1.4em; }
  .closed { display:grid; place-items:center; min-height:60vh; text-align:center; color:var(--mute); font-size:20px; }

  /* ── Side panel ── */
  .side { display:flex; flex-direction:column; gap:1.4vh; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; }
  .card h3 { margin:0 0 8px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); font-weight:500; }
  .round { font-family:Fraunces,serif; font-weight:900; font-size:clamp(22px,2.1vw,36px); }
  .turnline { font-size:clamp(15px,1.25vw,20px); margin-top:4px; line-height:1.35; }
  .auto { color:var(--mute); font-size:.85em; }
  .sq { display:grid; grid-template-columns: clamp(40px,3.4vw,58px) 1fr auto auto; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:clamp(15px,1.25vw,21px); }
  .sq:first-of-type { border-top:0; }
  .logo { aspect-ratio:1; border-radius:12px; display:grid; place-items:center; padding:4px; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .sq b { font-weight:800; }
  .sq .f { font-family:Fraunces,serif; font-weight:900; color:var(--gold); display:flex; align-items:center; gap:3px; }
  .sq .c { font-family:'DM Mono',monospace; color:var(--mute); min-width:4.5ch; text-align:right; }
  .log div { font-size:14px; color:var(--mute); padding:4px 0; border-top:1px solid #ffffff10; }
  .log div:first-child { color:var(--ink); border-top:0; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--mute); margin-top:12px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:20px; height:20px; border-radius:6px; display:inline-grid; place-items:center; color:#fff; font-size:13px; }
  .join { font-size:14px; color:var(--mute); line-height:1.5; }
  .join b { color:var(--ink); font-family:'DM Mono',monospace; }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:999px; padding:9px 15px; }
  .gold { background:var(--gold); color:#1a0b2e; } .ghost { background:#ffffff1a; color:var(--ink); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:end; }
  input, select { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:#0d0618; color:var(--ink); }
  input[data-pw] { width:100%; -webkit-text-security:disc; }
  label.field { font-size:13px; color:var(--mute); display:grid; gap:4px; }
  .msg { font-size:13px; color:#fca5a5; min-height:1em; margin-top:6px; }
  .confetti { position:fixed; top:-20px; width:10px; height:16px; border-radius:3px; pointer-events:none; animation:fall linear forwards; z-index:9; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <div class="head"><h1>Summit Party</h1><div class="code"><span>GAME<br>CODE</span><b id="codeBig">····</b></div></div>
    <div class="table"><div class="board trail" id="box"><div class="banner" id="banner"></div><div class="pieces" id="pieces"></div></div></div>
    <div class="legend" id="legend"></div>
  </main>
  <aside class="side">
    <div class="card"><div class="round" id="round">Summit Party</div><div class="turnline" id="turnline"></div></div>
    <div class="card"><h3>Flags and coins</h3><div id="standings"></div></div>
    <div class="card log"><h3>On the trail</h3><div id="log"></div></div>
    <div class="card"><h3>Play on a Chromebook</h3><div class="join">One Chromebook per squad: open <b>clashofclasses.org/?page=summit-play</b>, type the game code and your 800#. On your squad's turn, tap Roll.</div></div>
    <div class="card" id="staff"></div>
  </aside>
</div>
<script>
(function () {
  var SQ = ['BLACK', 'GOLD', 'GREY', 'PURPLE'];
  var RING = { BLACK: '#e9e3f5', GOLD: '#ffd23f', GREY: '#aab3c2', PURPLE: '#c79bff' };
  var BASE = { BLACK: '#2b2633', GOLD: '#a87b00', GREY: '#5d6673', PURPLE: '#5b1a86' };
  var BASEDARK = { BLACK: '#141118', GOLD: '#5e4500', GREY: '#353b44', PURPLE: '#2f0c47' };
  // Where each creature's face sits in its My Climb picture, so the round piece shows the face.
  var FOCUS = { BLACK: '47% 11%', GOLD: '72% 2%', GREY: '77% 11%', PURPLE: '69% 0%' };
  var ICON = { start: 'ph-tent', trail: 'ph-coins', rock: 'ph-mountains', cairn: 'ph-cards', spring: 'ph-drop' };
  var LABEL = { start: 'Base Camp', trail: 'Trail +3', rock: 'Rockslide -3', cairn: 'Cairn card', spring: 'Spring +2' };
  var S = null, seq = 0, token = '', busy = false, pieces = {}, flagEl = null, drawnLayout = '', drawnCode = '', code = '', LOGOS = {};
  try { code = sessionStorage.getItem('summit-code') || ''; token = sessionStorage.getItem('summit-admin') || ''; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { s = String(s || ''); return s.charAt(0) + s.slice(1).toLowerCase(); }
  function run(fn) { var a = Array.prototype.slice.call(arguments, 1); return new Promise(function (ok, no) { var r = google.script.run.withSuccessHandler(function (t) { ok(JSON.parse(t)); }).withFailureHandler(no); r[fn].apply(r, a); }); }
  function msgOf(e) { return String(e && e.message || e).replace(/^Exception:\s{0,}/, ''); }
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function logo(s, cls) { return LOGOS[s] ? '<span class="' + (cls || 'logo') + '" style="background:' + BASE[s] + '"><img src="' + LOGOS[s] + '" alt="' + esc(title(s)) + ' Squad logo"></span>' : ''; }

  // ── Drawing the board ──
  function trailScenery(b) {
    var ring = b.filter(function (n) { return !n.path; }), d = 'M' + ring.concat([ring[0]]).map(function (n) { return n.x + ' ' + n.y; }).join(' L');
    var h = '<svg class="scenery" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4f8f"/><stop offset=".5" stop-color="#6a9bd4"/><stop offset=".5" stop-color="#4a9a62"/><stop offset="1" stop-color="#2f6f45"/></linearGradient></defs>' +
      '<rect width="100" height="100" fill="url(#sky)"/>' +
      '<polygon points="4,60 28,22 46,58" fill="#46638f"/><polygon points="56,58 74,20 97,60" fill="#46638f"/>' +
      '<polygon points="22,88 50,3 78,88" fill="#6b7fa8"/><polygon points="41,30 50,3 59,30 55,26 51,32 46,25" fill="#f4f7ff"/>' +
      '<ellipse cx="79" cy="51" rx="9" ry="5" fill="#5fc3e8" stroke="#d8f4ff" stroke-width=".5"/>';
    for (var i = 0; i < 30; i++) { var x = (i * 37 + 7) % 100, y = 64 + ((i * 53) % 32); if (x > 24 && x < 76 && y < 86) continue; h += '<polygon points="' + x + ',' + (y - 4.5) + ' ' + (x - 2) + ',' + y + ' ' + (x + 2) + ',' + y + '" fill="#1f5a36"/>'; }
    h += '<path d="' + d + '" fill="none" stroke="#f6e7b8" stroke-width="7.6" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="#c9a352" stroke-width="7.6" stroke-dasharray=".5 2.4" stroke-linejoin="round" opacity=".55"/>';
    b.forEach(function (n) { n.next.forEach(function (to) { var m = b[to]; if (!n.path && !m.path) return; h += '<line x1="' + n.x + '" y1="' + n.y + '" x2="' + m.x + '" y2="' + m.y + '" stroke="#8a5a2b" stroke-width="1.7" stroke-dasharray="1.2 .9" stroke-linecap="round"/>'; }); });
    return h + '</svg>';
  }
  function edgeOf(n) {
    if (n.path) return 'short';
    if ([0, 5, 10, 15].indexOf(n.id) > -1) return 'corner';
    return n.id < 5 ? 'edge-b' : n.id < 10 ? 'edge-l' : n.id < 15 ? 'edge-t' : 'edge-r';
  }
  function drawBoard() {
    var b = S.board, box = $('box'), layout = S.layout || 'trail', h = '';
    box.className = 'board ' + layout;
    box.querySelectorAll('.tile, .scenery, .shield, .middle').forEach(function (el) { el.remove(); });
    if (layout === 'trail') {
      h += trailScenery(b);
      if (S.art && S.art.shield) h += '<img class="shield" src="' + esc(S.art.shield) + '" alt="Clash of Classes 2026-2027 shield">';
      b.forEach(function (n) {
        var tilt = n.type === 'start' ? 0 : (n.id % 2 ? 5 : -5);
        h += '<div class="tile ' + n.type + (n.path ? ' short' : '') + '" style="left:' + n.x + '%;top:' + n.y + '%;background:var(--t-' + n.type + ');transform:translate(-50%,-50%) rotate(' + tilt + 'deg)" title="' + esc(S.spaces[n.type] || n.type) + '">' +
          '<i class="ph-fill ' + ICON[n.type] + '"></i>' + (n.type === 'start' ? '<span class="lab">BASE CAMP</span>' : n.path ? '' : '<span class="n">' + n.id + '</span>') + '</div>';
      });
    } else {
      var lines = '';
      b.forEach(function (n) { n.next.forEach(function (to) { var m = b[to]; if (n.path || m.path) lines += '<line x1="' + n.x + '" y1="' + n.y + '" x2="' + m.x + '" y2="' + m.y + '" stroke="#23402f" stroke-width=".7" stroke-dasharray="1.4 1"/>'; }); });
      h += '<svg class="scenery" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="z-index:1">' + lines + '</svg>';
      h += '<div class="middle"><div class="title">Summit Party</div>' + (S.art && S.art.shield ? '<img src="' + esc(S.art.shield) + '" alt="Clash of Classes 2026-2027 shield">' : '<span></span>') +
        '<div class="deck cairn"><div><i class="ph-fill ph-cards"></i>CAIRN<br>CARDS</div></div><div class="deck fork"><div><i class="ph-fill ph-signpost"></i>TRAIL<br>FORKS</div></div></div>';
      b.forEach(function (n) {
        h += '<div class="tile ' + edgeOf(n) + (n.path ? ' short' : '') + '" style="left:' + n.x + '%;top:' + n.y + '%" title="' + esc(S.spaces[n.type] || n.type) + '">' +
          '<span class="band" style="background:var(--t-' + n.type + ')"></span><span class="body"><i class="ph-fill ' + ICON[n.type] + '" style="color:' + (n.type === 'start' ? '#a87b00' : 'var(--t-' + n.type + ')') + '"></i><span class="lab">' + (n.id === 0 ? 'Base Camp<br>pass it: +2' : esc(LABEL[n.type])) + '</span></span>' + (n.path || n.id === 0 ? '' : '<span class="n">' + n.id + '</span>') + '</div>';
      });
    }
    box.insertAdjacentHTML('afterbegin', h);
    Object.keys(pieces).forEach(function (s) { pieces[s].remove(); }); pieces = {};
    if (flagEl) { flagEl.remove(); flagEl = null; }
    $('legend').innerHTML = ['trail', 'rock', 'cairn', 'spring', 'start'].map(function (k) { return '<span><i class="ph-fill ' + ICON[k] + '" style="background:var(--t-' + k + ')"></i>' + esc(S.spaces[k] || k) + '</span>'; }).join('') +
      '<span><i class="ph-fill ph-flag-pennant" style="background:#3a2659;color:var(--gold)"></i>Summit Flag: pass it with ' + S.flagCost + ' coins to plant one</span>';
    drawnLayout = layout; drawnCode = S.game ? S.game.code : '';
  }
  function spot(nodeId, squad) {
    var n = S.board[nodeId], i = SQ.indexOf(squad), d = S.layout === 'square' ? 3 : 2.6;
    return { x: n.x + (i % 2 ? d : -d), y: n.y + (i < 2 ? -d * .9 : d * .9) };
  }
  function place(squad, nodeId) {
    var t = pieces[squad];
    if (!t) {
      t = document.createElement('div'); t.className = 'piece';
      t.style.setProperty('--ring', RING[squad]); t.style.setProperty('--base', BASE[squad]); t.style.setProperty('--baseDark', BASEDARK[squad]); t.style.setProperty('--focus', FOCUS[squad]);
      var face = document.createElement('div'); face.className = 'face';
      var art = S.art && S.art.pieces && S.art.pieces[squad];
      if (art) face.style.backgroundImage = 'url("' + art + '")'; else face.textContent = squad.charAt(0);
      t.appendChild(face); t.title = title(squad) + ' Squad'; $('pieces').appendChild(t); pieces[squad] = t;
    }
    var p = spot(nodeId, squad); t.style.left = p.x + '%'; t.style.top = p.y + '%';
  }
  function placeFlag(nodeId) {
    if (!flagEl) { flagEl = document.createElement('i'); flagEl.className = 'flag ph-fill ph-flag-pennant'; flagEl.title = 'Summit Flag'; $('pieces').appendChild(flagEl); }

  // ── A new state: animate the last move hop by hop, then update the side ──
