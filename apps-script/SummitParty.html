<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Mono:wght@500&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  /* Summit Party: the squad party board game. Clash brand: purple #490e6f, gold #ffe100, Fraunces display (the Clash brand face). */
  :root { --bg:#14091f; --panel:#1f1133; --line:#3a2659; --ink:#f7f2ff; --mute:#bfaee0; --gold:#ffe100; --purple:#490e6f;
    --t-start:#ffd23f; --t-blue:#2f8fff; --t-red:#ff4d4d; --t-event:#2fcf7a; --t-item:#ff9a1f; --t-villain:#6b2bb8; --t-avalanche:#bfe6ff; --t-shop:#ff6fb5; --t-duel:#e0115f;
    --hop:300ms; }
  @media (prefers-reduced-motion: reduce) { :root { --hop:0ms; } }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
  body { background: radial-gradient(1200px 700px at 28% -12%, #3b1a66 0%, transparent 62%), var(--bg); }
  .wrap { min-height:100dvh; display:grid; grid-template-columns: minmax(0,1fr) minmax(280px, 23%); gap:1.6vw; padding:1.8vh 1.8vw; align-items:start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; padding:16px; } }
  .head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:1.2vh; }
  .head h1 { margin:0; font-family:Fraunces,Georgia,serif; font-weight:900; font-size:clamp(28px,3.2vw,56px); letter-spacing:-.02em; line-height:1.05; }
  .round-pill { font:800 clamp(13px,1.2vw,20px)/1 'DM Sans',sans-serif; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:.55em 1em; }
  .round-pill.final { background:#ff4d4d; border-color:#ff4d4d; color:#fff; }
  .head .code { margin-left:auto; display:flex; align-items:center; gap:10px; background:var(--panel); border:2px solid var(--gold); border-radius:16px; padding:6px 14px; }
  .head .code span { font-family:'DM Mono',monospace; font-size:clamp(10px,.85vw,13px); color:var(--mute); line-height:1.2; }
  .head .code b { font-family:'DM Mono',monospace; font-weight:500; font-size:clamp(26px,2.6vw,46px); letter-spacing:.18em; color:var(--gold); }

  /* ── The board ── */
  .table { display:grid; place-items:center; padding:14px; }
  .board { position:relative; width:100%; border-radius:26px; overflow:hidden; box-shadow: 0 0 0 10px #2a173f, 0 0 0 14px #6b3fa0, 0 30px 60px -10px #000c; }
  .board.trail { aspect-ratio: 16 / 10; max-height:74vh; }
  .scenery { position:absolute; inset:0; width:100%; height:100%; }
  .space { position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center; z-index:2; }
  .space i { line-height:1; }
  .layer { position:absolute; inset:0; z-index:4; pointer-events:none; }

  /* Round party spaces on the island trail */
  .trail .space { width:4.6%; aspect-ratio:1; border-radius:50%; border:.3vw solid #fff; color:#fff; box-shadow: 0 .4vw 0 #0006, inset 0 -.45vw 0 #0003, inset 0 .3vw 0 #fff5; }
  .trail .space i { font-size:clamp(11px,1.6vw,28px); filter: drop-shadow(0 2px 0 #0004); }
  .trail .space .q { font:900 clamp(13px,1.9vw,32px)/1 Fraunces,serif; }
  .trail .space.start, .trail .space.shop { width:7.4%; border-radius:28%; }
  .trail .space.start { color:#5e4500; }
  .trail .space.avalanche { color:#2a4f7a; }
  .trail .space .lab { position:absolute; top:-1.8em; white-space:nowrap; font:800 clamp(9px,.9vw,15px)/1 'DM Sans',sans-serif; color:#fff; text-shadow:0 2px 0 #0009; letter-spacing:.05em; }
  .trail .space.short { width:4%; }
  .frost .space { box-shadow: 0 0 0 .2vw #3b5591, 0 .4vw 0 #0005, inset 0 -.45vw 0 #0003, inset 0 .3vw 0 #fff5; }
  .frost .space .lab { color:#1d2f6e; text-shadow:0 1px 0 #fff; }
  .trail .shield { position:absolute; left:50%; top:53%; width:15%; transform:translate(-50%,-50%); filter: drop-shadow(0 10px 18px #0009); z-index:1; }


  /* Summit Flag: the gold flag that marks where flags are planted */
  .flag { position:absolute; z-index:3; width:6%; aspect-ratio:1; margin:-6.2% 0 0 -3%; display:grid; place-items:center; transition: left .7s, top .7s; }
  .flag i { font-size:clamp(26px,3.4vw,58px); color:var(--gold); filter: drop-shadow(0 3px 0 #000a) drop-shadow(0 0 12px #ffe10099); animation: wave 1.6s ease-in-out infinite; transform-origin: 20% 90%; }
  @keyframes wave { 50% { transform: rotate(-8deg) scale(1.06); } }

  /* Pieces: each squad's evolved My Climb creature */
  .piece { position:absolute; width:6.6%; aspect-ratio:1; margin:-5.2% 0 0 -3.3%; transition: left var(--hop) cubic-bezier(.34,1.56,.64,1), top var(--hop) cubic-bezier(.34,1.56,.64,1); z-index:5; }
  .piece .face { position:absolute; inset:0; border-radius:50%; border:.3vw solid var(--ring); background:var(--base) var(--focus, center 15%) / 240% no-repeat; box-shadow: 0 .5vw 0 var(--baseDark), 0 1vw 1.4vw #0009; display:grid; place-items:center; color:#fff; font:900 clamp(12px,1.6vw,26px) Fraunces,serif; }
  .piece.turn { z-index:6; }
  .piece.turn .face { animation: bob 1.1s ease-in-out infinite; box-shadow: 0 0 0 .3vw var(--gold), 0 .5vw 0 var(--baseDark), 0 1vw 1.4vw #0009; }
  @keyframes bob { 50% { transform: translateY(-14%); } }
  .piece .count, .piece .dice { position:absolute; left:50%; bottom:108%; transform:translateX(-50%); display:grid; place-items:center; font:900 clamp(16px,2.2vw,38px)/1 Fraunces,serif; }
  .piece .count { width:1.6em; height:1.6em; border-radius:50%; background:#fff; color:#2a173f; box-shadow:0 4px 0 #0005; }
  .piece .dice { width:1.9em; height:1.9em; border-radius:22%; background:linear-gradient(#fff6b0,#ffd23f); color:#5e4500; border:3px solid #fff; box-shadow:0 6px 0 #a87b00, 0 10px 20px #0007; }
  .piece .dice.spin { animation: hit .14s ease-in-out infinite alternate; }
  @keyframes hit { to { transform: translateX(-50%) translateY(-10%) rotate(8deg); } }
  @media (prefers-reduced-motion: reduce) { .piece.turn .face, .flag i, .piece .dice.spin { animation:none; } }

  /* Cliff, the host */
  .host { display:flex; align-items:center; gap:12px; margin:0 14px 4px; min-height:clamp(56px,6vw,96px); }
  .host[hidden] { display:none; }
  .host img { width:clamp(56px,6vw,96px); flex:none; filter: drop-shadow(0 8px 12px #0009); }
  .host .bubble { position:relative; flex:1; background:#fff; color:#21122f; font:700 clamp(13px,1.35vw,23px)/1.35 'DM Sans',sans-serif; padding:.65em 1em; border-radius:18px; box-shadow:0 10px 24px #0008; transform-origin: 0 50%; }
  .host .bubble::before { content:''; position:absolute; left:-10px; top:50%; margin-top:-10px; border:10px solid transparent; border-right-color:#fff; border-left:0; }
  .host .bubble b { color:var(--purple); }
  .host .bubble.pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from { transform: scale(.6); opacity:0; } }

  /* Big moments: villains, the minigame card, results, Final Climb, bonus flags, the winner */
  .overlay { position:absolute; inset:0; z-index:8; display:none; place-items:center; background:radial-gradient(circle at 50% 45%, #2a1146ee, #0e0618f2); }
  .overlay.on { display:grid; animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity:0; } }
  .card-big { width:min(78%, 980px); text-align:center; }
  .card-big .kicker { font:800 clamp(12px,1.1vw,19px)/1 'DM Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .card-big h2 { margin:.25em 0 .2em; font-family:Fraunces,serif; font-weight:900; font-size:clamp(34px,5vw,92px); line-height:1; letter-spacing:-.02em; }
  .card-big p { margin:.2em auto; max-width:46ch; font-size:clamp(14px,1.5vw,26px); line-height:1.4; color:#efe6ff; }
  .card-big .clock { font:900 clamp(40px,7vw,130px)/1 Fraunces,serif; color:var(--gold); margin-top:.15em; }
  .card-big img.villain { width:clamp(140px,22vw,380px); aspect-ratio:1; object-fit:cover; border-radius:24px; border:6px solid #fff; box-shadow:0 20px 50px #000a; animation: shake .5s ease-in-out 2; }
  @keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .squads { display:flex; justify-content:center; gap:2%; margin-top:1.4em; flex-wrap:wrap; }
  .sqc { width:clamp(90px,10vw,170px); background:#ffffff12; border:2px solid #ffffff22; border-radius:18px; padding:.7em .5em; display:grid; justify-items:center; gap:.35em; }
  .sqc .logo { width:62%; }
  .sqc b { font:900 clamp(18px,2vw,36px)/1 Fraunces,serif; }
  .sqc small { font-size:clamp(11px,.95vw,16px); color:#d9ccf2; }
  .sqc.done { border-color:var(--gold); }
  .sqc.win { border-color:var(--gold); background:#ffe10022; transform:translateY(-8px); }
  .banner { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.7); opacity:0; pointer-events:none; text-align:center; z-index:9;
    font-family:Fraunces,serif; font-weight:900; font-size:clamp(30px,5vw,86px); color:#fff; text-shadow:0 6px 30px #000c; transition: transform .4s cubic-bezier(.2,1.5,.4,1), opacity .3s; width:86%; }
  .banner.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .banner small { display:block; font-family:'DM Sans',sans-serif; font-weight:700; font-size:.3em; margin-top:.4em; color:#fff; }
  .logo { aspect-ratio:1; border-radius:22%; display:grid; place-items:center; padding:8%; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .blogo { display:block; width:max-content; margin:0 auto .2em; padding:.12em .28em; border-radius:.22em; box-shadow:0 6px 24px #0008; }
  .blogo img { display:block; height:1.3em; }
  .closed { display:grid; place-items:center; min-height:60vh; text-align:center; color:var(--mute); font-size:20px; }

  /* ── Side panel ── */
  .side { display:flex; flex-direction:column; gap:1.3vh; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; }
  .card h3 { margin:0 0 8px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); font-weight:500; }
  .turnline { font-size:clamp(15px,1.25vw,21px); line-height:1.35; }
  .auto { color:var(--mute); font-size:.85em; }
  .sq { display:grid; grid-template-columns: clamp(40px,3.3vw,58px) 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .sq:first-of-type { border-top:0; }
  .sq .name { font-weight:800; font-size:clamp(15px,1.2vw,20px); }
  .sq .bag { display:flex; gap:4px; margin-top:3px; color:var(--mute); font-size:clamp(12px,.95vw,15px); }
  .sq .bag i { color:var(--t-item); }
  .sq .nums { text-align:right; }
  .sq .f { font:900 clamp(18px,1.6vw,28px)/1 Fraunces,serif; color:var(--gold); display:flex; align-items:center; justify-content:flex-end; gap:4px; }
  .sq .c { font-family:'DM Mono',monospace; color:#ffd23f; font-size:clamp(13px,1vw,17px); display:flex; align-items:center; justify-content:flex-end; gap:3px; margin-top:3px; }
  .log div { font-size:14px; color:var(--mute); padding:4px 0; border-top:1px solid #ffffff10; }
  .log div:first-child { color:var(--ink); border-top:0; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--mute); margin-top:12px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:20px; height:20px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-size:12px; font-style:normal; font-weight:900; }
  .join { font-size:14px; color:var(--mute); line-height:1.5; }
  .join b { color:var(--ink); font-family:'DM Mono',monospace; }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:999px; padding:9px 15px; }
  .gold { background:var(--gold); color:#1a0b2e; } .ghost { background:#ffffff1a; color:var(--ink); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:end; }
  input, select { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:#0d0618; color:var(--ink); }
  input[data-pw] { width:100%; -webkit-text-security:disc; }
  label.field { font-size:13px; color:var(--mute); display:grid; gap:4px; }
  .msg { font-size:13px; color:#fca5a5; min-height:1em; margin-top:6px; }
  .confetti { position:fixed; top:-20px; width:10px; height:16px; border-radius:3px; pointer-events:none; animation:fall linear forwards; z-index:20; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display:none; } }
  .card-big .mgicon { font-size:clamp(46px,6vw,110px); color:var(--gold); line-height:1; margin-top:.2em; }
  .card-big .mgicon.land, .card-big h2.land { animation: landin .55s cubic-bezier(.34,1.56,.64,1); }
  @keyframes landin { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .card-big h2.spin { color:#d9ccf2; }
  .mgrest.wait { opacity:0; }
  .mgrest.show { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .card-big .clock.hot { color:#ff6b6b; }
  .card-big .clock.tick { animation: tick .32s cubic-bezier(.34,1.56,.64,1); }
  @keyframes tick { from { transform: scale(1.18); } }
  .card-big .mode { display:inline-block; margin-top:.6em; padding:.35em .9em; border-radius:999px; background:#e0115f; color:#fff; font:800 clamp(13px,1.3vw,22px)/1.2 'DM Sans',sans-serif; }
  .card-big .word b { color:var(--gold); font-family:Fraunces,serif; font-size:1.3em; text-transform:uppercase; }
  .mute { background:#ffffff14; border:1px solid #ffffff2a; color:#fff; border-radius:999px; font-size:clamp(16px,1.4vw,24px); padding:.3em .55em; margin-left:10px; cursor:pointer; }
  .sqc.in { animation: popin .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popin { 0% { transform: scale(.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .results .sqc { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity:0; transform: translateY(40px); } }
  .results .sqc.win .logo { animation: cheer .45s cubic-bezier(.34,1.56,.64,1) .8s 2; }
  @keyframes cheer { 50% { transform: translateY(-14%) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .card-big .mgicon.land, .card-big h2.land, .mgrest.show, .card-big .clock.tick, .sqc.in, .results .sqc, .results .sqc.win .logo { animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <div class="head"><h1>Summit Party</h1><span class="round-pill" id="roundPill">Party board</span><div class="code"><span>GAME<br>CODE</span><b id="codeBig">····</b></div></div>
    <div class="host" id="host" hidden><img id="cliffImg" alt="Cliff, the host"><div class="bubble" id="bubble"></div></div>
    <div class="table"><div class="board trail" id="box">
      <div class="layer" id="pieces"></div>
      <div class="overlay" id="overlay"></div>
      <div class="banner" id="banner"></div>
    </div></div>
    <div class="legend" id="legend"></div>
  </main>
  <aside class="side">
    <div class="card"><div class="turnline" id="turnline">Summit Party</div></div>
    <div class="card"><h3>Flags and coins</h3><div id="standings"></div></div>
    <div class="card log"><h3>On the trail</h3><div id="log"></div></div>
    <div class="card"><h3>Play on a Chromebook</h3><div class="join">One Chromebook per squad: open <b>clashofclasses.org/?page=summit-play</b>, type the game code and your 800#. Roll on your turn and play every minigame.</div></div>
    <div class="card" id="staff"></div>
  </aside>
</div>
<script>
(function () {
  var SQ = ['BLACK', 'GOLD', 'GREY', 'PURPLE'];
  var RING = { BLACK: '#e9e3f5', GOLD: '#ffd23f', GREY: '#aab3c2', PURPLE: '#c79bff' };
  var BASE = { BLACK: '#2b2633', GOLD: '#a87b00', GREY: '#5d6673', PURPLE: '#5b1a86' };
  var BASEDARK = { BLACK: '#141118', GOLD: '#5e4500', GREY: '#353b44', PURPLE: '#2f0c47' };
  var FOCUS = { BLACK: '47% 11%', GOLD: '72% 2%', GREY: '77% 11%', PURPLE: '69% 0%' };
  var ICON = { start: 'ph-tent', blue: 'ph-plus', red: 'ph-minus', event: '', item: 'ph-gift', villain: 'ph-skull', avalanche: 'ph-snowflake', shop: 'ph-storefront', duel: 'ph-sword' };
  var LABEL = { start: 'Base Camp', blue: '+3 coins', red: '-3 coins', event: 'Trail event', item: 'Item', villain: 'Opponent', avalanche: 'Avalanche', shop: 'Camp Store' };
  var ITEMICON = { double: 'ph-dice-two', compass: 'ph-compass', paws: 'ph-hand-grabbing', zipline: 'ph-arrows-left-right' };
  var VNAME = { troll: 'The Tardy Troll', litter: 'The Hallway Litter Beast', shady: 'Shady' };
  var S = null, seq = 0, token = '', busy = false, pieces = {}, flagEl = null, drawnLayout = '', drawnCode = '', code = '', LOGOS = {}, skew = 0;
  var seenHost = 0, seenMg = '', seenResult = '', seenFinal = 0, seenEnd = '', seenDuel = 0;
  try { code = sessionStorage.getItem('summit-code') || ''; token = sessionStorage.getItem('summit-admin') || ''; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function title(s) { s = String(s || ''); return s.charAt(0) + s.slice(1).toLowerCase(); }
  function run(fn) { var a = Array.prototype.slice.call(arguments, 1); return new Promise(function (ok, no) { var r = google.script.run.withSuccessHandler(function (t) { ok(JSON.parse(t)); }).withFailureHandler(no); r[fn].apply(r, a); }); }
  function msgOf(e) { return String(e && e.message || e).replace(/^Exception:\s{0,}/, ''); }
  function now() { return Date.now() + skew; }
  // ── Sound: original effects made in the browser with Web Audio (no sound files). The speaker button mutes this page. ──
  var SFX = (function () {
    var ctx = null, muted = false, on = false, level = 1;
    try { muted = localStorage.getItem('summit-mute') === '1'; } catch (e) {}
    function ac() {
      if (!ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return null; try { ctx = new A(); } catch (e) { return null; } }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(f, t, d, type, vol, f2) {
      var c = ac(); if (!c) return;
      var o = c.createOscillator(), g = c.createGain(), s = c.currentTime + (t || 0);
      o.type = type || 'square'; o.frequency.setValueAtTime(f, s);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime((vol || .1) * level, s + .012); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + .03);
    }
    function noise(t, d, vol) {
      var c = ac(); if (!c) return;
      var n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), data = b.getChannelData(0);
      for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), s = c.currentTime + (t || 0);
      f.type = 'lowpass'; f.frequency.setValueAtTime(900, s); f.frequency.exponentialRampToValueAtTime(120, s + d);
      g.gain.setValueAtTime((vol || .2) * level, s);
      src.buffer = b; src.connect(f); f.connect(g); g.connect(c.destination); src.start(s);
    }
    function seq(notes, gap, d, type, vol) { notes.forEach(function (f, i) { tone(f, i * gap, d, type, vol); }); }
    var LIB = {
      tick: function () { tone(1500, 0, .025, 'square', .03); },
      tap: function () { tone(900 + Math.random() * 120, 0, .045, 'triangle', .07); },
      hop: function () { tone(600, 0, .07, 'triangle', .07, 900); },
      dice: function () { for (var i = 0; i < 9; i++) tone(500 + Math.random() * 700, i * .07, .035, 'square', .05); },
      land: function () { tone(523, 0, .09, 'triangle', .12); tone(784, .08, .18, 'triangle', .12); },
      coin: function () { tone(988, 0, .07, 'square', .08); tone(1319, .06, .25, 'square', .08); },
      lose: function () { tone(420, 0, .3, 'sawtooth', .07, 170); },
      bonk: function () { tone(170, 0, .16, 'square', .1, 70); },
